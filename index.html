   "Begründetes eigenes Fazit, das die Perspektiven abwägt"],
  m:`Die Aussage enthält zwei Behauptungen: Die Konjunkturschwäche, also eine negative Output-Lücke, solle der Staat aktiv bekämpfen, und Abwarten senke das Produktionspotenzial dauerhaft.

Aus keynesianischer Sicht ist beides plausibel. Ein Gleichgewicht bei Unterbeschäftigung kann sich dauerhaft einstellen, weil Haushalte und Unternehmen bei Unsicherheit sparen statt ausgeben. Höhere Staatsausgaben erhöhen den Output über den Multiplikator 1/(1 − c₁) um mehr als den Impuls; sie wirken stärker als Steuersenkungen, von denen ein Teil gespart wird. Bei ungenutzten Kapazitäten verdrängen sie private Ausgaben nicht, sondern ziehen sie nach (Crowding-in). Steckt die Geldpolitik in der Nominalzins- oder Investitionsfalle, bleibt Fiskalpolitik das einzige wirksame Mittel. Für den zweiten Satz spricht das Hysterese-Argument, das besonders der Postkeynesianismus betont: Langzeitarbeitslose verlieren Qualifikationen, Unternehmen stellen Investitionen zurück, und aus der konjunkturellen Schwäche wird eine strukturelle.

Die neoklassische Sicht widerspricht. Flexible Preise, Löhne und Zinsen führen langfristig zur Vollbeschäftigung; Staatsausgaben verdrängen private Ausgaben (Crowding-out). Nach der Ricardianischen Äquivalenz der Neuklassik sparen rationale Haushalte für erwartete Steuererhöhungen, sodass der Multiplikator gegen null geht. Das Potenzial sei angebotsseitig bestimmt; Konjunkturprogramme könnten Strukturprobleme verschleiern und Reformen verschleppen.

Der Neue Konsens vermittelt: Kurzfristig bestimmt die Nachfrage den Output, langfristig das Angebot. Entsprechend erlaubt die Schuldenbremse konjunkturelle Defizite, begrenzt aber das strukturelle Defizit auf 0,35 % des BIP. Weil das Potenzial nicht beobachtbar ist, hängt die Einordnung jedoch von umstrittenen Schätzungen ab.

Fazit: Liegt tatsächlich eine Nachfrageschwäche vor und ist die Geldpolitik eingeschränkt, sprechen Multiplikator und Hysterese-Gefahr für rasches fiskalisches Handeln. Wer die Schwäche als Angebotsproblem deutet, wird dagegen Strukturreformen fordern. Die Bewertung hängt also wesentlich von der Diagnose der Output-Lücke ab.`},
 {id:"e5-2", pts:18, klausur:"Aufgabenblatt 5, Aufgabe 6",
  q:"In der Debatte um die Schuldenbremse heißt es, sie „schütze die Menschen vor Belastungen in der Zukunft“. Bewerten Sie diese Aussage mithilfe Ihres Wissens über das staatliche Haushaltsdefizit und die Schuldenstandquote.",
  k:[
   "Maßstab ist die Schuldenstandquote, nicht die absolute Schuld",
   "Schuldenmechanik D = d/g: Ein dauerhaftes Defizit ist bei Wachstum mit stabiler Quote vereinbar (3 %/5 % → 60 %)",
   "Pro: steigende Zinslast kann künftige Haushalte einengen",
   "Pro aus neoklassischer Sicht: Crowding-out, Ricardianische Äquivalenz",
   "Contra: Sparpolitik kann über den Multiplikator das Wachstum senken und die Quote erhöhen",
   "Contra: unterlassene Investitionen in Infrastruktur und Bildung belasten künftige Generationen ebenfalls",
   "Contra: Hysterese, eine verschleppte Krise senkt das Potenzial dauerhaft",
   "Contra: Staatsschulden sind zugleich Vermögen des Privatsektors; Defizit des Staates entspricht dem Überschusswunsch der Privaten",
   "Begründetes Fazit"],
  m:`Die Aussage unterstellt, dass staatliche Schulden künftige Generationen belasten. Entscheidend ist aber nicht die absolute Schuld, sondern die Schuldenstandquote. Nach der Schuldenmechanik D = d/g konvergiert sie gegen das Verhältnis von Defizitquote und nominalem Wachstum. Ein Defizit von 3 % bei 5 % Wachstum ergibt dauerhaft 60 %. Ein Staat kann also dauerhaft Defizite machen, ohne dass die Last relativ zur Wirtschaftsleistung steigt.

Für die Aussage spricht, dass eine hohe Quote die Zinslast erhöht und künftige Haushalte einengen kann. Aus neoklassischer Sicht verdrängen Staatsausgaben private Investitionen, und nach der Ricardianischen Äquivalenz bringen sie ohnehin wenig.

Dagegen spricht erstens, dass Sparpolitik in einer Schwächephase über den Multiplikator das BIP-Wachstum senkt; der Nenner schrumpft, und die Quote kann sogar steigen. Zweitens belasten auch unterlassene Investitionen in Infrastruktur, Bildung und Klimaschutz künftige Generationen. Drittens kann eine verschleppte Krise über Hysterese das Potenzial dauerhaft senken. Schließlich sind Staatsschulden zugleich Vermögen des privaten Sektors: Will dieser Überschüsse erzielen, muss ein anderer Sektor Defizite machen.

Fazit: Die Schuldenbremse kann vor einer unkontrollierten Zinslast schützen. Ob sie künftige Generationen insgesamt entlastet, hängt aber davon ab, wofür Kredite verwendet würden und ob Sparen in der Krise das Wachstum abwürgt. Pauschal lässt sich die Aussage aus Sicht der Vorlesung nicht halten.`}

LESSONS[1]=[
{id:"1-1", t:"Mikro, Makro und drei Blickwinkel", html:`
<p>Die <b>Mikroökonomik</b> betrachtet einzelne Entscheidungsträger und ihre Entscheidungen:</p>
<ul><li>Wie viel arbeitet und spart ein Haushalt?</li><li>Was und wie produziert ein Unternehmen?</li><li>Welche Regeln setzt eine staatliche Organisation?</li></ul>
<p>Die <b>Makroökonomik</b> betrachtet gesamtwirtschaftliche Aggregate <span class="pz">(Größen, die für ganze Sektoren zusammengefasst werden)</span>:</p>
<div class="dlist"><b>Sektoren</b><span>private Haushalte, Unternehmen, Staat</span><b>Entwicklungen</b><span><ul style="margin:0"><li>Wachstum und Inflation</li><li>Arbeitslosigkeit</li><li>Exporte, Importe, Finanzkrisen</li><li>Einkommens- und Vermögensverteilung</li><li>Gewinne und Investitionen</li><li>Staatsverschuldung, CO₂-Emissionen</li></ul></span></div>
<p>Die Grenzen zwischen Mikro und Makro sind fließend.</p>
<h3>Drei Blickwinkel</h3>
<p>Auf wen muss ich schauen, wenn ich Wirtschaft verstehen will?</p>
<table class="kv">
<tr><td>Individualismus</td><td>Eine Gesellschaft besteht nur aus Individuen. Jede Erklärung sozialer Fakten beruht auf der Erklärung individuellen Verhaltens (methodologischer Individualismus).</td></tr>
<tr><td>Holismus</td><td>Die Gesellschaft hat eigene, nicht auf Individuen reduzierbare Eigenschaften. Soziale Ganzheiten bestimmen das individuelle Verhalten.</td></tr>
<tr><td>Systemismus</td><td>Die Gesellschaft ist ein System aus sich wandelnden Subsystemen. Untersucht werden Aufbau, Umfeld, Struktur und die Mechanismen, die sie hervorbringen. Individuen werden nicht geleugnet, Systemdynamiken gelten aber als prägender.</td></tr></table>
<div class="merk"><b>Sozioökonomie</b>Die Vorlesung folgt einem sozioökonomischen Ansatz: wissenschaftlicher Realismus (Wirtschaft und Gesellschaft sind verbunden), Systemismus und Pluralismus, also die Vielfalt von Disziplinen, Theorien und Methoden.</div>`,

{id:"1-2", t:"Die Paradigmen der Makroökonomik", html:`
<p>In der Vorlesung werden diese Denkschulen gegenübergestellt:</p>
<table class="kv">
<tr><td>Physiokraten</td><td>18. Jh., François Quesnay: Tableau Économique, Wirtschaftskreislauf in Analogie zum Blutkreislauf, Beziehungen zwischen Klassen.</td></tr>
<tr><td>Klassik</td><td>Adam Smith, David Ricardo, John Stuart Mill: Produktivität, Wachstum und Verteilung des Wohlstands zwischen Klassen (Arbeiter, Unternehmer, Rentiers).</td></tr>
<tr><td>Marxismus</td><td>Karl Marx: Wachstum und Verteilung, Ausbeutung, Krisen.</td></tr>
<tr><td>Neoklassik</td><td>19. Jh., Walras, Gossen, Marshall: homo oeconomicus, Individuen statt Klassen, Ziel Effizienz, angebotsbestimmtes Gleichgewicht, Laisser-faire.</td></tr>
<tr><td>Keynesianismus</td><td>John Maynard Keynes, 1936: Makroebene, Nachfrage bestimmt Produktion und Beschäftigung.</td></tr>
<tr><td>Neoklassische Synthese</td><td>1940–60: keynesianische Phänomene als Spezialfälle in neoklassischer Theorie („Bastard-Keynesianismus“).</td></tr>
<tr><td>Österreichische Schule</td><td>Friedrich August von Hayek: Gegenspieler von Keynes, libertäre Kritik, Begründung des Neoliberalismus.</td></tr>
<tr><td>Monetarismus und Neuklassik</td><td>1960–80, Milton Friedman, Robert Lucas: Selbstregelungskraft des Marktes, Ablehnung staatlicher Konjunktursteuerung, „neoklassische Gegenrevolution“ im Kontext der Stagflation.</td></tr>
<tr><td>Neukeynesianismus</td><td>Krugman, Stiglitz, Mankiw: „Neuer Konsens“, kurzfristig keynesianisch (Konjunkturpolitik), langfristig neoklassisch (Strukturpolitik).</td></tr>
<tr><td>Postkeynesianismus</td><td>Fundamentale Unsicherheit, Macht und Konflikt: Ökonomien als produktive, aber instabile Systeme.</td></tr></table>
<div class="merk"><b>Die Achse der Vorlesung</b>Im Zentrum steht der Streit zwischen Neoklassik und Keynesianismus. Beide Seiten haben heutige Nachfolger:<ul style="margin:.3em 0 0"><li>Neoklassik (19. Jh.) → Neukeynesianismus / Neuer Konsens (heute)</li><li>Klassik, Marxismus (18./19. Jh.) und Keynesianismus (20. Jh.) → Postkeynesianismus (heute)</li></ul></div>`,
check:[
 {q:"Welche Denkschule verbindet kurzfristig keynesianische mit langfristig neoklassischen Prinzipien?", o:["Monetarismus","Neukeynesianismus / Neuer Konsens","Physiokratie","Österreichische Schule"], a:1, ex:"Kurze Frist: Konjunkturpolitik. Lange Frist: Strukturpolitik. Das ist der heutige Mainstream.", w:["Der Monetarismus lehnt staatliche Konjunktursteuerung ab, auch kurzfristig.", null, "Die Physiokraten (18. Jh., Quesnay) kannten diese Unterscheidung noch nicht.", "Die Österreichische Schule um Hayek lehnt keynesianische Politik grundsätzlich ab."]},
 {q:"Wer gilt als Gegenspieler von Keynes und Begründer des Neoliberalismus?", o:["Milton Friedman","Friedrich August von Hayek","Paul Samuelson","Michał Kalecki"], a:1, ex:"Hayek, Österreichische Schule. Friedman prägte später den Monetarismus.", w:["Friedman prägte später den Monetarismus. Der direkte Gegenspieler von Keynes in den 1930ern war Hayek.", null, "Samuelson steht für die Neoklassische Synthese: Er verband Keynes mit der Neoklassik.", "Kalecki entwickelte ähnliche Ideen wie Keynes, er war kein Gegenspieler."]}
]},
{id:"1-3", t:"Wirtschaftsgeschichte im Zeitraffer", html:`
<p>Über Jahrtausende wuchs das BIP pro Kopf kaum. Mit der <b>Industriellen Revolution (ca. 1760–1850)</b> knickt die Kurve steil nach oben („history's hockey stick“). Die Vorlesung konzentriert sich auf das 19. bis 21. Jahrhundert:</p>
<table class="kv">
<tr><td>1860–1914</td><td>Erste Globalisierung: Goldstandard, internationaler Finanzmarkt, Laisser-faire und Minimalstaat, „100 Jahre Frieden“ (1815–1914).</td></tr>
<tr><td>1914–1945</td><td>Kriege und Krisen: Hyperinflation in Deutschland bis 1923, Weltwirtschaftskrise ab 1929 mit Deflation und Massenarbeitslosigkeit, Ende des Goldstandards, Keynesianismus.</td></tr>
<tr><td>1945–1975</td><td>Goldenes Zeitalter: Wohlfahrtsstaat und Kapitalismus, Vollbeschäftigung, sinkende Ungleichheit.</td></tr>
<tr><td>1970er</td><td>Ölpreisschocks und Stagflation (Inflation und Arbeitslosigkeit zugleich).</td></tr>
<tr><td>ab 1975</td><td>Zweite Globalisierung, neoliberale Epoche: Finanzialisierung, Outsourcing, Standortwettbewerb, steigende Ungleichheit.</td></tr>
<tr><td>2007–2008</td><td>Weltfinanzkrise: Bankenrettungen und Konjunkturprogramme, „Rückkehr des Staates“.</td></tr>
<tr><td>2010–2012</td><td>Krise der Europäischen Währungsunion, Austeritätspolitik.</td></tr></table>
<h3>Welche Denkschule dominierte?</h3>
<ol class="steps"><li>Bis in die 1930er: pluralistische Phase <span class="pz">(mehrere Denkschulen nebeneinander)</span></li><li>1930er bis 1970er: (Neo-)Keynesianismus</li><li>Ab der Stagflation der 1970er: Monetarismus und neoklassische Dominanz, später Neukeynesianismus</li><li>Seit der Finanzkrise 2007: Ende der neoklassischen Dominanz</li></ol>
<div class="merk"><b>Wiederholungsfrage der Vorlesung</b>Die Nationalsozialisten kamen 1933 in einer Phase der <b>Deflation</b> und Massenarbeitslosigkeit an die Macht, nicht während der Hyperinflation 1923.</div>`,
check:[
 {q:"Was geschah 1929?", o:["Die Ölpreiskrise","Der Beginn der Weltwirtschaftskrise","Die Einführung des Euro","Das Ende von Bretton Woods"], a:1, ex:"Der Börsencrash 1929 leitete die Große Depression mit Deflation und Massenarbeitslosigkeit ein.", w:["Die Ölpreisschocks kamen in den 1970er Jahren.", null, "Der Euro kam erst 1999.", "Das Währungssystem von Bretton Woods endete Anfang der 1970er Jahre."]},
 {q:"Welches Paradigma dominierte im „Goldenen Zeitalter“ 1945–1975?", o:["Monetarismus","Keynesianismus","Physiokratie","Neuklassik"], a:1, ex:"Nixon 1972: „We are all Keynesians now.“ Die Gegenrevolution kam erst mit der Stagflation.", w:["Der Monetarismus setzte sich erst mit der Stagflation der 1970er durch.", null, "Die Physiokraten gehören ins 18. Jahrhundert.", "Die Neuklassik (Lucas) kam erst in den 1970er und 1980er Jahren auf."]}
]},
{id:"1-4", t:"Ökonomik im Schulunterricht: Beutelsbacher Konsens", html:`
<p>Für dich als Lehrkraft besonders wichtig: Der <b>Beutelsbacher Konsens</b> (1976) setzt drei Grundsätze für politische Bildung.</p>
<ul><li><b>Überwältigungsverbot</b>: Schüler:innen dürfen nicht im Sinne erwünschter Meinungen überrumpelt und an einem selbstständigen Urteil gehindert werden. Hier verläuft die Grenze zur Indoktrination.</li>
<li><b>Kontroversitätsgebot</b>: Was in Wissenschaft und Politik kontrovers ist, muss auch im Unterricht kontrovers erscheinen.</li>
<li><b>Schülerorientierung</b>: Schüler:innen sollen eine politische Situation und ihre eigene Interessenlage analysieren und nach Wegen suchen können, sie in ihrem Sinne zu beeinflussen.</li></ul>
<p>Der Kernlehrplan Sozialwissenschaften (Sek. II, NRW) beschreibt als Leitbild mündige Staats- und Wirtschaftsbürger:innen mit umfassender sozialwissenschaftlicher Kompetenz. Schüler:innen sollen etwa den homo oeconomicus auf seine Tragfähigkeit hin bewerten und kontroverse Positionen zu staatlichen Eingriffen erörtern. Die Vorlesung deutet das als <b>sozioökonomisches</b>, nicht rein neoklassisches Leitbild.</p>
<p>Die Makro-Vorlesung deckt vor allem das <b>Inhaltsfeld 4 Wirtschaftspolitik</b> ab. Wo die Themen in der Vorlesung vorkommen:</p>
<div class="dlist"><b>Legitimation staatlichen Handelns</b><span>Geschichte und Paradigmen</span><b>Zielgrößen, qualitatives Wachstum</b><span>Volkswirtschaftliche Gesamtrechnung</span><b>Konjunkturschwankungen</b><span>Gesamtrechnung und keynesianisches Modell</span><b>Wirtschaftspolitische Konzeptionen</b><span>Klassik, Neoklassik und Keynes; Neuer Konsens; Postkeynesianismus</span><b>Instrumente</b><span>Geld- und Fiskalpolitik, Neuer Konsens, Postkeynesianismus</span></div>`,
check:[
 {q:"Welcher Grundsatz verlangt, dass Kontroverses auch im Unterricht kontrovers erscheint?", o:["Überwältigungsverbot","Kontroversitätsgebot","Schülerorientierung","Neutralitätsgebot"], a:1, ex:"Was in Wissenschaft und Politik kontrovers ist, muss auch im Unterricht kontrovers erscheinen. Fallen Standpunkte unter den Tisch, ist der Weg zur Indoktrination beschritten.", w:["Das Überwältigungsverbot verbietet, Schüler:innen eine Meinung aufzudrängen. Es geht um ihr eigenes Urteil, nicht um die Darstellung von Positionen.", null, "Schülerorientierung heißt: die eigene Interessenlage analysieren und Einfluss nehmen können.", "Ein Neutralitätsgebot gehört nicht zum Beutelsbacher Konsens. Lehrkräfte dürfen eine Meinung haben, nur nicht aufdrängen."]}
]},
{id:"1-5", t:"Warum mehrere Paradigmen?", html:`
<p>Die Vorlesung stellt die Perspektiven verschiedener Paradigmen gegenüber, weil</p>
<ul><li>es gute wissenschaftstheoretische Gründe für <b>Pluralismus</b> gibt: Fallibilismus (Wissen kann falsch sein), Vielschichtigkeit sozialer Realität, rationale Theoriewahl,</li>
<li>der Beutelsbacher Konsens und der Kernlehrplan ein sozioökonomisches Leitbild vorgeben,</li>
<li>die Phase neoklassischer Dominanz mit den jüngeren Krisen (Finanz-, Euro-, ökologische, Ungleichheits-, Demokratiekrise) ein Ende gefunden hat.</li></ul>
<p>Im Zentrum steht das <b>keynesianische Modell</b>, weil Keynes als Begründer der modernen Makroökonomik gilt. Beleuchtet wird vor allem der Streit zwischen Neoklassik und Keynesianismus, weniger ausführlich auch die marxistische Ökonomik. Die heutigen Strömungen ordnen sich so ein:</p>
<div class="dlist"><b>Neuklassik, Neukeynesianismus</b><span>Erweiterungen der Neoklassik</span><b>Postkeynesianismus</b><span>Erweiterung des Keynesianismus, nimmt auch marxistische Elemente auf</span></div>
<div class="merk"><b>Für den Essay</b>Teil III fragt immer nach „unterschiedlichen theoretischen Perspektiven“. Wer die Paradigmen sauber auseinanderhält, hat schon die halbe Gliederung.</div>`,
check:[
 {q:"Welche Strömung nimmt laut Vorlesung marxistische Elemente in einen keynesianischen Rahmen auf?", o:["Neukeynesianismus","Postkeynesianismus","Monetarismus","Neoklassische Synthese"], a:1, ex:"Etwa die Bedeutung der Verteilung zwischen Klassen für Nachfrage und Wachstum (Kalecki).", w:["Der Neukeynesianismus ist eine Erweiterung der Neoklassik, ohne marxistische Elemente.", null, "Der Monetarismus gehört zur neoklassischen Seite.", "Die Neoklassische Synthese baut keynesianische Ideen in die Neoklassik ein, keine marxistischen."]}
]}
];

LESSONS[2]=[
{id:"2-1", t:"Identitäten: keine schwarzen Löcher", html:`
<p>„Respect for identities is the first piece of wisdom that distinguishes economists … The second? Identities say nothing about causation.“ (James Tobin)</p>
<ul><li><b>Identitäten</b> sind Gleichungen, die immer gelten, unabhängig von der Theorie. Sie sind kaum mehr als Definitionen.</li>
<li>Wer sie nicht beachtet, erzählt Unsinn. Aber sie sagen <b>nichts über Kausalitäten</b>.</li>
<li>Eine Theorie ergänzt Identitäten um <b>Verhaltensgleichungen</b>, etwa die Konsumfunktion.</li></ul>
<div class="merk"><b>Binsenweisheit</b>Es gibt keine schwarzen Löcher: Alles kommt irgendwo her und geht irgendwo hin.<ul style="margin:.3em 0 0"><li>Nicht alle können gleichzeitig weniger (oder mehr) ausgeben, als sie einnehmen.</li><li>Die Kreditvergabe der einen ist die Neuverschuldung der anderen.</li><li>Die Summe der Geldvermögen aller ist immer null.</li></ul></div>
<h3>Ströme und Bestände</h3>
${cmp([["","Stromgröße","Bestandsgröße"],["Misst","Transaktionen in einem Zeitraum (meist ein Jahr)","Bestände zu einem Zeitpunkt"],["Beispiele","BIP, Konsum, Investitionen, Exporte, Importe, Löhne, Kapitaleinkommen, Haushaltsdefizit","Vermögen der Haushalte, Unternehmensverschuldung, Staatsverschuldung, Wert des Kapitalstocks"],["Bild","das Wasser, das pro Minute aus dem Hahn fließt","der Wasserstand in der Badewanne"]])}
<p>„Economics is the science of confusing stocks with flows“ (Kalecki). Bekannte Mischgrößen sind die Schuldenstandquote (Staatsschuld / BIP) und die Schuldenquote der Haushalte (Verschuldung / verfügbares Einkommen).</p>`,
check:[
 {q:"Welche Größe ist eine Bestandsgröße?", o:["Bruttoinlandsprodukt","Privater Konsum","Staatsverschuldung","Exportüberschuss"], a:2, ex:"Die Staatsschuld wird zu einem Zeitpunkt gemessen. Sie ist die Summe vergangener Defizite (Stromgrößen).", w:["Das BIP misst die Produktion eines Jahres, also einen Strom.", "Konsum fließt über einen Zeitraum, ist also ein Strom.", null, "Der Exportüberschuss eines Jahres ist ein Strom. Erst die Summe vieler Jahre ergibt einen Bestand, das Auslandsvermögen."]},
 {q:"Was sagen Identitäten über Kausalität?", o:["Sie legen die Wirkungsrichtung fest","Nichts","Sie gelten nur in der Neoklassik","Sie gelten nur langfristig"], a:1, ex:"Identitäten gelten immer, sagen aber nichts darüber, was was verursacht. Genau darüber streiten die Paradigmen, etwa bei S = I.", w:["Gerade nicht: S = I sagt nicht, ob S die Investitionen bestimmt oder umgekehrt.", null, "Identitäten gelten in jeder Theorie, sie sind kaum mehr als Definitionen.", "Identitäten gelten in jeder Periode, kurz- wie langfristig."]}
]},
{id:"2-2", t:"BIP: brutto, netto, nominal, real", html:`
<p>Es gibt drei Definitionen von Y:</p>
<ul><li><b>Y<sup>A</sup></b>: BIP als Marktwert aller im Inland innerhalb eines Jahres produzierten Güter und Dienstleistungen (Output)</li>
<li><b>Y<sup>N</sup></b>: BIP als gesamtwirtschaftliche Nachfrage nach im Inland produzierten Gütern</li>
<li><b>Y<sup>VT</sup></b>: Bruttonationaleinkommen, alle von Inländer:innen bezogenen Einkommen</li></ul>
<p><b>Brutto oder netto?</b> Zieht man die Abschreibungen (Wertverlust des Kapitalstocks durch Alterung) ab, erhält man Nettoinlandsprodukt bzw. Nettonationaleinkommen. Die Vorlesung nutzt das Bruttokonzept.</p>
<p><b>Nominal oder real?</b> Das nominale BIP ist das BIP zu laufenden Preisen, das reale BIP das BIP in Preisen eines Basisjahres. Es gilt ungefähr:</p>
<div class="eq">reales Wachstum ≈ nominales Wachstum − Inflation</div>
${bsp("Beispiel",[["Gegeben","nominales Wachstum 4 %, Inflation 1 %"],["Rechnung","$ 4 % − 1 % = 3 %"],["Ergebnis","reales Wachstum etwa 3 %"]])}
<p><b>Faustregel:</b> Bei 2 % realem Wachstum verdoppelt sich das reale BIP nach etwa 35 Jahren.</p>
<div class="merk"><b>Kritik am realen BIP</b>Vergleiche über lange Zeiträume sind heikel:<ul style="margin:.3em 0"><li>Preise, Mengen und Qualität ändern sich.</li><li>Neue Produkte kommen hinzu, alte verschwinden.</li><li>Die Digitalisierung erschwert die Messung (etwa beim Smartphone).</li></ul>Im Zahlenbeispiel der Vorlesung liefert dieselbe Datenlage je nach Methode 0,35 % oder 4,6 % Wachstum pro Jahr.</div>`,
check:[
 {q:"Das nominale BIP wächst um 5 %, die Inflation beträgt 2 %. Wie hoch ist das reale Wachstum ungefähr?", o:["7 %","3 %","2,5 %","10 %"], a:1, ex:"Reales Wachstum ≈ nominales Wachstum − Inflation = 5 % − 2 % = 3 %.", w:["7 % = 5 % + 2 %: Die Inflation muss abgezogen werden, nicht addiert.", null, "2,5 % = 5 % / 2: Die Inflation wird abgezogen, nicht geteilt.", "10 % = 5 % · 2 hat mit der Regel nichts zu tun."]},
 {q:"Was ist der Unterschied zwischen brutto und netto?", o:["Steuern","Abschreibungen","Transfers","Importe"], a:1, ex:"Netto = brutto minus Abschreibungen (Wertverlust von Maschinen und Gebäuden).", w:["Beim Lohn heißt netto „nach Steuern“. Beim BIP geht es um die Abschreibungen.", null, "Transfers verteilen Einkommen um. Mit brutto und netto beim BIP haben sie nichts zu tun.", "Importe gehören zur Verwendungsseite (X − M), nicht zum Unterschied brutto/netto."]}
]},
{id:"2-3", t:"Die drei Seiten des BIP", html:`
<table class="kv">
<tr><td>Entstehung</td><td>Y<sup>A</sup> = (Y/H) · H: Produktivität mal gearbeitete Stunden</td></tr>
<tr><td>Verwendung</td><td>Y<sup>N</sup> = C + I + G + (X − M): Konsum, private Investitionen, staatliche Ausgaben für Güter und Dienstleistungen, Nettoexporte</td></tr>
<tr><td>Verteilung</td><td>funktional Y<sup>VT</sup> = W + Π, sektoral Y<sup>VT</sup> = Y<sub>HH</sub> + Y<sub>F</sub> + Y<sub>St</sub>, dazu die personelle Verteilung</td></tr></table>
<ul><li><b>Y<sub>HH</sub></b>: verfügbare Einkommen der Haushalte = Löhne + Kapitaleinkommen + Transfers − Steuern und Abgaben</li>
<li><b>Y<sub>F</sub></b>: verfügbare Einkommen der Unternehmen = einbehaltene Gewinne + Subventionen − Steuern und Abgaben</li>
<li><b>Y<sub>St</sub></b>: Einkommen des Staates = T − Z, Steuern und Abgaben minus Transfers und Subventionen</li></ul>
<div class="eq">Y<sup>A</sup> = Y<sup>N</sup> = Y<sup>VT</sup></div>
<p>Makroökonomisches Denken ist Denken in Kreisläufen:</p>
<ol class="steps"><li>Die Produktion entsteht durch Arbeit.</li><li>Die Einkommen werden an Haushalte, Unternehmen und Staat verteilt.</li><li>Sie werden für Konsum, Investitionen, Staatsnachfrage und Nettoexporte verwendet.</li></ol>
<p>Über Kausalitäten ist damit noch nichts gesagt.</p>
${bsp("Zahlenbeispiel aus dem Skript",[["Verwendung","$ C + I + G + (X − M) = 60 + 13 + 20 + 7 = 100"],["Funktional","$ W + Π = 55 + 45 = 100"],["Sektoral","$ Y_HH + Y_F + Y_St = 67 + 15 + 18 = 100"],["Ergebnis","Alle Seiten ergeben dasselbe Y = 100."]])}`,
check:[
 {q:"Y = 100, C = 60, I = 13, X − M = 7. Wie hoch ist G?", o:["13","20","27","33"], a:1, ex:"G = Y − C − I − (X − M) = 100 − 60 − 13 − 7 = 20.", w:["13 ist der Wert der Investitionen I.", null, "27 = 100 − 60 − 13: Die Nettoexporte von 7 wurden vergessen.", "33 = 100 − 60 − 7: Die Investitionen von 13 wurden vergessen."]},
 {q:"Wie ist Y<sub>St</sub> definiert?", o:["Steuern","Staatsausgaben G","Steuern und Abgaben minus Transfers und Subventionen","Staatsschuld"], a:2, ex:"Y_St = T − Z: Steuern und Abgaben minus die Transfers und Subventionen, die der Staat weitergibt.", w:["Die Steuern allein reichen nicht: Transfers und Subventionen, die der Staat zahlt, gehen davon ab.", "G sind die Ausgaben des Staates für Güter, also die Verwendung, nicht sein Einkommen.", null, "Die Staatsschuld ist eine Bestandsgröße. Y_St ist ein Einkommen pro Jahr."]}
]},
{id:"2-4", t:"Eine besonders wichtige Identität: S = I", html:`
<p>In einer geschlossenen Volkswirtschaft ohne Staat gilt Y<sup>N</sup> = C + I und Y<sup>VT</sup> = Y<sub>HH</sub> + Y<sub>F</sub>. Aus Y<sup>N</sup> = Y<sup>VT</sup> folgt</p>
<div class="eq">Y<sub>HH</sub> + Y<sub>F</sub> − C = I</div>
<p>Die nicht konsumierten Einkommen sind die Ersparnis S. Also gilt zwingend <b>S = I</b>: Die gesamtwirtschaftliche Ersparnis ist immer genau so groß wie die Investitionen. Eine Volkswirtschaft kann nur sparen, indem sie investiert.</p>
<p>Ein einzelner Haushalt kann dagegen sparen, ohne zu investieren, etwa auf dem Konto. Wollten aber alle nur noch Geld sparen und nichts konsumieren oder investieren, wäre Y = C + I = 0, also auch das Einkommen null, und gespart würde nichts.</p>
<div class="merk"><b>Die große Streitfrage</b>S = I ist eine Identität. Kontrovers ist die Kausalität: S → I (Neoklassik: Ersparnis finanziert über den Zins die Investitionen) oder I → S (Keynesianismus: Investitionen schaffen über das Einkommen die Ersparnis). „Sag mir, was du über die Kausalität von S = I denkst, und ich sage dir, was für ein Ökonom du bist.“</div>`,
check:[
 {q:"Welche Kausalität nimmt die keynesianische Theorie an?", o:["S → I","I → S","Keine","Beide gleichzeitig"], a:1, ex:"Investitionen erhöhen über den Multiplikator das Einkommen, und davon wird mehr gespart.", w:["S → I ist die neoklassische Sicht: Ersparnis finanziert über den Zins die Investitionen.", null, "S = I gilt als Identität immer. Über die Kausalität haben die Schulen aber klare Annahmen.", "Jede Schule nimmt eine Richtung an. Genau das macht den Streit aus."]}
]},
{id:"2-5", t:"Finanzierungssalden: Überschüsse gibt es nur paarweise", html:`
<p>In einer offenen Volkswirtschaft mit Staat folgt aus Y<sub>HH</sub> + Y<sub>F</sub> + Y<sub>St</sub> = C + I + G + (X − M):</p>
<div class="eq">(Y<sub>HH</sub> + Y<sub>F</sub> − C − I) + (Y<sub>St</sub> − G) + (M − X) = 0</div>
<p>Die <b>Finanzierungssalden</b> (Einnahmen minus Ausgaben) von Privatsektor, Staat und Ausland addieren sich in jeder Periode zu null. Dabei gilt X − M = Nettoexporte = Leistungsbilanz, wenn man internationale Einkommensströme vernachlässigt.</p>
${bsp("Beispiel aus dem Skript",[["Gegeben","Staat −2 % des BIP, Privatsektor +9 %"],["Gesucht","Saldo des Auslands"],["Rechnung","$ FS_P + FS_St + FS_AL = 0\n$ 9 % − 2 % + FS_AL = 0 ⇒ FS_AL = −7 %"],["Ergebnis","Ausland −7 %, das Inland hat einen Leistungsbilanzüberschuss von 7 %."],["Deutung","Das Ausland verschuldet sich beim Inland."]])}
<div class="merk"><b>Merksatz</b>Ist der Überschuss des Privatsektors größer als das Defizit des Staates, hat das Land einen Leistungsbilanzüberschuss. Nicht alle Wirtschaftssubjekte, nicht alle Länder können gleichzeitig Überschüsse erzielen. Die Leistungsbilanz der Erde ist immer null.</div>
<p>Für die Klausur heißt das: Kennst du zwei der drei Salden, kennst du den dritten. Etwa: Leistungsbilanz ausgeglichen, Privatsektor +5 % → Staat −5 %.</p>`,
check:[
 {q:"Land A hat eine ausgeglichene Leistungsbilanz, der Privatsektor einen Finanzierungsüberschuss von 5 % des BIP. Wie hoch ist der Saldo des Staates?", o:["+5 %","0 %","−5 %","−10 %"], a:2, ex:"FS_P + FS_St = X − M = 0, also FS_St = −5 %. So kam es in der Klausur 2024 (Zweittermin).", w:["+5 % ist der Saldo des Privatsektors. Der Staat muss das Gegenstück bilden.", "0 % ginge nur, wenn auch der Privatsektor ausgeglichen wäre.", null, "−10 % würde einen Leistungsbilanzüberschuss erfordern. Die Leistungsbilanz ist hier aber ausgeglichen."]},
 {q:"Land A hat ein Leistungsbilanzdefizit von 7 %, der Staat einen ausgeglichenen Haushalt. Was gilt für den Privatsektor?", o:["Überschuss von 7 %","Defizit von 7 %","Ausgeglichen","Nicht bestimmbar"], a:1, ex:"FS_P = (X − M) − FS_St = −7 % − 0 = −7 %. Der Privatsektor verschuldet sich.", w:["Vorzeichen verwechselt: Ein Leistungsbilanzdefizit heißt, das Inland verschuldet sich. Ist der Staat ausgeglichen, muss es der Privatsektor sein.", null, "Dann wären alle drei Salden null. Die Leistungsbilanz hat aber ein Defizit von 7 %.", "Zwei der drei Salden sind bekannt. Der dritte folgt immer aus der Identität."]}
]},
{id:"2-6", t:"Staatsverschuldung im Kreislauf", html:`
<p>Aus den Identitäten folgen einige logische Implikationen:</p>
<ul><li>Darf sich der Staat nicht verschulden (Schuldenbremse), kann der Privatsektor keine finanzielle Ersparnis bilden, es sei denn, das Ausland verschuldet sich.</li>
<li>Viele Sparer bevorzugen sichere Staatsanleihen, etwa für die Altersvorsorge.</li>
<li>Wünschen die Wähler:innen staatliche Leistungen, sind die nötigen Steuern aber nicht durchsetzbar, ist Verschuldung „der einfachere Weg“.</li>
<li><b>Generationengerechtigkeit?</b> Vererbt werden Staatsschulden <i>und</i> private Vermögen. Höhere Staatsschulden verschärfen allenfalls Verteilungskonflikte <i>innerhalb</i> der nächsten Generation: Künftige Steuerzahler:innen zahlen Zinsen an die Erben der heute Vermögenden.</li></ul>
<p>Die Schuldenformel D = d/g (Thema bei der Fiskalpolitik) zeigt: Bei 5 % nominalem Wachstum und 3 % Defizit bleibt die Schuldenstandquote dauerhaft bei 60 %, der Logik des Stabilitäts- und Wachstumspakts (SWP: Defizit nie über 3 %, Schuldenstand nie über 60 % des BIP).</p>`,
check:[
 {q:"Die Schuldenbremse verbietet dem Staat Defizite, das Ausland verschuldet sich nicht. Was folgt?", o:["Der Privatsektor kann trotzdem Geldvermögen aufbauen","Der Privatsektor kann insgesamt keine finanziellen Überschüsse bilden","Die Investitionen steigen automatisch","Die Schuldenstandquote steigt"], a:1, ex:"FS_P + FS_St + FS_AL = 0. Sind FS_St und FS_AL null, ist auch FS_P null.", w:["Geldvermögen der Privaten sind Schulden von jemand anderem. Ohne Schulden von Staat oder Ausland gibt es keine.", null, "Die Identität sagt nichts über die Höhe der Investitionen.", "Ohne Defizite steigt die Schuld nicht. Bei Wachstum sinkt die Quote sogar."]}
]},
{id:"2-7", t:"Die Eurokrise mit der VGR gelesen", html:`
<p>Vor 2007 erfüllten die Krisenstaaten Portugal, Irland, Griechenland und Spanien (außer Griechenland) weitgehend die Vorgaben des SWP <span class="pz">(Stabilitäts- und Wachstumspakt)</span>:</p>
${cmp([["Staatsschuld in % des BIP","1999","2007"],["Spanien","über 60 %","unter 40 %"],["Irland","knapp 50 %","unter 30 %"]])}
<p>Deutschlands Quote stieg im selben Zeitraum auf über 60 %. Die EU-Kommission lobte 2007 Spanien und Irland als Vorbilder und hielt Deutschland für riskant.</p>
<p>Das eigentliche Problem waren die <b>Leistungsbilanzen</b>: hohe Defizite in den Krisenstaaten, hohe Überschüsse in Deutschland. Bei kleinen Staatsdefiziten und großen Leistungsbilanzdefiziten musste sich nach der Salden-Identität der <b>Privatsektor</b> verschulden.</p>
<p>Nach 2007 platzten die privaten Kreditblasen. Die Staatsschulden stiegen rasant, aus zwei Gründen:</p>
<div class="dlist"><b>Bestände</b><span>Die Staaten übernahmen die Schulden maroder Banken.</span><b>Ströme</b><span>Die Steuereinnahmen brachen in der Rezession <span class="pz">(Wirtschaftseinbruch)</span> ein.</span></div>
<div class="merk"><b>Fazit der Vorlesung</b>Steigende Staatsverschuldung war Folge, nicht Ursache der Eurokrise. Der Privatsektor der Krisenstaaten lebte „über seine Verhältnisse“, und das heißt zwingend: Andere lebten „unter ihren Verhältnissen“. Der deutsche Privatsektor baut jedes Jahr mehr Vermögen auf, als sich der deutsche Staat neu verschuldet, also auch gegenüber dem Ausland. Wenn das Bild überhaupt taugt, misst die Leistungsbilanz, ob ein Land insgesamt über oder unter seinen Verhältnissen lebt.</div>`,
check:[
 {q:"Was ist laut Vorlesung die Rolle der Staatsverschuldung in der Eurokrise?", o:["Hauptursache","Folge der Krise","Unbedeutend","Folge zu hoher Exporte der Krisenstaaten"], a:1, ex:"Bankenrettungen und wegbrechende Steuereinnahmen ließen die Schulden erst nach 2007 steigen.", w:["Vor 2007 sanken die Staatsschulden in Spanien und Irland. Die Probleme lagen im Privatsektor und in den Leistungsbilanzen.", null, "Unbedeutend war sie nicht: Nach 2007 stiegen die Staatsschulden rasant, nur eben als Folge.", "Die Krisenstaaten hatten Leistungsbilanzdefizite, also eher zu wenig Exporte."]}
]},
{id:"2-8", t:"Arbeit, Produktivität und Beschäftigung", html:`
<p>Die Entstehungsseite lässt sich tautologisch erweitern:</p>
<div class="eq">Y<sup>A</sup> = (Y/H) · (H/E) · (E/L) · (L/WAP) · (WAP/POP) · POP</div>
<ul><li>Y/H: Produktivität je Arbeitsstunde</li><li>H/E: Stunden je erwerbstätiger Person</li><li>E/L: Erwerbstätige als Anteil an den Erwerbspersonen</li><li>L/WAP: Erwerbspersonen als Anteil der Bevölkerung im erwerbsfähigen Alter</li><li>WAP/POP: Anteil der erwerbsfähigen Bevölkerung an der Gesamtbevölkerung</li></ul>
<p>Steigt die Produktivität, kann rein rechnerisch</p>
<ul><li>die Produktion steigen,</li><li>die Arbeitszeit je Person sinken,</li><li>die Beschäftigungsquote sinken (Arbeitslosigkeit),</li><li>die Erwerbsbeteiligung sinken</li><li>oder das Renteneintrittsalter sinken.</li></ul>
<p>Welche Folge eintritt, ist nicht festgelegt.</p>
<table class="kv">
<tr><td>Erwerbstätige</td><td>mindestens eine Stunde pro Woche gegen Entgelt tätig</td></tr>
<tr><td>Erwerbspersonen</td><td>Erwerbstätige + Arbeitslose</td></tr>
<tr><td>Arbeitslose (BA)</td><td>vorübergehend ohne Beschäftigung, suchen versicherungspflichtige Arbeit, bei der Agentur gemeldet</td></tr>
<tr><td>Erwerbslose (ILO)</td><td>nicht erwerbstätig, in den letzten vier Wochen aktiv gesucht, binnen zwei Wochen verfügbar</td></tr>
<tr><td>Stille Reserve</td><td>Arbeitswunsch, aber nicht verfügbar oder Suche aufgegeben</td></tr></table>`,
check:[
 {q:"Die Produktivität steigt um 2 %, die Produktion bleibt konstant. Was muss rechnerisch sinken?", o:["Die Preise","Das Arbeitsvolumen","Die Importe","Die Ersparnis"], a:1, ex:"Y = (Y/H) · H. Bei konstantem Y und höherem Y/H sinkt H, etwa über kürzere Arbeitszeiten oder Arbeitslosigkeit.", w:["Die Preise kommen in der Entstehungsgleichung nicht vor.", null, "Importe gehören zur Verwendungsseite, nicht zur Entstehung.", "Die Ersparnis kommt in Y = (Y/H) · H nicht vor."]}
]},
{id:"2-9", t:"Drei Gesichter der Verteilung", html:`
<ul><li><b>Funktionale Verteilung</b>: Y<sup>VT</sup> = W + Π, etwa die Lohnquote W/Y</li>
<li><b>Sektorale Verteilung</b>: Y<sup>VT</sup> = Y<sub>HH</sub> + Y<sub>F</sub> + Y<sub>St</sub></li>
<li><b>Personelle Verteilung</b>: Wie sind die Haushaltseinkommen verteilt? Gini-Koeffizient, 90:10-Verhältnis, Anteil der Top-Einkommen (Piketty, auf Basis von Steuerdaten)</li></ul>
<p>In Deutschland steigt die Lohnquote seit der Finanzkrise wieder, der Anteil der verfügbaren Haushaltseinkommen am Gesamteinkommen fällt aber weiter: Unternehmen und Staat steigern ihre Anteile zu Lasten der Haushalte. Ungleichheit geht also nicht eindeutig aus jeder Verteilungsrechnung hervor.</p>
<p><b>Vermögen</b> sind viel ungleicher verteilt als Einkommen, unter anderem wegen Erbschaften, höherer Sparquoten und Renditen oben. Befragungen wie das SOEP unterschätzen den oberen Rand, und ohne Vermögensteuer fehlen in Deutschland Steuerdaten.</p>
<div class="merk"><b>USA und Deutschland</b>US-Haushalte arbeiten mehr, sind konsumorientierter und stärker verschuldet, ihre Einkommen sind ungleicher verteilt. In Deutschland sind die Finanzierungssalden von Haushalten und Unternehmen (seit etwa 2010 auch des Staates) positiv, in den USA ist der Staatssaldo durchweg negativ.</div>`,
check:[
 {q:"Was beschreibt die funktionale Einkommensverteilung?", o:["Verteilung auf arme und reiche Haushalte","Verteilung auf Löhne und Gewinne","Verteilung auf Haushalte, Firmen, Staat","Verteilung der Vermögen"], a:1, ex:"Funktional heißt: nach der Funktion in der Produktion, also Arbeit (Löhne W) und Kapital (Gewinne Π): Y = W + Π.", w:["Das ist die personelle Verteilung (z. B. Gini-Koeffizient).", null, "Das ist die sektorale Verteilung.", "Vermögen sind Bestände. Die Verteilungsrechnung der VGR betrifft Einkommen."]}
]},
{id:"2-10", t:"VGR und Klimaziele", html:`
<p>Die CO₂-Emissionen lassen sich zerlegen:</p>
<div class="eq">CO₂ = (CO₂/Y) · Y = (CO₂/Y) · (Y/H) · (H/E) · E</div>
<ul><li><b>Weg 1, Green Growth / Decoupling</b>: die CO₂-Intensität der Produktion durch Innovation und saubere Investitionen senken, Wachstum bleibt möglich.</li>
<li><b>Weg 2, Degrowth</b>: weniger Produktion, etwa durch Arbeitszeitverkürzung (H/E sinkt) als Beitrag zum Klimaschutz.</li></ul>
<h3>CO₂-Budgets</h3>
${bsp("Rechnung der Vorlesung",[["Gegeben","Nach dem Weltklimarat bleiben ab 2020 etwa 500 Gt CO₂ für das 1,5-Grad-Ziel (50 % Wahrscheinlichkeit). Ausstoß: 40 Gt pro Jahr."],["Gleichbleibend","$ 500 / 40 = 12,5 Jahre"],["Linear auf null","Die Fläche unter der Kurve ist ein Dreieck, halb so groß wie das Rechteck. Die Zeit verdoppelt sich auf 25 Jahre."],["Ergebnis","Klimaneutralität bis Ende 2045"]])}
<div class="merk"><b>Zieljahre täuschen</b>Ein Zieljahr für Klimaneutralität sagt wenig. Je später die Absenkung beginnt, desto früher muss die Neutralität erreicht sein, um das Budget einzuhalten. Entscheidend ist die Fläche unter der Emissionskurve.</div>`,
check:[
 {q:"Es bleiben 500 Gt CO₂, jährlich werden 40 Gt ausgestoßen. Wie lange reicht das Budget bei linearer Absenkung auf null?", o:["12,5 Jahre","25 Jahre","40 Jahre","50 Jahre"], a:1, ex:"Die Fläche eines Dreiecks ist halb so groß wie die eines Rechtecks: 2 · 12,5 = 25 Jahre.", w:["12,5 Jahre gelten, wenn bis zum Schluss jedes Jahr 40 Gt ausgestoßen werden und dann schlagartig null.", null, "40 ist der jährliche Ausstoß, keine Dauer.", "50 Jahre wären das Vierfache. Bei linearer Absenkung verdoppelt sich die Zeit nur."]}
]}
];

{id:"3-1", t:"Kritik am BIP aus Sicht der Paradigmen", html:`
<p>Alle Paradigmen sind mit der VGR auf ihre Weise unzufrieden. Diese Tabelle ist klausurrelevant (Teil I, 3 Punkte):</p>
<table class="kv">
<tr><td>Neoklassisch</td><td>Das BIP sollte ein Wohlfahrtsmaß sein. Aber Externalitäten fehlen weitgehend, etwa erhöhen Ausgaben zur Beseitigung von Umweltschäden das BIP. Preise aus unvollständiger Konkurrenz überschätzen die Wohlfahrt.</td></tr>
<tr><td>Keynesianisch</td><td>Das BIP sollte die beschäftigungswirksame Nachfrage messen. Aber es enthält Komponenten ohne echte Geldausgaben: imputierte Mieten für selbst genutztes Wohneigentum, impliziten Konsum von Finanzdienstleistungen. In den USA steigen so mit den Mieten der private Konsum und das BIP, ohne dass mehr Beschäftigung entsteht.</td></tr>
<tr><td>Klassisch/marxistisch</td><td>Das BIP sollte die Verteilung zwischen Klassen zeigen. Aber der Finanzsektor ist unproduktiv, er verschiebt nur Werte. Kapitaleinkommen sind leistungslose Renten, keine Faktoreinkommen.</td></tr>
<tr><td>Evolutionär-institutionell</td><td>Wohlfahrtsmaß, aber positionaler Konsum (Statusgüter) wird wie anderer Konsum behandelt, obwohl er im Aggregat die Wohlfahrt nicht erhöht.</td></tr>
<tr><td>Feministisch</td><td>Das BIP sollte die gesamte ökonomische Arbeit erfassen. Aber unbezahlte Arbeit (Sorgearbeit) fehlt. Warum tut man so, als zahlten sich Eigentümer Miete, aber niemand Lohn für Kinderbetreuung? „Wer hat Adam Smith sein Abendessen gekocht?“ Frauen leisten mehr unbezahlte Arbeit und insgesamt mehr Arbeit als Männer.</td></tr>
<tr><td>Ökologisch</td><td>Die Einbettung der Ökonomie ins Ökosystem fehlt. Energieintensiver Luxuskonsum zählt genauso wie die Befriedigung von Grundbedürfnissen.</td></tr></table>
<div class="merk"><b>Aufbau einer 3-Punkte-Antwort</b><ol style="margin:.3em 0 0;padding-left:1.3em"><li>Was soll das BIP aus dieser Sicht messen?</li><li>Was misst es stattdessen falsch oder gar nicht?</li><li>Ein konkretes Beispiel.</li></ol></div>`,
check:[
 {q:"Welche BIP-Kritik ist keynesianisch?", o:["Unbezahlte Sorgearbeit fehlt","Imputierte Mieten sind keine beschäftigungswirksame Nachfrage","Der Finanzsektor ist unproduktiv","Externalitäten fehlen"], a:1, ex:"Keynesianisch soll das BIP die beschäftigungswirksame Nachfrage messen. Für imputierte Mieten fließt kein Geld, und niemand wird dafür beschäftigt.", w:["Das ist die feministische Kritik.", null, "Das ist die klassische bzw. marxistische Kritik.", "Das ist die neoklassische Kritik: Dort soll das BIP Wohlfahrt messen."]},
 {q:"Welche Kritik äußert die feministische Ökonomik?", o:["Positionaler Konsum","Unbezahlte Arbeit bleibt unberücksichtigt","Monopolpreise","Imputierte Mieten"], a:1, ex:"Dazu: Bei Sorgearbeit sind Produktivität und Produktivitätsfortschritt kaum messbar.", w:["Positionaler Konsum (Statusgüter) ist die evolutionär-institutionelle Kritik.", null, "Monopolpreise kritisiert die Neoklassik.", "Imputierte Mieten kritisiert die keynesianische Sicht."]}
]},
{id:"3-2", t:"Neoklassik: Das Angebot schafft seine Nachfrage", html:`
<p>Das <b>Saysche Gesetz</b>: „Das Angebot schafft sich seine eigene Nachfrage.“ Die Logik in der geschlossenen Volkswirtschaft ohne Staat:</p>
<ol style="padding-left:1.2em"><li>Zuerst wird auf dem <b>Arbeitsmarkt</b> bestimmt, wie viel gearbeitet wird. Mit der Produktivität ergibt sich Y<sup>A</sup> = (Y/H) · H.</li>
<li>Dabei entstehen Einkommen W + Π. Ob sie bei Haushalten oder Unternehmen landen, ist egal, denn die Unternehmen gehören letztlich den Haushalten.</li>
<li>Die Einkommen werden konsumiert oder gespart: Y = C + S.</li>
<li>Konsum ist direkt Nachfrage. Ersparnis senkt über den <b>Zinsmechanismus</b> den Zins und erhöht die Investitionen: <b>S → I</b>.</li></ol>
{{fig:g3b}}
<h3>Hierarchie der Märkte</h3>
${cmp([["","Rolle","Koordiniert durch"],["Arbeitsmarkt","strategisch vorrangig","Reallohn"],["Finanzmarkt","koordiniert Sparen und Investieren","Zins"],["Gütermarkt","passiv","Güterpreise"]])}
<p><b>Arbeitslosigkeit</b> entsteht auf dem Arbeitsmarkt: Ist der Lohn zu hoch, etwa durch einen Mindestlohn oder Gewerkschaftsmacht, übersteigt das Arbeitsangebot die Arbeitsnachfrage.</p>
{{fig:g3a}}
<div class="merk"><b>Grundprinzipien</b>Mikro-Makro-Analogien <span class="pz">(was für den Einzelnen gilt, gilt auch für das Ganze)</span>:<ul style="margin:.3em 0"><li>Heutiger Konsum geht zu Lasten heutiger Ersparnis und damit künftigen Konsums.</li><li>Höhere Löhne führen zu mehr Arbeitslosigkeit.</li><li>Der Staat soll sich aus Güter- und Arbeitsmarkt weitgehend heraushalten.</li></ul>Zentrales Merkmal: Knappheit. Zentrales Ziel: Effizienz.</div>`,
check:[
 {q:"Wie wird in der Neoklassik verhindert, dass Ersparnis zu einem Nachfrageausfall führt?", o:["Durch Staatsausgaben","Durch den Zinsmechanismus auf dem Kapitalmarkt","Durch Exporte","Gar nicht"], a:1, ex:"Mehr Ersparnis senkt den Zins, mehr Investitionen werden rentabel, bis I = S.", w:["Staatsausgaben als Lückenfüller wären keynesianisch. Die Neoklassik will den Staat heraushalten.", null, "Exporte spielen im Grundmodell (geschlossene Volkswirtschaft) keine Rolle.", "Gerade die Neoklassik hält einen Nachfrageausfall für ausgeschlossen: Das Saysche Gesetz gilt."]},
 {q:"Wo entsteht Arbeitslosigkeit im einfachen neoklassischen Modell?", o:["Auf dem Gütermarkt","Auf dem Arbeitsmarkt durch zu hohe Löhne","Auf dem Kapitalmarkt","Im Ausland"], a:1, ex:"Ein Lohn über dem Gleichgewichtslohn erzeugt ein Überangebot an Arbeit.", w:["Auf dem Gütermarkt sieht Keynes die Ursache, nicht die Neoklassik.", null, "Der Kapitalmarkt koordiniert Sparen und Investieren. Arbeitslosigkeit erklärt er nicht.", "Das Grundmodell ist eine geschlossene Volkswirtschaft ohne Ausland."]}
]},
{id:"3-3", t:"Neoklassik mit Staat und Ausland: Crowding-out", html:`
<p>Mit Staat gilt Y − C − G<sub>C</sub> = I<sub>P</sub> + G<sub>I</sub>, also wieder S = I. Neoklassisch ist Y durch die Angebotsseite vorgegeben. Höhere Staatsausgaben müssen deshalb privaten Konsum oder private Investitionen <b>verdrängen</b> (Crowding-out).</p>
<p>Zahlenbeispiel der Vorlesung: Der Staat senkt seinen Konsum und investiert mehr. Einkommen: Privatsektor 80, Staat 20.</p>
${cmp([["","Vorher","Nachher"],["Privater Konsum","60","60"],["Private Investitionen","10","15"],["Staatskonsum","25","17,5"],["Staatsinvestitionen","5","7,5"],["Ersparnis = Investitionen","15","22,5"],["BIP","100","100"]])}
<p>Vorher: Gesamtersparnis 20 − 5 = 15 = Investitionen 10 + 5. Der Staat hat ein Defizit von 10, der Privatsektor einen Überschuss von 10. Die privaten Investitionen können erst steigen, wenn der Staat seinen Konsum senkt. Das BIP bleibt 100, legt aber die Grundlage für künftige Produktivität.</p>
<p><b>Leistungsbilanz</b>: Exportüberschüsse sind neoklassisch ein mögliches Gleichgewicht, das die Präferenzen der Individuen spiegelt, etwa Vorsorge für den demografischen Wandel durch Auslandsvermögen oder rentablere Investitionen im Ausland. So argumentiert Michael Hüther: „Wenn Deutschland spart, schafft es Potenzial für Investitionen in anderen Ländern.“ Kritisiert werden eher Defizitländer, die Kapitalimporte für Konsum statt für produktive Investitionen nutzen.</p>
<div class="merk"><b>Sozialphilosophie der Neoklassik</b><ul style="margin:.3em 0 0"><li>Einkommen entsprechen bei vollständiger Konkurrenz der Grenzproduktivität.</li><li>Staatliche Aktivität verdrängt private.</li><li>Freihandel steigert die Wohlfahrt (komparative Vorteile).</li><li>Individuelle Freiheit ist das höchste Ziel.</li></ul></div>`,
check:[

{id:"3-4", t:"Keynes: Die Nachfrage bestimmt die Produktion", html:`
<h3>John Maynard Keynes</h3>
<div class="dlist"><b>1883</b><span>geboren, im Todesjahr von Marx</span><b>1919</b><span>Diplomat bei den Friedensverhandlungen in Versailles</span><b>1929</b><span>Weltwirtschaftskrise: Massenarbeitslosigkeit trotz deregulierter Märkte</span><b>1936</b><span>„Allgemeine Theorie“</span><b>1944</b><span>Architekt des Währungssystems von Bretton Woods</span><b>1946</b><span>gestorben</span></div>
<p>Nixon 1972: „We are all Keynesians now.“ 2008/09: „The return of the Master“.</p>
<h3>Prinzip der effektiven Nachfrage</h3>
<p>Der Kapitalmarkt versagt bei der Umwandlung von S in I. Die Investitionen hängen von der Stimmung der Unternehmen ab <span class="pz">(animal spirits: Instinkte, Emotionen, Herdenverhalten)</span>. Die Reihenfolge:</p>
<ol class="steps"><li>Zuerst ergibt sich die Nachfrage C + I.</li><li>Das Angebot passt sich an.</li><li>Beschäftigung und Einkommen folgen.</li><li>Höheres I führt zu höherem Y und damit zu höherem S: <b>I → S</b>.</li></ol>
<p><b>Sparparadox</b>: Wollen alle mehr sparen, sinkt die Nachfrage, wenn die Unternehmen nicht mehr investieren. Über den Multiplikator fallen die Einkommen, und gespart wird am Ende nicht mehr. Keynes' Restaurant-Beispiel: Ein Wirt, dessen Gäste wegbleiben, vergrößert nicht sein Restaurant, sondern verkleinert es eher.</p>
<p><b>Kostenparadox</b> (Kalecki): Erhöhen alle Unternehmen die Löhne, steigt der Konsum der Arbeitnehmer:innen, und durch den Nachfragezuwachs fällt die Arbeitslosigkeit.</p>
<p><b>Geld</b>: Neoklassisch ist Geld ein „Schleier“ über einer realen Tauschwirtschaft. Bei Keynes ist die Wirtschaft eine <b>monetäre Produktionswirtschaft</b>: Geld kann nachgefragt werden, ohne dass Produktion und Beschäftigung entstehen. Daraus folgt fundamentale Unsicherheit. Unregulierte Finanzmärkte verstärken sie.</p>
<div class="merk"><b>Arbeitsmarkt bei Keynes</b>Bei Arbeitslosigkeit ist der Reallohn zwar „zu hoch“, aber nicht wegen überzogener Lohnforderungen, sondern wegen zu geringer Güternachfrage. Die Ursache keynesianischer Arbeitslosigkeit liegt auf dem Gütermarkt.</div>`,

{id:"3-5", t:"Keynesianisch mit Staat und Ausland: Crowding-in", html:`
<p>Im keynesianischen Fall der Nachfrageschwäche kann der Staat Ausgaben erhöhen, ohne dass andere Ausgaben fallen müssen. Zahlenbeispiel der Vorlesung: Der Staat erhöht seine Investitionen von 5 auf 10.</p>
${cmp([["","Vorher","Nachher"],["Staatsinvestitionen","5","10"],["Privater Konsum","60","62,5"],["Private Investitionen","10","12,5"],["BIP","100","110"],["Ersparnis = Investitionen","15","22,5"],["Staatsdefizit","10","15"],["Privater Überschuss","10","15"]])}
<p>Das BIP steigt um 10, doppelt so viel wie die Staatsausgaben: Der Multiplikator ist 2. Private Ausgaben werden nicht verdrängt, sondern mitgezogen <span class="pz">(Crowding-in)</span>.</p>
<p>Keynesianer:innen hoffen zusätzlich, dass sich höhere Staatsausgaben zum Teil selbst finanzieren, weil mit den Einkommen die Steuereinnahmen steigen.</p>
<p><b>Leistungsbilanz</b>: Hohe Exportüberschüsse gelten als Zeichen zu geringer Binnennachfrage. Überschussländer halten ihre Arbeitslosigkeit nur niedrig, weil andere Länder ihre Produkte teils kreditfinanziert importieren. Typische Forderung (etwa Thomas Fricke): die Binnennachfrage stärken, notfalls mit Staatsdefiziten. Streben alle Länder Überschüsse an, droht eine weltweite Nachfrageschwäche. Handlungsbedarf besteht bei hohen Defiziten <i>und</i> bei hohen Überschüssen.</p>
<div class="merk"><b>Sozialphilosophie von Keynes</b><ul style="margin:.3em 0"><li>Relativ gleichmäßige Einkommensverteilung (genug Konsumnachfrage ohne Überschuldung)</li><li>Starker öffentlicher Sektor und regulierte Finanzmärkte</li><li>Internationale Kooperation und Sanktionierung von Exportüberschüssen</li></ul>Langfristige Überwindung der Knappheit: In „Wirtschaftliche Möglichkeiten für unsere Enkelkinder“ (1930) erwartete Keynes, dass drei Stunden Arbeit am Tag genügen würden. In neoklassischer Sprache: Langfristig dominiert der Einkommenseffekt den Substitutionseffekt, das Arbeitsangebot sinkt.</div>`,
check:[
 {q:"Der Staat erhöht seine Ausgaben um 5, das BIP steigt um 10. Wie groß ist der Multiplikator?", o:["0,5","1","2","5"], a:2, ex:"ΔY/ΔG = 10/5 = 2. Private Ausgaben steigen mit: Crowding-in.", w:["0,5 = 5/10: Der Bruch ist umgedreht. Multiplikator = ΔY/ΔG.", "1 hieße: Das BIP steigt nur um die Staatsausgaben selbst, ohne Mitzieheffekt.", null, "5 ist die Erhöhung der Staatsausgaben, nicht der Multiplikator."]},

{id:"3-6", t:"Klassik und Marx: Klassen, Mehrwert, Krise", html:`
<h3>Die Klassiker</h3>
<div class="dlist"><b>Smith</b><span>Arbeitsteilung, Fortschritt</span><b>Ricardo</b><span>Verteilung, Stagnation</span><b>Malthus</b><span>Bevölkerung, Stagnation</span><b>Marx</b><span>Ausbeutung, Krise</span></div>
<p>Gemeinsam sind ihnen</p>
<ul><li>die Analyse von <b>Klassen</b> statt Individuen,</li><li>die <b>Arbeitswertlehre</b> (der Wert einer Ware bemisst sich an der nötigen Arbeitszeit),</li><li>die Theorie der <b>Rente</b> als leistungslosem Einkommen.</li></ul>
<p><b>Marx</b>: Arbeiter:innen haben ihre unabhängige Existenzgrundlage verloren und müssen ihre Arbeitskraft verkaufen. Sie arbeiten länger, als zur Produktion ihres Lohns nötig wäre. Den <b>Mehrwert</b> eignen sich die Kapitalist:innen an und investieren ihn (Akkumulation). Der Widerspruch: Mechanisierung verdrängt die Arbeit, die Quelle der Profite. Steigt die Produktivität bei Subsistenzlöhnen immer weiter, drohen <b>Absatzkrisen</b> (Überproduktion).</p>
<div class="dlist"><b>Entfremdung</b><span>Die Arbeiter:innen besitzen die Produktionsmittel nicht, der Überschuss wird ihnen genommen.</span><b>Warenfetisch</b><span>Wie ein menschengemachter Gott seinen Schöpfer beherrscht, erscheinen den Produzent:innen die von ihnen produzierten Waren als fremde Macht.</span></div>
${bsp("Kreislauf mit zwei Klassen",[["Annahmen","Arbeiter:innen konsumieren ihren ganzen Lohn (W = C). Kapitalist:innen investieren ihren ganzen Gewinn (Π = I)."],["Rechnung","$ Y = W + Π = C + S ⇒ Π = S"],["Zahlen","Y = 200, C = W = 150, I = Π = S = 50"],["Deutung","Die Investitionen sind Ausdruck der Ausbeutung."]])}
${bsp("Drei Klassen nach Ricardo",[["Annahme","Rentiers (Grundbesitzer) erhalten die Rente R, also die Pacht, und konsumieren sie."],["Vorher","Y = 200, W = 150, R = 25, Π = I = S = 25"],["Pacht steigt","R = 35. Bei gegebener Produktion fallen die Investitionen auf 15."],["Folgerung","Politik für die Kapitalisten, gegen die Großgrundbesitzer"]])}
<div class="merk"><b>Sozialphilosophie des Marxismus</b><ul style="margin:.3em 0 0"><li>Der Kapitalismus führt zu wachsender Ungleichheit.</li><li>Der Staat kann seine Widersprüche nicht beheben, erst die Vergesellschaftung der Produktionsmittel.</li><li>Exporte und Expansion sind Versuche, Absatzkrisen zu überwinden („Imperialismus“, Lenin; „Landnahme“, Rosa Luxemburg).</li><li>Ziel: das „Reich der Freiheit“ jenseits der notwendigen Arbeit.</li></ul></div>`,
check:[
 {q:"Im Zwei-Klassen-Modell gilt W = C und Π = I. Was ist die Ersparnis?", o:["S = W","S = Π","S = 0","S = C"], a:1, ex:"Aus Y = W + Π = C + S und W = C folgt Π = S: Nur die Kapitalist:innen sparen, indem sie investieren.", w:["Die Arbeiter:innen konsumieren ihren ganzen Lohn, sie sparen nichts.", null, "Gespart wird schon, nämlich in Höhe der Investitionen.", "C ist der Konsum, also gerade das Gegenteil von Ersparnis."]},

{id:"3-7", t:"Die Denkschulen im Vergleich", html:`
<p>Diese Übersicht ist dein Gerüst für jeden Essay:</p>
${cmp([["","Neoklassik","Keynesianismus","Klassik/Marxismus"],["Ausgangspunkt","Individuen, Knappheit","Gesamtnachfrage, Unsicherheit","Klassen, Ausbeutung"],["S und I","S → I über den Zins","I → S über das Einkommen","Π = I = S"],["Wichtigster Markt","Arbeitsmarkt","Gütermarkt","Produktion und Verteilung"],["Arbeitslosigkeit","zu hohe Löhne, Regulierung","zu geringe Güternachfrage","Reservearmee, Krisen"],["Staat","raushalten (Crowding-out)","aktive Nachfragepolitik (Crowding-in)","kann Widersprüche nicht lösen"],["Löhne","Kostenfaktor","auch Kaufkraft (Kostenparadox)","Subsistenz, Mehrwert"],["Exportüberschuss","Gleichgewicht der Präferenzen","Zeichen schwacher Binnennachfrage","Ausweg aus Absatzkrisen"]])}
<p>Wo die Kausalität von S = I verortet wird, entscheidet über fast alle wirtschaftspolitischen Empfehlungen.</p>`,

{id:"4-1", t:"Das einfache keynesianische Modell", html:`
<p>Das Modell beschreibt eine geschlossene Volkswirtschaft (ohne Ausland) ohne Staat. Die Nachfrage besteht nur aus Konsum und Investitionen:</p>
<div class="eq">Y<sup>N</sup> = C + I</div>
<h3>Die drei Annahmen</h3>
<div class="dlist">
<b>Konsum</b><span><span class="eq" style="display:block">C = c₀ + c₁Y<sup>VT</sup></span><b>c₀</b>: autonomer Konsum <span class="pz">(unabhängig vom Einkommen, z. B. Miete und Lebensmittel)</span><br><b>c₁</b>: marginale Konsumneigung <span class="pz">(Anteil jedes zusätzlichen Euros, der ausgegeben wird, 0 &lt; c₁ &lt; 1)</span></span>
<b>Investitionen</b><span>exogen <span class="pz">(außerhalb des Modells festgelegt)</span>: Sie hängen von der Stimmung der Unternehmer:innen ab <span class="pz">(animal spirits)</span>.</span>
<b>Angebot</b><span>passt sich der Nachfrage an: Y<sup>A</sup> = Y<sup>N</sup> = Y<sup>VT</sup></span>
</div>
<h3>Sind die Haushalte irrational?</h3>
<p>Die Konsumfunktion sagt: Haushalte richten ihren Konsum nach dem laufenden Einkommen. Ob das vernünftig ist, sehen die Schulen verschieden:</p>
${cmp([["","Neoklassik","Keynes"],["Antwort","Ja, irrational","Nein, vernünftig"],["Begründung","Haushalte sollten nach dem erwarteten Lebenseinkommen planen.","Über die ferne Zukunft weiß man wenig („In the long run, we are all dead“). Gegenwart und jüngste Vergangenheit sind eine vernünftige Orientierung."],["Fachbegriff","Hyperrationalität (perfekte Planung über das ganze Leben)","begrenzte Rationalität (bounded rationality)"]])}`,

 {q:"Was bedeutet c₁ = 0,8?", o:["80 % des Einkommens werden gespart","Von jedem zusätzlichen Euro Einkommen werden 80 Cent konsumiert","Der autonome Konsum beträgt 0,8","Die Investitionen steigen um 0,8"], a:1,

{id:"4-2", t:"Das keynesianische Kreuz", html:`
<p>Im Diagramm treffen Nachfrage und Angebot aufeinander:</p>
<div class="dlist">
<b>Nachfrage</b><span>Gerade Y<sup>N</sup> = c₀ + I + c₁Y mit Achsenabschnitt c₀ + I und Steigung c₁</span>
<b>Angebot</b><span>45°-Linie Y<sup>A</sup> = Y <span class="pz">(Produktion gleich Nachfrage)</span></span>
<b>Gleichgewicht</b><span>Schnittpunkt der beiden Linien, darunter auf der x-Achse liegt Y*</span>
</div>
{{fig:g4a0}}
<h3>Herleitung von Y* (in der Klausur 2 Punkte)</h3>
<ol class="steps">
<li>Nachfrage aufschreiben<div class="eq">Y<sup>N</sup> = c₀ + c₁Y + I</div></li>
<li>Gleichgewicht einsetzen: Y<sup>N</sup> = Y<sup>A</sup> = Y<sup>VT</sup> = Y<div class="eq">Y = c₀ + c₁Y + I</div></li>
<li>c₁Y nach links bringen und Y ausklammern<div class="eq">(1 − c₁) · Y = c₀ + I</div></li>
<li>Durch (1 − c₁) teilen<div class="eq">Y* = 1/(1 − c₁) · (c₀ + I)</div></li>
</ol>
<div class="merk"><b>Merksatz</b>1/(1 − c₁) heißt Multiplikator. Er vervielfacht die autonomen Ausgaben c₀ + I zum Gleichgewichtseinkommen.</div>
${bsp("Beispiel aus der Vorlesung",[["Gegeben","c₀ = 5, I = 15, c₁ = 0,8"],["Gesucht","Y*"],["Rechnung","$ Y* = 1/(1 − 0,8) · (5 + 15) = 5 · 20"],["Ergebnis","Y* = 100"],["Deutung","Autonome Ausgaben von 20 erzeugen ein Einkommen von 100, also das Fünffache."]])}`,
check:[
 {q:"c₀ = 80, c₁ = 0,8, I = 70. Wie hoch ist Y*?", o:["150","600","750","187,5"], a:2,
  ex:"Y* = 1/(1 − 0,8) · (80 + 70) = 5 · 150 = 750 (Aufgabenblatt 4, Aufgabe 2).",
  w:["150 sind nur die autonomen Ausgaben c₀ + I. Der Multiplikator 1/(1 − c₁) fehlt.","600 = 0,8 · 750 ist der einkommensabhängige Konsum c₁Y, nicht das Einkommen selbst.",null,"187,5 = 150 / 0,8: Hier wurde durch c₁ geteilt. Richtig ist durch 1 − c₁ = 0,2."]}
]},
{id:"4-3", t:"Die Logik des Multiplikators", html:`
<p>Warum wird aus 100 € Investition mehr als 100 € Einkommen? Weil jede Ausgabe Einkommen für jemand anderen ist:</p>
<ol class="steps">
<li>Ein Unternehmen investiert 100 € mehr. Das sind 100 € Einkommen für den Maschinenbauer.</li>
<li>Bei c₁ = 0,8 gibt er davon 80 € aus.</li>
<li>Die 80 € sind Einkommen für die nächste Person. Sie gibt 64 € aus.</li>
<li>Und so weiter: Jede Runde ist um 20 % kleiner als die vorige.</li>
</ol>
<div class="eq">100 + 80 + 64 + … = 1/(1 − 0,8) · 100 = 500</div>
<div class="merk"><b>Merksatz</b>Der Multiplikator ist hier 5. Im Diagramm verschiebt sich die Nachfragegerade um ΔI nach oben, und Y* steigt um das Fünffache.</div>
<h3>Und die Ersparnis?</h3>
${bsp("Beispiel aus dem Skript",[["Gegeben","c₁ = 0,5, die Investitionen steigen um 1"],["Rechnung","$ ΔY = 1/(1 − 0,5) · 1 = 2\n$ ΔC = 0,5 · 2 = 1\n$ ΔS = ΔY − ΔC = 2 − 1 = 1"],["Ergebnis","Die Ersparnis steigt um 1, genau so viel wie die Investitionen."],["Deutung","Es wird nicht mehr investiert, weil mehr gespart wird. Sondern weil mehr investiert wird, wird mehr gespart (I → S)."]])}`,
check:[

  ex:"Multiplikator 1/(1 − 0,75) = 1/0,25 = 4, also ΔY = 4 · 10 = 40.",

]},
{id:"4-4", t:"Das Sparparadox in Zahlen", html:`
<p>Was passiert, wenn alle Haushalte gleichzeitig mehr sparen wollen? Zahlenbeispiel der Vorlesung mit c₀ = 5 und I = 15:</p>
${cmp([["","Vorher","Alle sparen mehr"],["c₁","0,8","0,5"],["Y*","(5 + 15) / 0,2 = 100","(5 + 15) / 0,5 = 40"],["Konsum C","5 + 0,8 · 100 = 85","5 + 0,5 · 40 = 25"],["Ersparnis S = Y − C","15","15"]])}
<div class="merk"><b>Sparparadox</b>Die Haushalte wollten mehr sparen. Erreicht haben sie nur ein viel niedrigeres Einkommen. Die Ersparnis bleibt bei S = I = 15.</div>
<div class="merk"><b>Noch krasser mit Akzelerator</b>Hängen auch die Investitionen von der Nachfrage ab, sinken sie im Abschwung mit. Dann fällt die gesamtwirtschaftliche Ersparnis sogar, gerade weil alle mehr sparen wollen.</div>`,
check:[

  ex:"Gesamtwirtschaftlich gilt S = I. Bleibt I gleich, bleibt auch S gleich. Es sinkt nur das Einkommen.",
