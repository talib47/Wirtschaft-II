]},
{id:"4-5", t:"Der Akzelerator", html:`
<p>Bisher waren die Investitionen fest vorgegeben. Jetzt hängt ein Teil von ihnen von der Nachfrage ab:</p>
<div class="eq">I = I<sub>aut</sub> + aY</div>
<div class="dlist">
<b>I<sub>aut</sub></b><span>autonome Investitionen <span class="pz">(unabhängig von der Nachfrage)</span></span>
<b>a</b><span>Akzelerator: wie stark die Investitionen auf die Nachfrage reagieren</span>
</div>
<p>Die Idee: Unternehmen bauen ihre Kapazitäten aus, wenn die Nachfrage dauerhaft steigt. In Keynes' Beispiel schafft ein Restaurant mehr Tische an, wenn ständig alle belegt sind. Für das Gleichgewicht gilt dann:</p>
<div class="eq">Y* = 1/(1 − c₁ − a) · (c₀ + I<sub>aut</sub>)</div>
<p>Der Nenner wird kleiner, der Multiplikator also größer.</p>
${bsp("Beispiel aus dem Skript",[["Gegeben","c₁ = 0,5, a = 0,1, die Staatsausgaben steigen um 1"],["Rechnung","$ Multiplikator = 1/(1 − 0,5 − 0,1) = 1/0,4 = 2,5\n$ ΔC = 0,5 · 2,5 = 1,25\n$ ΔI = 0,1 · 2,5 = 0,25"],["Ergebnis","Y steigt um 2,5, der Konsum um 1,25 und die Investitionen um 0,25."],["Deutung","Die privaten Investitionen werden nicht verdrängt, sondern mitgezogen: kein Crowding-out, sondern Crowding-in."],["Hinweis","Im Skript steht an dieser Stelle, auch die Investitionen stiegen um 1,25. Richtig ist 0,1 · 2,5 = 0,25, sonst ginge die Rechnung 2,5 = 1,25 + 0,25 + 1 nicht auf. Im Gegenbeispiel direkt danach rechnet das Skript selbst mit 0,25."]])}`,
check:[
 {q:"c₁ = 0,5 und a = 0,2. Wie groß ist der Multiplikator?", o:["2","2,5","3,33","5"], a:2,
  ex:"1/(1 − 0,5 − 0,2) = 1/0,3 ≈ 3,33.",
  w:["2 = 1/(1 − 0,5) ist der Multiplikator ohne Akzelerator. Das a fehlt im Nenner.","2,5 = 1/0,4 wäre richtig für a = 0,1, hier ist a aber 0,2.",null,"5 = 1/0,2: Hier wurde nur a abgezogen und c₁ vergessen. Im Nenner stehen beide: 1 − c₁ − a."]}
]},
{id:"4-6", t:"Output-Lücke und keynesianische Arbeitslosigkeit", html:`
<p>Bis zum <b>Produktionspotenzial</b> Y<sub>V</sub> <span class="pz">(Produktion bei Vollbeschäftigung)</span> folgt die Produktion der Nachfrage entlang der 45°-Linie. Wegen des Multiplikators führt schon ein kleiner Anstieg der autonomen Nachfrage zu einem großen Anstieg des BIP.</p>
<p>Je nachdem, wo die Nachfragegerade die 45°-Linie schneidet, gibt es drei Fälle:</p>
<div class="dlist">
<b>A · Unterbeschäftigung</b><span>Schnittpunkt links von Y<sub>V</sub>, negative Output-Lücke</span>
<b>B · Vollbeschäftigung</b><span>Schnittpunkt genau bei Y<sub>V</sub>, keine Lücke</span>
<b>C · Inflation</b><span>Schnittpunkt rechts von Y<sub>V</sub>, positive Output-Lücke, früher oder später steigen die Preise</span>
</div>
{{fig:g4a}}
<div class="merk"><b>Ursache auf dem Gütermarkt</b>Anders als im neoklassischen Modell wird keine fallende Grenzproduktivität der Arbeit angenommen. Höhere Güternachfrage führt zu mehr Beschäftigung, aber nicht unbedingt zu geringeren Reallöhnen.</div>`,
check:[
 {q:"Der Schnittpunkt von Nachfrage und 45°-Linie liegt rechts von Y_V. Was droht?", o:["Deflation","Inflation","Arbeitslosigkeit","Nichts"], a:1,
  ex:"Rechts von Y_V ist die Nachfrage größer als das, was bei Vollbeschäftigung produziert werden kann (positive Output-Lücke). Früher oder später steigen die Preise.",
  w:["Sinkende Preise (Deflation) wären eher bei zu wenig Nachfrage zu erwarten, also links von Y_V.",null,"Arbeitslosigkeit herrscht links von Y_V (negative Output-Lücke). Rechts davon ist die Nachfrage zu hoch, nicht zu niedrig.","Rechts von Y_V kann die Wirtschaft die Nachfrage auf Dauer nicht bedienen. Das bleibt nicht folgenlos."]}
]},
{id:"4-7", t:"Das Kostenparadox", html:`
<p><b>Voraussetzung:</b> Lohnbezieher:innen geben einen größeren Teil ihres Einkommens aus als Gewinnbezieher:innen.</p>
<ol class="steps">
<li>Die Reallöhne steigen, Einkommen verschiebt sich von Gewinnen zu Löhnen.</li>
<li>Die durchschnittliche Konsumneigung steigt, die Nachfragegerade wird steiler.</li>
<li>Y* steigt. Das ist die <b>Kaufkrafttheorie der Löhne</b>.</li>
</ol>
{{fig:g4b}}
<div class="merk"><b>Das Paradox</b>Jedes Unternehmen hat höhere Kosten. Trotzdem, gerade deswegen, können die Gewinne insgesamt steigen, denn Π = Y<sup>VT</sup> − W. Einzelne Lohnabschlüsse haben also externe Effekte <span class="pz">(Wirkungen auf andere, die im eigenen Kalkül nicht vorkommen)</span>.</div>
<h3>Mikro-Makro-Paradoxa</h3>
<p>Spar- und Kostenparadox zeigen dasselbe Muster: Was für einen Einzelnen vernünftig ist, kann gesamtwirtschaftlich das Gegenteil bewirken.</p>
${cmp([["","Einzeln vernünftig","Wenn es alle tun"],["Sparparadox","Ein Haushalt spart mehr.","Das Einkommen sinkt, die Ersparnis steigt nicht."],["Kostenparadox","Ein Unternehmen hält die Löhne niedrig.","Die Nachfrage sinkt, die Gewinne insgesamt können sinken."]])}`,
check:[
 {q:"Wann führen höhere Löhne im keynesianischen Modell zu höherer Nachfrage?", o:["Immer","Wenn Lohnbezieher:innen eine höhere Konsumneigung haben als Gewinnbezieher:innen","Wenn die Zinsen steigen","Nie"], a:1,
  ex:"Dann fließt mehr Einkommen zu denen, die mehr davon ausgeben. Die durchschnittliche Konsumneigung und damit Y* steigen.",
  w:["Nicht immer: Geben Lohnbezieher:innen zusätzliches Einkommen nicht stärker aus als Gewinnbezieher:innen, ändert die Umverteilung die Nachfrage nicht.",null,"Zinsen kommen im einfachen Modell ohne Staat nicht vor. Entscheidend ist, wer das Einkommen bekommt.","„Nie“ wäre die Sicht, dass Löhne nur Kosten sind. Im keynesianischen Modell sind Löhne auch Kaufkraft."]}
]}
];

CARDS[1]=[
 {id:"c1-01", f:"Was ist Makroökonomik?", b:"Die Analyse gesamtwirtschaftlicher **Aggregate** (Größen, die für ganze Sektoren zusammengefasst werden).\nSektoren: private Haushalte, Unternehmen, Staat\nThemen: Wachstum, Inflation, Arbeitslosigkeit, Verteilung, Staatsverschuldung"},
 {id:"c1-02", f:"Methodologischer Individualismus", b:"Gesellschaft besteht nur aus **Individuen**. Jede Erklärung sozialer Fakten beruht auf individuellem Verhalten.\nBeispiel: Arbeitslosigkeit wird aus den Entscheidungen einzelner Arbeitnehmer:innen und Firmen erklärt.\nGrundlage der Neoklassik."},
 {id:"c1-03", f:"Holismus", b:"**Soziale Ganzheiten** wie Klassen, Nationen oder Kulturen haben eigene Eigenschaften, die sich nicht auf Einzelne zurückführen lassen.\nSie bestimmen das Verhalten der Einzelnen.\nBeispiel: Die Klassenlage prägt, wie jemand denkt und handelt."},
 {id:"c1-04", f:"Systemismus", b:"Gesellschaft als **System aus Subsystemen**, die sich wandeln und gegenseitig beeinflussen (z. B. Familien, Unternehmen, Staat, Finanzmärkte).\nUntersucht werden Aufbau, Umfeld, Struktur und Mechanismen.\nIndividuen werden nicht geleugnet, Systemdynamiken gelten aber als prägender. Das ist die Sicht der Vorlesung."},
 {id:"c1-05", f:"Die drei Grundsätze des Beutelsbacher Konsenses", b:"- Überwältigungsverbot: keine Meinung aufdrängen, eigenes Urteil ermöglichen\n- Kontroversitätsgebot: Was in Wissenschaft und Politik kontrovers ist, muss im Unterricht kontrovers erscheinen.\n- Schülerorientierung: die eigene Interessenlage analysieren und Einfluss nehmen können"},
 {id:"c1-06", f:"Neoklassisches oder sozioökonomisches Leitbild im Kernlehrplan SoWi NRW?", b:"Laut Vorlesung **sozioökonomisch** (Wirtschaft und Gesellschaft zusammen, mehrere Theorien).\nBelege aus dem Lehrplan:\n- Leitbild: mündige Wirtschaftsbürger:innen\n- kontroverse Positionen zu staatlichen Eingriffen erörtern\n- den homo oeconomicus auf seine Tragfähigkeit prüfen"},
 {id:"c1-07", f:"Wann war die Industrielle Revolution?", b:"Etwa **1760 bis 1850**.\nDanach steigt das BIP pro Kopf steil an. Die Kurve sieht aus wie ein Hockeyschläger („history's hockey stick“)."},
 {id:"c1-08", f:"Phasen hoher Arbeitslosigkeit und Inflation in Deutschland mit herrschendem Paradigma", b:"| Phase | Problem | Herrschendes Paradigma\n| bis 1923 | Hyperinflation (extreme Geldentwertung) | pluralistisch (mehrere Denkschulen)\n| ab 1929 | Deflation (sinkende Preise), Massenarbeitslosigkeit | pluralistisch, danach Keynesianismus\n| 1970er | Stagflation (Stillstand plus Inflation) | Wende zu Monetarismus und neoklassischer Dominanz\n| ab 2007 | Finanzkrise | Ende der neoklassischen Dominanz"},
 {id:"c1-09", f:"Kamen die Nationalsozialisten in Zeiten hoher Inflation oder Deflation an die Macht?", b:"**Deflation** (sinkende Preise).\nWeltwirtschaftskrise mit Massenarbeitslosigkeit, Machtergreifung 1933.\nDie Hyperinflation war schon 1923 vorbei."},
 {id:"c1-10", f:"Monetarismus und Neuklassik: Vertreter und Kernaussage", b:"Vertreter: Milton Friedman (Monetarismus), Robert Lucas (Neuklassik), 1960–80\nKernaussagen:\n- Der Markt findet von selbst ins Gleichgewicht (Selbstregelungskraft).\n- Geldpolitik ist Sache der Zentralbank.\n- Keine staatliche Konjunktursteuerung (kein Eingreifen gegen Auf- und Abschwünge).\nKontext: Stagflation der 1970er (Stillstand plus Inflation)"},
 {id:"c1-11", f:"Neukeynesianismus / Neuer Konsens: Kernaussage", b:"| | Kurze Frist | Lange Frist\n| Sicht | keynesianisch | neoklassisch\n| Politik | Konjunkturpolitik (gegen das Auf und Ab der Wirtschaft) | Strukturpolitik (Reformen an Arbeits- und Gütermärkten)\nVertreter: Krugman, Stiglitz, Mankiw"},
 {id:"c1-12", f:"Postkeynesianismus: Kernaussage", b:"- Fundamentale Unsicherheit: Die Zukunft ist nicht berechenbar, nicht einmal mit Wahrscheinlichkeiten.\n- Macht und Konflikt: etwa zwischen Gewerkschaften und Arbeitgebern\n- Instabilität: Ökonomien sind produktive, aber instabile Systeme.\nErweiterung des Keynesianismus um marxistische Elemente."},
 {id:"c1-13", f:"Drei Gründe der Vorlesung für Pluralismus", b:"- Wissenschaftstheorie: Fallibilismus (Wissen kann falsch sein) und Vielschichtigkeit (die Realität hat viele Ursachen)\n- Politische Bildung: Beutelsbacher Konsens und Kernlehrplan verlangen Kontroversität.\n- Krisen seit 2007: Ende der neoklassischen Dominanz"}
];
CARDS[2]=[
 {id:"c2-01", f:"Nenne zwei Strom- und eine Bestandsgröße.", b:"Ströme (pro Zeitraum): BIP, Konsum, Investitionen, Exporte, Löhne, Haushaltsdefizit\nBestände (zu einem Zeitpunkt): Staatsverschuldung, Vermögen der Haushalte, Kapitalstock (Maschinen, Gebäude, Infrastruktur)"},
 {id:"c2-02", f:"Was sind volkswirtschaftliche Identitäten?", b:"Gleichungen, die **immer gelten**, unabhängig von der Theorie.\nSie sagen nichts über Kausalität (was was verursacht).\nTheorien ergänzen sie um Verhaltensgleichungen:\nIdentität: z. B. Y = C + I + G + (X − M)\nVerhaltensgleichung: z. B. die Konsumfunktion C = c₀ + c₁Y"},
 {id:"c2-03", f:"Die drei Definitionen von Y", b:"Y^A: Angebot, der Marktwert der im Inland produzierten Güter\nY^N: Nachfrage nach im Inland produzierten Gütern\nY^VT: Verteilung, das Bruttonationaleinkommen aller Inländer:innen"},
 {id:"c2-04", f:"Reales vs. nominales BIP", b:"Nominal: zu laufenden Preisen\nReal: in Preisen eines Basisjahres (die Inflation ist herausgerechnet)\n$ reales Wachstum ≈ nominales Wachstum − Inflation"},
 {id:"c2-05", f:"Brutto vs. netto", b:"$ netto = brutto − Abschreibungen\nAbschreibungen: Wertverlust von Maschinen und Gebäuden durch Alterung\nDie Vorlesung nutzt das Bruttokonzept."},
 {id:"c2-06", f:"Kritik am Vergleich realer BIPs über lange Zeit", b:"- Preise, Mengen und Qualität ändern sich.\n- Neue Produkte kommen hinzu, alte verschwinden.\n- Die Digitalisierung erschwert die Messung (z. B. beim Smartphone).\nFolge: Je nach Methode ergeben sich stark unterschiedliche Wachstumsraten, im Beispiel der Vorlesung 0,35 % oder 4,6 % pro Jahr."},
 {id:"c2-07", f:"Entstehungsseite", b:"$ Y^A = (Y/H) · H\nY/H: Produktivität, also Output je Arbeitsstunde\nH: gearbeitete Stunden"},
 {id:"c2-08", f:"Verwendungsseite", b:"$ Y^N = C + I + G + (X − M)\nC: privater Konsum\nI: private Investitionen\nG: Staatsausgaben für Güter und Dienstleistungen\nX − M: Nettoexporte (Exporte minus Importe)"},
 {id:"c2-09", f:"Verteilungsseite: funktional und sektoral", b:"Funktional (nach Einkommensart):\n$ Y = W + Π\nSektoral (nach Sektoren):\n$ Y = Y_HH + Y_F + Y_St\nW: Löhne\nΠ: Gewinne"},
 {id:"c2-10", f:"Definition Y_HH, Y_F, Y_St", b:"Y_HH (Haushalte): Löhne + Kapitaleinkommen (z. B. Zinsen) + Transfers (z. B. Kindergeld, Rente) − Steuern und Abgaben\nY_F (Unternehmen): einbehaltene Gewinne + Subventionen (staatliche Zuschüsse) − Steuern und Abgaben\nY_St (Staat): T − Z, also Steuern und Abgaben minus Transfers und Subventionen"},
 {id:"c2-11", f:"Arbeitsproduktivität", b:"$ Y/H\nProduktion je gearbeiteter Stunde.\nTeil der Entstehungsseite Y = (Y/H) · H."},
 {id:"c2-12", f:"Staatlicher Finanzierungssaldo", b:"$ FS_St = Y_St − G\nVerfügbare Einkommen des Staates minus seine Ausgaben für Güter und Dienstleistungen.\nPositiv: Überschuss\nNegativ: Defizit"},
 {id:"c2-13", f:"Warum gilt S = I?", b:"Ohne Staat und Ausland gilt:\n$ Y = C + I und Y = C + S ⇒ S = I\nDas nicht konsumierte Einkommen ist Ersparnis und entspricht **immer** den Investitionen.\nEine Volkswirtschaft kann nur sparen, indem sie investiert."},
 {id:"c2-14", f:"Warum kann ein Individuum in Geld sparen, die Gesellschaft aber nicht?", b:"Was einer nicht ausgibt, fehlt anderen als **Einnahme**.\nWollten alle nur Geld sparen und nichts ausgeben, wäre Y = C + I = 0. Dann hätte niemand Einkommen zum Sparen."},
 {id:"c2-15", f:"Die Salden-Identität", b:"$ (Y_HH + Y_F − C − I) + (Y_St − G) + (M − X) = 0\nPrivatsektor + Staat + Ausland = 0\nÜberschüsse gibt es nur paarweise: Hat einer einen Überschuss, muss ein anderer ein Defizit haben."},
 {id:"c2-16", f:"Wann hat ein Land einen Leistungsbilanzüberschuss?", b:"Wenn der **Überschuss des Privatsektors** größer ist als das **Defizit des Staates**.\nDas Ausland verschuldet sich dann beim Inland.\nBeispiel: Privatsektor +9 %, Staat −2 % ⇒ Leistungsbilanz +7 %"},
 {id:"c2-17", f:"Summe der Geldvermögen aller Wirtschaftseinheiten", b:"**Immer null**: Jedem Geldvermögen steht eine Schuld in gleicher Höhe gegenüber.\nBeispiel: Dein Sparguthaben ist eine Schuld der Bank bei dir.\nAchtung: Das Sachvermögen (Häuser, Maschinen) ist nicht null."},
 {id:"c2-18", f:"Staatsverschuldung und Generationengerechtigkeit", b:"Vererbt werden **Staatsschulden und private Vermögen**.\nDer Konflikt liegt **innerhalb** der nächsten Generation: Künftige Steuerzahler:innen zahlen Zinsen an die Erben der heute Vermögenden."},
 {id:"c2-19", f:"Rolle der Leistungsbilanzen in der Eurokrise", b:"| | Krisenstaaten | Deutschland\n| Leistungsbilanz | Defizite | Überschüsse\n| Privatsektor vor 2007 | verschuldete sich | baute Vermögen auf\nStaatsschulden stiegen erst nach 2007: Bankenrettung und Rezession (Wirtschaftseinbruch).\nFazit: Folge, nicht Ursache der Krise\nKrisenstaaten: Portugal, Irland, Griechenland, Spanien"},
 {id:"c2-20", f:"Erwerbspersonen, Arbeitslose (BA), Erwerbslose (ILO)", b:"$ Erwerbspersonen = Erwerbstätige + Arbeitslose\nArbeitslose (BA): bei der Agentur gemeldet, suchen versicherungspflichtige Arbeit\nErwerbslose (ILO): in den letzten 4 Wochen aktiv gesucht, binnen 2 Wochen verfügbar"},
 {id:"c2-21", f:"Was sind „Zieljahre“ bei CO₂-Budgets, und warum täuschen sie?", b:"Zieljahr: das Jahr der Klimaneutralität (ab dann keine zusätzlichen Netto-Emissionen)\nEntscheidend ist aber das **Budget**, also die Fläche unter der Emissionskurve.\nJe später die Absenkung beginnt, desto früher muss die Neutralität erreicht sein."},
 {id:"c2-22", f:"Entkopplung vs. Wachstumsrücknahme (Decoupling vs. Degrowth)", b:"$ CO₂ = (CO₂/Y) · Y\n| | Entkopplung | Wachstumsrücknahme\n| Hebel | CO₂-Intensität (Emissionen je Euro BIP) senken | weniger produzieren\n| Wachstum | bleibt möglich | wird bewusst begrenzt, z. B. durch Arbeitszeitverkürzung"}
];
CARDS[3]=[
 {id:"c3-01", f:"BIP-Kritik: neoklassisch", b:"Ziel: Das BIP soll Wohlfahrt (das Wohlergehen der Menschen) messen.\nProblem: Externalitäten fehlen. Beispiel: Die Reparatur von Umweltschäden erhöht das BIP.\nProblem: Monopolpreise (überhöhte Preise mangels Konkurrenz) überschätzen die Wohlfahrt."},
 {id:"c3-02", f:"BIP-Kritik: keynesianisch", b:"Ziel: Das BIP soll die beschäftigungswirksame Nachfrage messen (Ausgaben, für die tatsächlich gearbeitet wird).\nProblem: Es enthält Komponenten ohne echte Geldausgaben.\n- imputierte Mieten für selbst genutztes Wohneigentum\n- impliziter Konsum von Finanzdienstleistungen (der Zinsverzicht beim Girokonto zählt als Kauf von Bankdienstleistungen)"},
 {id:"c3-03", f:"BIP-Kritik: klassisch/marxistisch", b:"Ziel: Das BIP soll die Verteilung zwischen Klassen zeigen.\nProblem: Der Finanzsektor ist unproduktiv, er verschiebt nur Werte.\nProblem: Kapitaleinkommen (z. B. Zinsen, Dividenden) sind leistungslose Renten, keine Faktoreinkommen (Bezahlung für einen Beitrag zur Produktion)."},
 {id:"c3-04", f:"BIP-Kritik: feministisch", b:"Ziel: Das BIP soll die gesamte ökonomische Arbeit erfassen.\nProblem: Unbezahlte Sorgearbeit fehlt, ihre Produktivität ist kaum messbar.\nBeispiel: Eigentümer:innen zahlen sich fiktive Miete, aber niemand bekommt Lohn für Kinderbetreuung."},
 {id:"c3-05", f:"BIP-Kritik: ökologisch und evolutionär-institutionell", b:"Ökologisch: Die Einbettung ins Ökosystem fehlt, Luxuskonsum zählt wie Grundbedarf.\nEvolutionär-institutionell: Positionaler Konsum (Statussymbole wie Luxusuhren) erhöht im Aggregat die Wohlfahrt nicht."},
 {id:"c3-06", f:"Saysches Gesetz", b:"„Das Angebot schafft sich seine eigene Nachfrage.“\n- Konsum ist direkt Nachfrage.\n- Ersparnis wird über den Zins zu Investitionen.\nFolge: Ein allgemeiner Nachfragemangel ist ausgeschlossen."},
 {id:"c3-07", f:"Wie verhindert der Zinsmechanismus in der Neoklassik einen Nachfragemangel?", b:"1. Mehr Ersparnis senkt den Zins.\n2. Mehr Investitionen werden rentabel (lohnen sich).\n3. Das geht weiter, bis I = S.\nJedes Einkommen wird so direkt oder indirekt nachfragewirksam."},
 {id:"c3-08", f:"Hierarchie der Märkte: Neoklassik vs. Keynes", b:"| | Neoklassik | Keynes\n| Bestimmt Y | Arbeitsmarkt | Gütermarkt\n| Finanzmarkt | koordiniert Sparen und Investieren | koordiniert nicht\n| Übrige Märkte | Gütermarkt passiv | Arbeitsmarkt folgt dem Gütermarkt"},
 {id:"c3-09", f:"Neoklassische Sicht auf Arbeitslosigkeit", b:"Ursache: zu hohe Löhne auf dem Arbeitsmarkt, etwa durch Mindestlohn, Gewerkschaften oder Sozialleistungen\nLösung: Deregulierung (Abbau von Regeln wie Mindestlohn oder Kündigungsschutz)"},
 {id:"c3-10", f:"Verdrängung (Crowding-out)", b:"Sicht: neoklassisch. Die Produktion Y ist durch Arbeitskräfte und Technik begrenzt (angebotsseitig vorgegeben).\nFolge: Höhere Staatsausgaben **verdrängen** privaten Konsum oder private Investitionen.\nMechanismus: Der Staat beansprucht Ersparnis, der Zins steigt."},
 {id:"c3-11", f:"Mitziehen (Crowding-in)", b:"Sicht: keynesianisch. Die Kapazitäten sind unterausgelastet (Maschinen und Arbeitskräfte stehen teilweise still).\nFolge: Staatsausgaben **ziehen** über den Multiplikator privaten Konsum und private Investitionen **mit**.\nBeispiel der Vorlesung: Staat +5, BIP +10, also Multiplikator 2"},
 {id:"c3-12", f:"Sozialphilosophie der Neoklassik", b:"- Einkommen entsprechen der Grenzproduktivität: Jede:r verdient, was sie oder er zur Produktion beiträgt.\n- Staatliche Aktivität verdrängt private.\n- Freihandel steigert die Wohlfahrt (komparative Vorteile).\n- Individuelle Freiheit ist das höchste Ziel."},
 {id:"c3-13", f:"Das Keynes'sche Sparparadox", b:"1. Alle wollen mehr sparen, die Nachfrage sinkt.\n2. Über den Multiplikator fallen die Einkommen.\n3. Am Ende wird nicht mehr gespart: S = I bleibt gleich.\nIndividuell vernünftig, gesamtwirtschaftlich kontraproduktiv."},
 {id:"c3-14", f:"Inwiefern bestimmen bei Keynes die Investitionen die Ersparnis?", b:"1. Höhere Investitionen erhöhen über den Multiplikator das Einkommen.\n2. Vom höheren Einkommen wird ein Teil gespart.\n3. Das geht weiter, bis S = I.\nKausalität: I → S"},
 {id:"c3-15", f:"Monetäre Produktionswirtschaft (Keynes) vs. reale Tauschwirtschaft (Neoklassik)", b:"| | Neoklassik | Keynes\n| Geld | ein Schleier: erleichtert nur den Tausch | kann gehortet werden (bleibt auf dem Konto liegen), ohne Produktion zu schaffen\n| Unsicherheit | – | fundamental: Die Zukunft ist nicht berechenbar.\n| Finanzmärkte | koordinieren Sparen und Investieren | koordinieren nicht"},
 {id:"c3-16", f:"Sozialphilosophie von Keynes", b:"- relativ gleichmäßige Einkommensverteilung\n- starker öffentlicher Sektor\n- regulierte Finanzmärkte\n- internationale Kooperation gegen Exportüberschüsse\n- langfristig: Überwindung der Knappheit und Arbeitszeitverkürzung"},
 {id:"c3-17", f:"Keynes 1930: „Wirtschaftliche Möglichkeiten für unsere Enkelkinder“", b:"Prognose: massive Arbeitszeitverkürzung, drei Stunden Arbeit am Tag\nGrund: Sind die materiellen Bedürfnisse befriedigt, wird aus sozialen Gründen weniger gearbeitet.\nIn neoklassischer Sprache: Der Einkommenseffekt dominiert den Substitutionseffekt."},
 {id:"c3-18", f:"Gemeinsamkeiten der Klassik", b:"- Analyse von Klassen statt Individuen\n- Arbeitswertlehre: Der Wert einer Ware bemisst sich an der nötigen Arbeitszeit.\n- Rente als leistungsloses Einkommen (z. B. Pacht für Land)\nVertreter: Smith, Ricardo, Malthus, Marx"},
 {id:"c3-19", f:"Ausbeutung und Mehrwert bei Marx", b:"Ausbeutung: Arbeiter:innen produzieren mehr Wert, als sie als Lohn erhalten.\nMehrwert: der Überschuss über den Lohn. Ihn eignen sich die Kapitalist:innen an und investieren ihn (Akkumulation)."},
 {id:"c3-20", f:"Entfremdung und Warenfetisch", b:"Entfremdung: Arbeiter:innen besitzen die Produktionsmittel (Fabriken, Maschinen) nicht, der Überschuss wird ihnen genommen.\nWarenfetisch: Die eigenen Produkte erscheinen als fremde, beherrschende Macht. Beispiel: Marktpreise und Konkurrenz wirken wie Naturgesetze, obwohl Menschen sie hervorbringen."},
 {id:"c3-21", f:"Warum sind Investitionen bei Marx Ausdruck der Ausbeutung?", b:"Arbeiter:innen produzieren Konsum- **und** Investitionsgüter.\nVon ihrem Lohn kaufen sie aber nur Konsumgüter (W = C).\nDer Rest gehört den Kapitalist:innen:\n$ I = Π = S"},
 {id:"c3-22", f:"Ricardo: Wirkung steigender Renten", b:"Annahme: gegebene Produktion, Löhne am Existenzminimum (Subsistenzlöhne)\nFolge: Steigt die Rente (Pacht), sinken Gewinne und Investitionen.\nBeispiel: Pacht 25 → 35, Investitionen 25 → 15\nFolgerung: Politik für die Kapitalisten, gegen die Großgrundbesitzer"}
];
CARDS[4]=[
 {id:"c4-01", f:"Konsumfunktion im keynesianischen Modell", b:"$ C = c₀ + c₁Y\nc₀: **autonomer Konsum** (unabhängig vom Einkommen)\nc₁: **marginale Konsumneigung**, der Anteil jedes zusätzlichen Euros, der ausgegeben wird (zwischen 0 und 1)"},
 {id:"c4-02", f:"Ist die keynesianische Konsumfunktion irrational?", b:"| | Neoklassik | Keynes\n| Antwort | Ja | Nein\n| Grund | Haushalte sollten nach dem erwarteten Lebenseinkommen konsumieren. | Perfekte Planung über das ganze Leben ist unmöglich (Hyperrationalität).\n| Folge | – | Bei unsicherer Zukunft ist das laufende Einkommen eine vernünftige Orientierung: **begrenzte Rationalität** (bounded rationality)."},
 {id:"c4-03", f:"Was heißt „Investitionen sind exogen“?", b:"Sie werden **außerhalb des Modells** bestimmt, also nicht durch Y oder c₁.\nDen Ausschlag gibt die **Stimmung der Unternehmer:innen** (animal spirits)."},
 {id:"c4-04", f:"Herleitung von Y* ohne Staat", b:"1. Gleichgewicht ansetzen\n$ Y = c₀ + c₁Y + I\n2. c₁Y nach links bringen, Y ausklammern\n$ (1 − c₁) · Y = c₀ + I\n3. Durch (1 − c₁) teilen\n$ Y* = 1/(1 − c₁) · (c₀ + I)"},
 {id:"c4-05", f:"Wie entsteht die Multiplikatorwirkung?", b:"Jede Ausgabe ist **Einkommen für andere**. Die geben davon wieder den Anteil c₁ aus, und so weiter.\nBei c₁ = 0,8 wird aus 100 € Investition ein Einkommen von 500 €:\n$ 100 + 80 + 64 + … = 1/(1 − 0,8) · 100 = 500"},
 {id:"c4-06", f:"Was zeigt das keynesianische Kreuz?", b:"Nachfrage: Gerade Y^N = c₀ + I + c₁Y\nAngebot: 45°-Linie Y^A = Y\nGleichgewicht Y*: Schnittpunkt der beiden Linien"},
 {id:"c4-07", f:"Multiplikator mit Akzelerator", b:"$ I = I_aut + aY\n$ Y* = 1/(1 − c₁ − a) · (c₀ + I_aut)\na: **Akzelerator**, wie stark die Investitionen auf die Nachfrage reagieren\nDer Multiplikator wird **größer**, weil auch die Investitionen auf die Nachfrage reagieren."},
 {id:"c4-08", f:"Warum ist der Multiplikator mit Akzelerator größer?", b:"Steigende Nachfrage löst **zusätzliche Investitionen** aus (Unternehmen bauen Kapazitäten aus).\nDiese Investitionen sind wieder Einkommen für andere. Die Kettenreaktion wird länger.\n$ 1/(1 − c₁ − a) > 1/(1 − c₁)"},
 {id:"c4-09", f:"Negative und positive Output-Lücke", b:"| | Negativ | Positiv\n| Lage | Y* < Y_POT | Y* > Y_POT\n| Folge | Unterbeschäftigung (Arbeitslosigkeit) | früher oder später Inflation\nY_POT: **Produktionspotenzial**, die Produktion bei Vollbeschäftigung"},
 {id:"c4-10", f:"Drei Konstellationen des Gleichgewichts", b:"- Unterbeschäftigung: Y* links vom Vollbeschäftigungsoutput Y_V\n- Vollbeschäftigung: Y* genau bei Y_V\n- Inflation: Y* rechts von Y_V"},
 {id:"c4-11", f:"Wo liegt die Ursache keynesianischer Arbeitslosigkeit?", b:"Gütermarkt: Die Güternachfrage ist zu gering für Vollbeschäftigung.\nNicht der Arbeitsmarkt (zu hohe Löhne) wie in der Neoklassik."},
 {id:"c4-12", f:"Sparparadox im Zahlenbeispiel", b:"Gegeben: c₀ = 5, I = 15\n| | Vorher | Alle sparen mehr\n| c₁ | 0,8 | 0,5\n| Y* | 100 | 40\n| S | 15 | 15\nDie Haushalte wollen mehr sparen, erreichen aber nur ein **niedrigeres Einkommen**. S bleibt gleich I."},
 {id:"c4-13", f:"Kostenparadox (Kaufkrafttheorie der Löhne)", b:"Voraussetzung: Lohnbezieher:innen geben einen größeren Teil ihres Einkommens aus als Gewinnbezieher:innen.\nWirkung: Höhere Löhne erhöhen die Nachfrage und Y*.\nParadox: Alle Unternehmen haben höhere Kosten, trotzdem können die Gewinne insgesamt steigen.\n$ Π = Y − W"},
 {id:"c4-14", f:"Unterschied Gleichgewichtsoutput vs. Vollbeschäftigungsoutput", b:"| | Gleichgewichtsoutput Y* | Vollbeschäftigungsoutput Y_V\n| Was? | Schnittpunkt von Nachfrage und Angebot | Produktion, wenn alle Arbeitswilligen Arbeit haben\n| Hängt ab von | der Nachfrage (Multiplikator) | Arbeitskräften und Produktivität\nBeide müssen **nicht übereinstimmen**. Die Differenz ist die Output-Lücke."},
 {id:"c4-15", f:"„Sag mir, was du über die Kausalität von S = I denkst …“", b:"„… und ich sage dir, was für ein Ökonom du bist.“\n| | Neoklassik | Keynesianismus\n| Richtung | S → I | I → S\n| Bedeutung | Die Ersparnis finanziert über den Zins die Investitionen. | Die Investitionen schaffen über das Einkommen die Ersparnis."}
];

ESSAYS[1]=[
 {id:"e1-1", pts:12, q:"Erläutern Sie, warum die Vorlesung verschiedene makroökonomische Paradigmen gegenüberstellt, und beziehen Sie den Beutelsbacher Konsens ein.",
  k:["Wissenschaftstheoretische Gründe: Fallibilismus, Vielschichtigkeit sozialer Realität","Beutelsbacher Konsens: Überwältigungsverbot erklärt","Kontroversitätsgebot: Kontroverses muss kontrovers erscheinen","Kernlehrplan NRW mit sozioökonomischem Leitbild (mündige Wirtschaftsbürger:innen)","Ende der neoklassischen Dominanz durch die Krisen seit 2007","Beispiel für eine Kontroverse (etwa Kausalität von S = I)"],
  m:`Die Vorlesung stellt Neoklassik, Keynesianismus, Klassik und Marxismus sowie ihre modernen Erweiterungen gegenüber, weil es gute wissenschaftstheoretische Gründe für Pluralismus gibt: Wissen ist fehlbar, und die soziale Realität ist vielschichtig und multikausal, sodass keine einzelne Theorie sie vollständig erfassen kann.

Hinzu kommt der Auftrag der politischen Bildung. Nach dem Beutelsbacher Konsens dürfen Schüler:innen nicht im Sinne erwünschter Meinungen überwältigt werden, und was in Wissenschaft und Politik kontrovers ist, muss auch im Unterricht kontrovers erscheinen. Der Kernlehrplan Sozialwissenschaften in NRW formuliert ein sozioökonomisches Leitbild mündiger Wirtschaftsbürger:innen, die kontroverse Positionen zu staatlichen Eingriffen erörtern können.

Schließlich hat die Phase neoklassischer Dominanz mit den Krisen seit 2007 ein Ende gefunden. Ein Beispiel ist die Identität S = I: Neoklassisch bestimmt die Ersparnis über den Zins die Investitionen, keynesianisch bestimmen die Investitionen über das Einkommen die Ersparnis. Daraus folgen gegensätzliche Empfehlungen, die künftige Lehrkräfte kennen müssen.`}
];
ESSAYS[2]=[
 {id:"e2-1", pts:12, klausur:"Aufgabenblatt 1, Aufgabe 7",
  q:"„Wenn man dem Staat verbietet, sich zu verschulden, kann der private Sektor kein Vermögen aufbauen.“ Stimmt das? Erläutern und kommentieren Sie im Lichte der Volkswirtschaftlichen Gesamtrechnung.",
  k:["Salden-Identität: FS_P + FS_St + FS_AL = 0 korrekt angegeben","Geldvermögen des einen sind Schulden des anderen (Summe null)","Ohne Staatsdefizit nur über Leistungsbilanzüberschüsse (Ausland verschuldet sich)","Einschränkung: Gilt für Geldvermögen, nicht für Sachvermögen (Investitionen)","Für die Welt als geschlossene Volkswirtschaft gilt die Aussage für Geldvermögen","Kommentar: Risiken der Exportabhängigkeit / Bewertung der Schuldenbremse"],
  m:`Die Aussage folgt im Kern aus der VGR. Die Finanzierungssalden von Privatsektor, Staat und Ausland addieren sich immer zu null: (Y_HH + Y_F − C − I) + (Y_St − G) + (M − X) = 0. Jedem Geldvermögen steht eine Schuld in gleicher Höhe gegenüber.

Darf sich der Staat nicht verschulden, kann der Privatsektor nur dann einen Finanzierungsüberschuss erzielen und Geldvermögen aufbauen, wenn sich das Ausland verschuldet, das Land also einen Leistungsbilanzüberschuss hat. Für die Welt als Ganzes, eine geschlossene Volkswirtschaft, ist auch das ausgeschlossen.

Einschränken muss man die Aussage für das Sachvermögen: Investiert der Privatsektor, baut er einen Kapitalstock auf, auch ohne Staatsschulden. Gesamtwirtschaftliche Ersparnis ist dann gleich den Investitionen.

Kommentar: Eine strikte Schuldenbremse macht private Vermögensbildung in Geldform also von der Verschuldung des Auslands abhängig. Das birgt, wie die Eurokrise zeigt, Risiken: Geraten die Schuldnerländer in die Krise, sind Exporte und Auslandsvermögen in Gefahr. Aus keynesianischer Sicht sollte der Staat den Sparwunsch des Privatsektors durch Defizite ermöglichen, aus neoklassischer Sicht spiegeln Überschüsse die Präferenzen der Sparer.`},
 {id:"e2-2", pts:12, klausur:"Aufgabenblatt 2, Aufgabe 2",
  q:"Bundeskanzlerin Merkel sagte 2010, Deutschland habe „seit Jahrzehnten über seine Verhältnisse gelebt“, und kündigte Einsparungen an. Erläutern und kommentieren Sie diese Aussage auf Grundlage der Volkswirtschaftlichen Gesamtrechnung.",
  k:["„Über die Verhältnisse leben“ = mehr ausgeben als einnehmen, für ein Land: Leistungsbilanzdefizit","Deutschland hatte Leistungsbilanzüberschüsse, lebte also insgesamt unter seinen Verhältnissen","Privatsektor baut mehr Vermögen auf, als sich der Staat verschuldet","Staatsdefizit spiegelt die Überschüsse des Privatsektors (Salden-Identität)","Sparen des Staates erfordert, dass andere Sektoren ihren Saldo verschlechtern","Keynesianisch: Sparpolitik kann über den Multiplikator die Wirtschaft schwächen"],
  m:`„Über seine Verhältnisse leben“ heißt, mehr auszugeben als einzunehmen. Für ein Land als Ganzes misst das die Leistungsbilanz: Ein Defizit bedeutet, dass das Inland mehr für Güter ausgibt, als es Einkommen hat, und sich im Ausland verschuldet.

Deutschland hatte seit Anfang der 2000er Jahre hohe Leistungsbilanzüberschüsse. Der deutsche Privatsektor baute jedes Jahr mehr Vermögen auf, als sich der deutsche Staat neu verschuldete, also auch gegenüber dem Ausland. Insgesamt lebte Deutschland in diesem Bild unter seinen Verhältnissen.

Die Staatsverschuldung ist im Kreislauf zu sehen: Nach der Salden-Identität entsprechen staatliche Defizite bei ausgeglichener Leistungsbilanz genau den Überschüssen des Privatsektors. Will der Staat sparen, muss ein anderer Sektor seinen Saldo verschlechtern: Entweder sparen die Privaten weniger, oder das Ausland verschuldet sich stärker.

Aus keynesianischer Sicht ist Sparpolitik daher riskant: Über den Multiplikator sinken Einkommen und Steuereinnahmen, das Defizit sinkt weniger als geplant. Aus neoklassischer Sicht kann ein ausgeglichener Haushalt dagegen private Investitionen fördern. Die Aussage verwechselt aber den Staat mit dem ganzen Land.`}
];
ESSAYS[3]=[
 {id:"e3-1", pts:12, klausur:"Aufgabenblatt 3, Aufgabe 1",
  q:"Der Sachverständigenrat schreibt: „Der Anstieg der gesamtwirtschaftlichen Produktivität ist ein entscheidender Faktor für das Wachstum einer Volkswirtschaft und den damit verbundenen Zuwachs an materiellem Wohlstand.“ Kommentieren Sie die Aussage vor dem Hintergrund der BIP-Kritik verschiedener Paradigmen.",
  k:["Aussage setzt BIP-Wachstum mit Wohlstand gleich","Neoklassische Kritik: Externalitäten, Monopolpreise","Keynesianische Kritik: BIP misst nicht nur beschäftigungswirksame Nachfrage; Produktivität erfordert ausreichende Nachfrage","Feministische Kritik: unbezahlte Arbeit, Produktivität bei Sorgearbeit kaum messbar","Ökologische Kritik: Umweltkosten, Grenzen des Wachstums","Evolutionär-institutionelle Kritik: positionaler Konsum","Produktivitätsgewinne können auch in Arbeitszeitverkürzung fließen (Y = Y/H · H)","Begründetes Fazit"],
  m:`Der Sachverständigenrat verknüpft Produktivität, BIP-Wachstum und materiellen Wohlstand. Rein rechnerisch steigt mit der Produktivität Y/H die Produktion je Stunde. Ob daraus mehr Wohlstand wird, hängt aber davon ab, was das BIP misst.

Aus neoklassischer Sicht soll das BIP Wohlfahrt messen, erfasst aber Externalitäten nicht: Die Beseitigung von Umweltschäden erhöht das BIP. Die ökologische Kritik geht weiter: Das BIP blendet die Einbettung ins Ökosystem aus, und mehr Produktion kann mehr Emissionen bedeuten. Die feministische Ökonomik betont, dass unbezahlte Sorgearbeit fehlt und ihre Produktivität kaum messbar ist; ein Wohlstandsbegriff ohne diese Arbeit ist unvollständig. Die evolutionär-institutionelle Kritik verweist auf positionalen Konsum, der im Aggregat die Wohlfahrt nicht erhöht.

Keynesianisch ist zudem fraglich, ob Produktivitätsgewinne überhaupt in Wachstum münden: Ohne ausreichende Nachfrage führt höhere Produktivität bei gleicher Produktion zu weniger Arbeitsstunden, im ungünstigen Fall zu Arbeitslosigkeit. Produktivität kann auch in Arbeitszeitverkürzung fließen, wie Keynes für die „Enkelkinder“ erwartete.

Fazit: Produktivität ist eine wichtige Voraussetzung für Wohlstand. Die Gleichsetzung mit BIP-Wachstum und materiellem Wohlstand übergeht aber Verteilung, unbezahlte Arbeit und ökologische Grenzen.`},
 {id:"e3-2", pts:24,
  q:"„Höhere Staatsausgaben gehen immer zu Lasten privater Investitionen.“ Diskutieren Sie diese Aussage vor dem Hintergrund der Vorlesungsinhalte. Berücksichtigen Sie unterschiedliche theoretische Perspektiven.",
  k:["Identität S = I bzw. Y − C − G_C = I_P + G_I korrekt eingeordnet (gilt immer, sagt nichts über Kausalität)","Neoklassik: Y angebotsseitig über den Arbeitsmarkt bestimmt","Crowding-out: höhere G verdrängen C oder I","Zinsmechanismus: Staatsnachfrage nach Kapital erhöht den Zins","Zahlenbeispiel oder Mechanismus: staatlicher Konsum verdrängt Investitionen","Keynesianisch: Unterauslastung, Nachfrage bestimmt Y","Multiplikator und Crowding-in (Akzelerator: Investitionen steigen mit der Nachfrage)","Defizit spiegelt den Überschusswunsch der Privaten","Unterscheidung staatlicher Konsum vs. staatliche Investitionen","Neuer Konsens: kurzfristig keynesianisch, langfristig neoklassisch","Neuklassik: Ricardianische Äquivalenz","Fazit: Antwort hängt von der Auslastung ab, „immer“ ist nicht haltbar"],
  m:`Die Aussage berührt den Kern des Streits zwischen Neoklassik und Keynesianismus. Unstrittig ist die Identität der VGR: In einer geschlossenen Volkswirtschaft gilt Y − C − G_C = I_P + G_I, also S = I. Über die Kausalität sagt sie nichts.

Aus neoklassischer Sicht ist Y angebotsseitig vorgegeben: Der Arbeitsmarkt bestimmt das Arbeitsvolumen, zusammen mit der Produktivität ergibt sich das Produktionspotenzial. Höhere Staatsausgaben müssen dann privaten Konsum oder private Investitionen verdrängen (Crowding-out). Der Mechanismus läuft über den Kapitalmarkt: Der Staat beansprucht Ersparnis, der Zins steigt, private Investitionen werden unrentabel. Im Zahlenbeispiel der Vorlesung können die privaten Investitionen erst steigen, wenn der Staat seinen Konsum senkt. Die Neuklassik verschärft das mit der Ricardianischen Äquivalenz: Haushalte sparen für künftige Steuern, der Multiplikator geht gegen null.

Aus keynesianischer Sicht gilt das nur bei voller Auslastung. Herrscht Unterbeschäftigung, bestimmt die Nachfrage die Produktion. Staatsausgaben erhöhen über den Multiplikator das Einkommen; steigen mit der Nachfrage auch die Investitionen (Akzelerator), kommt es zu Crowding-in. Im Beispiel der Vorlesung steigen nach höheren Staatsinvestitionen auch Konsum und private Investitionen, das BIP wächst von 100 auf 110. Das Staatsdefizit spiegelt dann den Wunsch der Privaten, Überschüsse zu bilden. Zudem können staatliche Investitionen in Infrastruktur und Bildung private Investitionen erst rentabel machen.

Der Neue Konsens vermittelt: Kurzfristig gilt die keynesianische Logik, langfristig die neoklassische. Entscheidend ist also, ob eine Output-Lücke vorliegt, und genau deren Messung ist umstritten.

Fazit: Bei Vollbeschäftigung ist Verdrängung plausibel, bei Unterauslastung eher das Gegenteil. Das „immer“ der Aussage ist aus Sicht der Vorlesung nicht haltbar.`}
];
ESSAYS[4]=[
 {id:"e4-1", pts:12, klausur:"Aufgabenblatt 4, Aufgabe 5",
  q:"Eine Vertreterin der Versicherungswirtschaft sagt im Unterricht: „Sparen ist eine wichtige Tugend. Wer in der Erwerbsphase viel spart, kann im Alter die Früchte ernten.“ Die Lehrerin ergänzt: „Wir wollen nur hoffen, dass die Unternehmen auch so viel investieren möchten, wie gesamtwirtschaftlich gespart wird.“ Erklären Sie, was die Lehrerin meint.",
  k:["Unterscheidung individuelle vs. gesamtwirtschaftliche Sicht","Identität S = I: Gesellschaft kann nur sparen, indem sie investiert","Neoklassisch: Zinsmechanismus sorgt für I = S, Aussage der Vertreterin stimmig","Keynesianisch: Investitionen hängen von animal spirits ab, nicht von der Ersparnis","Sparparadox: Nachfrage und Einkommen sinken, S steigt nicht","Folge für die Altersvorsorge: künftige Konsummöglichkeiten entstehen nur durch Investitionen"],
  m:`Für einen einzelnen Haushalt hat die Versicherungsvertreterin recht: Wer heute spart, kann später mehr konsumieren. Die Lehrerin weist auf die gesamtwirtschaftliche Ebene hin.

Nach der VGR gilt S = I: Eine Volkswirtschaft kann nur sparen, indem sie investiert. Ob mehr Sparwünsche zu mehr Investitionen führen, ist umstritten. Neoklassisch senkt mehr Ersparnis den Zins, Investitionen steigen, und die heutige Ersparnis erhöht über einen größeren Kapitalstock die künftigen Konsummöglichkeiten.

Keynesianisch hängen die Investitionen aber von den animal spirits ab. Sparen alle mehr, fehlt Nachfrage; Unternehmen investieren eher weniger. Über den Multiplikator sinken die Einkommen, bis die Ersparnis wieder den unveränderten Investitionen entspricht (Sparparadox). Am Ende wird nicht mehr gespart, aber das Einkommen ist gesunken.

Für die Altersvorsorge heißt das: Künftige Renten werden aus künftiger Produktion bezahlt. Gesamtwirtschaftlich sorgt eine Gesellschaft nur durch Investitionen vor, nicht durch Konsumverzicht allein.`}
];

LESSONS[1].push({id:"1-6", t:"Was du aus der Mikroökonomik brauchst", html:`
<p>Die Makro-Vorlesung setzt an einigen Stellen Begriffe aus „Einführung in die Mikroökonomik“ voraus. Mehr als diese sechs brauchst du nicht:</p>
<table class="kv">
<tr><td>Homo oeconomicus</td><td>Das Menschenbild der Neoklassik: Individuen handeln rational und eigennützig, sie wägen Nutzen und Kosten ab und maximieren ihren Nutzen. Aus seinen Entscheidungen werden gesamtwirtschaftliche Ergebnisse abgeleitet (methodologischer Individualismus).</td></tr>
<tr><td>Grenzproduktivität</td><td>Der zusätzliche Output einer zusätzlichen Arbeitsstunde. Sie sinkt, je mehr Arbeit eingesetzt wird. Ein Unternehmen stellt nur ein, solange der Reallohn w/p nicht über der Grenzproduktivität liegt. Daraus folgt die fallende Arbeitsnachfrage im neoklassischen Arbeitsmarkt: Ein höherer Lohn bedeutet weniger Beschäftigung.</td></tr>
<tr><td>Einkommens- und Substitutionseffekt</td><td>Steigt der Stundenlohn, wird Freizeit teurer, man arbeitet mehr (Substitutionseffekt). Gleichzeitig ist man reicher und kann sich mehr Freizeit leisten, man arbeitet weniger (Einkommenseffekt). Keynes erwartete langfristig, dass der Einkommenseffekt dominiert und die Arbeitszeit sinkt (Essay über die „Enkelkinder“).</td></tr>
<tr><td>Lebenszyklushypothese</td><td>Neoklassisch planen Haushalte ihren Konsum über das ganze Leben und glätten ihn: Sie konsumieren nach dem erwarteten Lebenseinkommen, nicht nach dem laufenden. Das ist die Gegenposition zur keynesianischen Konsumfunktion C = c₀ + c₁Y.</td></tr>
<tr><td>Komparative Kostenvorteile</td><td>Nach Ricardo lohnt sich Handel auch dann, wenn ein Land alles billiger herstellen kann: Jedes Land spezialisiert sich auf das, was es relativ am günstigsten produziert. Darauf stützt sich die neoklassische Aussage „Freihandel steigert die Wohlfahrt“.</td></tr>
<tr><td>Externalitäten</td><td>Kosten oder Nutzen, die bei Dritten anfallen und nicht im Preis stecken, etwa Umweltschäden. Grundlage der neoklassischen BIP-Kritik und der Umweltökonomik.</td></tr></table>
<div class="merk"><b>Tipp</b>Wenn auf einer Folie „vgl. Einführung in die Mikroökonomik“ steht, ist fast immer einer dieser Begriffe gemeint.</div>`,

LESSONS[6]=[
{id:"6-1", t:"Der Dauerstreit: Inflation und Arbeitslosigkeit", html:`
<p>Übersteigt die Nachfrage den Vollbeschäftigungsoutput länger, setzen Arbeitnehmer:innen höhere Löhne und Unternehmen höhere Preise durch. Im Extremfall entstehen <b>Lohn-Preis-Spiralen</b>, die schwer zu stoppen sind. Umgekehrt führt dauerhafter Nachfragemangel zu <b>Deflation</b>, die noch schwerer zu bekämpfen ist.</p>
<table class="kv">
<tr><td>Inflation</td><td>Angebotskrise nach dem Ersten Weltkrieg und Ruhrbesetzung (bis 1923), Stagflation nach den Ölpreisschocks der 1970er, Corona- und Energiekrise der frühen 2020er</td></tr>
<tr><td>Deflation</td><td>Weltwirtschaftskrise Anfang der 1930er, Japan nach 1991, Eurokrise Anfang der 2010er</td></tr></table>
<p>Keynes war wenig um Inflation besorgt; in den 1930ern herrschte Deflation. Die Gegenrevolution nach ihm entzündete sich genau an der Frage, wie Arbeitslosigkeit und Inflation zusammenhängen.</p>`,
check:[{q:"Welches Ereignis ist ein Beispiel für Stagflation?", o:["Weltwirtschaftskrise 1929","Ölpreisschocks der 1970er Jahre","Japan nach 1991","Eurokrise 2010"], a:1, ex:"Stagflation heißt Stillstand (Stagnation) und Inflation gleichzeitig, so nach den Ölpreisschocks der 1970er.", w:["Die Weltwirtschaftskrise war deflationär: Die Preise fielen.", null, "Japan erlebte nach 1991 Deflation, keine Inflation.", "In der Eurokrise drohte eher Deflation."]}]},
{id:"6-2", t:"Neoklassische Synthese und Phillips-Kurve", html:`
<p>Nach dem Zweiten Weltkrieg bis Anfang der 1970er war die <b>Neoklassische Synthese</b> der Mainstream (Paul Samuelson, John Hicks; Nixon 1972: „We are all Keynesians now“). Ihre Grundlage:</p>
<div class="dlist"><b>Langfristig</b><span>Bei flexiblen Löhnen, Preisen und Zinsen gelten neoklassische Prinzipien (S bestimmt I).</span><b>Kurzfristig</b><span>Es gilt die keynesianische Theorie.</span></div>
<p>Kernstück ist die <b>Phillips-Kurve</b>. Je geringer die Arbeitslosigkeit, desto schneller steigen …</p>
${cmp([["","Ursprüngliche Phillips-Kurve","Modifizierte Phillips-Kurve"],["… was?","die Nominallöhne","die Preise, π = f(U)"]])}
<div class="merk"><b>„5 % Inflation sind mir lieber als 5 % Arbeitslosigkeit“</b>Helmut Schmidt. Die Idee: Die Politik kann zwischen Arbeitslosigkeit und Inflation wählen, je nach Präferenzen. Wer Arbeitslosigkeit für schädlicher hält, nimmt mehr Inflation in Kauf. Genau diesen dauerhaften Zielkonflikt bestritten später Monetarismus und Neuklassik.</div>`,
check:[{q:"Was besagt die modifizierte Phillips-Kurve?", o:["Je höher die Arbeitslosigkeit, desto höher die Inflation","Je geringer die Arbeitslosigkeit, desto höher die Inflation","Inflation und Arbeitslosigkeit sind unabhängig","Die Löhne sinken bei Vollbeschäftigung"], a:1, ex:"Je geringer die Arbeitslosigkeit, desto höher die Inflation: π = f(U). Daraus folgt ein Zielkonflikt zwischen beiden.", w:["Richtung verdreht: Hohe Arbeitslosigkeit dämpft Löhne und Preise.", null, "Unabhängig sind sie erst langfristig laut Monetarismus (vertikale Kurve), nicht in der Phillips-Kurve selbst.", "Bei Vollbeschäftigung steigen die Löhne eher, weil Arbeitskräfte knapp sind."]}]},
{id:"6-3", t:"Monetarismus und Neuklassik: natürliche Arbeitslosigkeit", html:`
<p>Seit den 1960ern einflussreich in den USA, Großbritannien, Chile und Deutschland: Milton Friedman, Robert Lucas, die „Chicago Boys“ in Chile, die monetaristische Tradition der Bundesbank. Sie liefern eine Theorie der <b>Stagflation</b>.</p>
<ul><li>Der Phillips-Kurven-Zusammenhang gilt nur kurzfristig.</li>
<li>Langfristig ist die Phillips-Kurve <b>vertikal</b>: Es gibt eine „natürliche Arbeitslosigkeit“, bedingt durch zu hohe Löhne oder Arbeitsmarktrigiditäten. Später heißt sie <b>NAIRU</b> (non-accelerating inflation rate of unemployment).</li></ul>
<h3>Der Mechanismus nach Friedman</h3>
<ol class="steps"><li>Arbeitnehmer:innen arbeiten mehr, weil sie glauben, die Reallöhne stiegen.</li><li>Die Unternehmen erhöhen aber die Preise, die Reallöhne bleiben konstant.</li><li>Die höhere Inflation wird für die Zukunft erwartet. Die Arbeitnehmer:innen fordern höhere Nominallöhne.</li><li>Die kurzfristige Phillips-Kurve verschiebt sich nach oben. Um sie erneut zu „täuschen“, müsste die Inflation noch höher sein.</li></ol>
<div class="merk"><b>Folgerung</b>Langfristig bringt Nachfragesteuerung über Geld- und Fiskalpolitik nichts außer Inflation. Stattdessen soll die Inflation stabilisiert und der Arbeitsmarkt flexibilisiert werden, damit sich das Arbeitsangebot nach rechts verschiebt.</div>`,
check:[{q:"Wie verläuft die langfristige Phillips-Kurve laut Monetarismus?", o:["Fallend","Steigend","Vertikal bei der natürlichen Arbeitslosigkeit","Waagerecht"], a:2, ex:"Vertikal bei der natürlichen Arbeitslosigkeit (NAIRU): Langfristig gibt es keinen Zielkonflikt, nur höhere Inflation.", w:["Fallend ist die kurzfristige Phillips-Kurve.", "Eine steigende Kurve kommt in diesem Modell nicht vor.", null, "Waagerecht hieße: Die Arbeitslosigkeit ändert sich, die Inflation nie. Das Gegenteil ist der Fall."]}]},
{id:"6-4", t:"Lohnsetzung, Preissetzung und Lohn-Preis-Spirale", html:`
<p>Das Arbeitsmarktmodell der Vorlesung hat den Reallohn w/p auf der y-Achse und das Arbeitsvolumen E auf der x-Achse:</p>
<ul><li><b>Lohnsetzung</b> (steigend): Je höher die Beschäftigung, desto höhere Reallöhne fordern die Arbeitnehmer:innen, weil sie weniger Angst vor Arbeitslosigkeit haben.</li>
<li><b>Preissetzung</b> (waagerecht): der Reallohn, den die Unternehmen über ihre Preissetzung zu zahlen bereit sind.</li></ul>
<p>Im Schnittpunkt liegt das Gleichgewicht, die NAIRU. Ist die Beschäftigung höher, klafft eine <b>Lücke</b>: Die Arbeitnehmer:innen wollen einen höheren Reallohn, als die Unternehmen zahlen wollen. Sie fordern die erwartete Inflation plus die Lücke, die Unternehmen erhöhen die Preise entsprechend:</p>
${cmp([["Periode","Erwartet","Lücke","Löhne","Preise"],["0","4","0","4","4"],["1","4","2","6","6"],["2","6","2","8","8"],["3","8","2","10","10"]])}
<p class="small muted">Alle Werte in %. Erwartet = erwartete Inflation, Löhne und Preise = Anstieg in dieser Periode.</p>
<p>Die Inflation beschleunigt sich, die Reallöhne bleiben gleich. Liegt die Beschäftigung unter dem Gleichgewicht (Lücke −2 %), sinkt die Inflation von Periode zu Periode bis in die Deflation.</p>
{{fig:g6a}}
<div class="merk"><b>Klausur 2024, 7 Punkte</b>Führt ein Konjunkturprogramm zu Y* > Y<sub>POT</sub>, liegt die Beschäftigung rechts vom Gleichgewicht. Auf dem Arbeitsmarkt klafft die Lücke zwischen Lohn- und Preissetzung, in der Phillips-Kurven-Grafik verschiebt sich die kurzfristige Kurve Periode für Periode nach oben: steigende Inflation.</div>`,
check:[
 {q:"Inflation 2 %, ab t1 Lücke von 2 %. Wie stark steigen die Preise in t2?", o:["2 %","4 %","6 %","8 %"], a:2, ex:"t1: 2 + 2 = 4 %. t2: 4 + 2 = 6 %. Jede Periode kommt die Lücke auf die Inflation der Vorperiode.", w:["2 % ist die Ausgangsinflation, die Lücke fehlt.", "4 % ist die Inflation in t1, gefragt ist t2.", null, "8 % wäre die Inflation in t3."]},
 {q:"Was passiert in der Lohn-Preis-Spirale mit den Reallöhnen?", o:["Sie steigen um die Lücke","Sie bleiben konstant","Sie sinken","Sie steigen mit der Inflation"], a:1, ex:"Die Unternehmen geben jede Lohnsteigerung an die Preise weiter.", w:["Die Arbeitnehmer:innen fordern die Lücke, die Unternehmen erhöhen aber die Preise genauso stark.", null, "Sie sinken nicht: Löhne und Preise steigen gleich schnell.", "Die Nominallöhne steigen mit der Inflation, die Reallöhne gerade nicht."]}
]},
{id:"6-5", t:"„Irrelevanz der Wirtschaftspolitik“", html:`
<p>Monetarismus und Neuklassik folgern:</p>
<ul><li>Keine diskretionäre Konjunkturpolitik, stattdessen <b>regelgebundene</b> Wirtschaftspolitik.</li>
<li><b>Ricardianische Äquivalenz</b>: Erhöht der Staat sein Defizit, sparen die Privaten im gleichen Umfang mehr, weil sie künftige Steuererhöhungen erwarten. Kein Nachfrageeffekt, der Multiplikator ist null oder sehr klein.</li>
<li>Geld- und Fiskalpolitik sollen auch kurzfristig nicht aktiv stabilisieren.</li>
<li>Arbeits-, Güter- und Finanzmärkte sollen flexibilisiert werden.</li></ul>
<p>Die Neuklassik arbeitet mit <b>rationalen Erwartungen</b> und allgemeiner Gleichgewichtstheorie. Das Lehrbuch-Bild der Vorlesung: Wirtschaftspolitik kann die Menschen nicht systematisch täuschen.</p>`,
check:[{q:"Warum ist der Multiplikator nach der Ricardianischen Äquivalenz nahe null?", o:["Weil die Zinsen sinken","Weil Haushalte für erwartete Steuererhöhungen mehr sparen","Weil Importe steigen","Weil der Staat spart"], a:1, ex:"Der höhere Staatskonsum wird durch geringeren privaten Konsum ausgeglichen.", w:["Über die Zinsen sagt die These nichts.", null, "Importe spielen bei der Ricardianischen Äquivalenz keine Rolle.", "Der Staat spart gerade nicht, er macht ein Defizit."]}]},
{id:"6-6", t:"Neuer Konsens und Inflation Targeting", html:`
<p>Seit den 1980ern ist die <b>Neue Neoklassische Synthese</b> (Neukeynesianismus, Neuer Konsens) internationaler Mainstream: Gregory Mankiw, anfangs Joseph Stiglitz und Paul Krugman, Ben Bernanke. Sie übernimmt die Methode der Neuklassik (rationale Erwartungen), kommt aber zu ähnlichen Schlüssen wie die alte Synthese:</p>
<ul><li>Langfristig: neoklassisch, Beschäftigung und Produktion werden am Arbeitsmarkt bestimmt.</li>
<li>Kurzfristig: keynesianisch, aktive Konjunkturpolitik ist nötig, vor allem über die Geldpolitik.</li></ul>
<div class="eq">Y* = 1/(1 − c₁) · (c₀ − c₁T + d − n·i + G)   (kurzfristig)</div>
<div class="eq">Y* = Y<sub>POT</sub>   (langfristig)</div>
<p>Im langfristigen Gleichgewicht muss das BIP dem Potenzial entsprechen, sonst droht eine Inflations- oder Deflationsspirale. Die Zentralbank soll den Zins so wählen, dass Y* = Y<sub>POT</sub>. Ihre Zinsregel:</p>
<div class="eq">i<sub>t</sub> = i<sub>t−1</sub> + k · (π<sub>t−1</sub> − π<sup>T</sup>),   k > 0</div>
<p>War die Inflation über dem Ziel, steigt der Zins, sonst sinkt er, bis das Ziel erreicht und die Output-Lücke geschlossen ist.</p>
${bsp("Beispiel",[["Gegeben","alter Zins 3 %, k = 0,5, Inflation 1 %, Ziel 2 %"],["Rechnung","$ i = 3 % + 0,5 · (1 % − 2 %) = 2,5 %"],["Deutung","Die Inflation liegt unter dem Ziel, also senkt die Zentralbank den Zins."]])}
<div class="merk"><b>Wirtschaftspolitik vor der Finanzkrise</b><ul style="margin:.3em 0"><li>Angebotsorientierung: Flexibilisierung von Güter-, Arbeits- und Finanzmärkten</li><li>Passive Fiskalpolitik: Stabilitätspakt, Schuldenbremse</li><li>Aktive Konjunktursteuerung über ein Inflationsziel <span class="pz">(Inflation Targeting)</span>: Die EZB zielt auf eine Inflation unter, aber nahe 2 %.</li></ul> In einer Währungsunion ist länderspezifische Nachfragesteuerung über die Geldpolitik nicht möglich, diese Rolle müsste die Fiskalpolitik übernehmen.</div>`,
check:[
 {q:"i(t−1) = 2 %, k = 1, Inflation 4 %, Ziel 2 %. Welchen Zins setzt die Zentralbank?", o:["2 %","3 %","4 %","6 %"], a:2, ex:"i = 2 + 1 · (4 − 2) = 4 %.", w:["2 % ist der alte Zins. Weil die Inflation über dem Ziel liegt, muss er steigen.", "3 % entsteht, wenn man nur die halbe Abweichung addiert. Bei k = 1 zählt sie voll.", null, "6 % = 2 + 4: Addiert wird die Abweichung vom Ziel (4 − 2), nicht die ganze Inflation."]},
 {q:"Welche Rolle hat die Fiskalpolitik im Neuen Konsens?", o:["Aktive Konjunktursteuerung","Eher passiv, regelgebunden","Sie setzt das Inflationsziel","Sie bestimmt das Potenzial"], a:1, ex:"Eher passiv und regelgebunden (Stabilitätspakt, Schuldenbremse). Die Konjunktursteuerung übernimmt die Geldpolitik.", w:["Aktive Konjunktursteuerung übernimmt im Neuen Konsens die Geldpolitik.", null, "Das Inflationsziel setzt die Zentralbank, etwa die EZB.", "Das Potenzial wird langfristig am Arbeitsmarkt bestimmt."]}
]},
{id:"6-7", t:"Angebotspolitik", html:`
<p>Im Neuen Konsens ist mehr Beschäftigung ohne Inflation nur möglich, wenn sich das Arbeitsmarktgleichgewicht verschiebt. Zwei Wege:</p>
<p><b>1. Bei der Lohnsetzung ansetzen</b>: Deregulierung des Arbeitsmarkts, also geringere Arbeitslosenunterstützung, weniger allgemeinverbindliche Flächentarifverträge. Die Lohnsetzungsmacht der Gewerkschaften wird geschwächt, die Lohnsetzungskurve verschiebt sich nach rechts, ebenso die langfristige Phillips-Kurve. Höhere Nachfrage ist nun ohne Inflation möglich (Y<sub>POT</sub> steigt).</p>
{{fig:g6b}}
<p><b>2. Bei der Preissetzung ansetzen</b>: Die Preissetzungskurve verschiebt sich nach oben, etwa durch bessere Ausbildung und höhere Produktivität (Arbeitgeber:innen zahlen höhere Reallöhne) oder mehr Wettbewerb auf dem Gütermarkt (niedrigere Preise).</p>
<div class="merk"><b>Unterscheide</b>Neoklassische Arbeitslosigkeit muss auf dem Arbeitsmarkt bekämpft werden. Keynesianische Arbeitslosigkeit entsteht durch zu geringe Güternachfrage im Vergleich zum Vollbeschäftigungsoutput und wird über die Nachfrage bekämpft.</div>`,
check:[{q:"Wie wirkt eine Deregulierung des Arbeitsmarkts im Neuen Konsens?", o:["Lohnsetzung verschiebt sich nach rechts, Potenzial steigt","Preissetzung sinkt","Die Inflation steigt dauerhaft","Die kurzfristige Phillips-Kurve wird vertikal"], a:0, ex:"Die Lohnsetzungsmacht sinkt, die Lohnsetzungskurve verschiebt sich nach rechts. Die NAIRU sinkt, mehr Beschäftigung ohne steigende Inflation ist möglich.", w:[null, "Die Preissetzung ändert sich über Produktivität oder Wettbewerb, nicht über Deregulierung.", "Im Gegenteil: Mehr Beschäftigung wird ohne steigende Inflation möglich.", "Vertikal ist nur die langfristige Phillips-Kurve. Sie verschiebt sich nach rechts."]}]}
];

LESSONS[7]=[
{id:"7-1", t:"Postkeynesianismus im Überblick", html:`
<p>Begründet von Keynes' Kolleg:innen und Nachfolger:innen in Cambridge (Joan Robinson, Nicholas Kaldor) in den 1950er und 1960er Jahren, aufbauend auf Keynes und Michał Kalecki.</p>
<ul><li>Kritik am „Bastard-Keynesianismus“ der Neoklassischen Synthese und des Neuen Konsenses</li>
<li>Nachfrage ist kurz- <b>und</b> langfristig relevant (Hysterese)</li>
<li>Zweifel an der Wirksamkeit der Geldpolitik</li>
<li><b>Functional Finance</b>: zentrale Rolle der Fiskalpolitik gegen Arbeitslosigkeit, Staatsverschuldung ist kein Hindernis für Vollbeschäftigungspolitik</li>
<li>Expliziter Zusammenhang von Verteilung zwischen Klassen (Arbeiter:innen, Kapitalist:innen) und Nachfrage bzw. Wachstum</li>
<li>„Soziologischer“ Blick: Konventionen, fundamentale Unsicherheit, Erwartungen, Machtverhältnisse, Institutionen</li></ul>
<p>Auch neukeynesianische Ökonom:innen entdecken diese Konzepte zunehmend wieder.</p>`,
check:[{q:"In welchen Zeithorizonten ist die Nachfrage aus postkeynesianischer Sicht relevant?", o:["Nur kurzfristig","Nur langfristig","Kurz- und langfristig","Gar nicht"], a:2, ex:"Kurz- und langfristig: Über Hysterese prägt die Nachfrage auch das Produktionspotenzial.", w:["Nur kurzfristig ist die Sicht des Neuen Konsenses. Genau das kritisiert der Postkeynesianismus als „Bastard-Keynesianismus“.", "Die kurze Frist zählt auch: Dort entsteht der Nachfragemangel.", null, "Die Nachfrage steht im Zentrum des Postkeynesianismus."]}]},
{id:"7-2", t:"Zweifel an der Geldpolitik", html:`
<p>Investitions- und Konsumentscheidungen hängen weniger vom Zentralbankzins ab als von</p>
<ul><li>den animal spirits der Unternehmen,</li><li>sozialen Normen,</li><li>Institutionen,</li><li>der Einkommensverteilung.</li></ul>
<p>Dazu kommen die Grenzen aus dem Kapitel zur Geld- und Fiskalpolitik: In der <b>Nominalzinsfalle</b> ist der Realzins trotz Nullzins zu hoch, in der <b>Investitionsfalle</b> reagieren die Investitionen nicht auf den Zins. Dann hilft nur Fiskalpolitik.</p>
<div class="merk"><b>Kein sicherer Kompass</b>Eine seriöse Messung der Output-Lücke als Orientierung für die Geldpolitik ist unmöglich, weil das Potenzial selbst von der Nachfrage abhängt (Hysterese).</div>`,
check:[{q:"Warum ist die Output-Lücke aus postkeynesianischer Sicht kein sicherer Kompass?", o:["Weil das BIP nicht gemessen wird","Weil das Potenzial wegen Hysterese selbst von der Nachfrage abhängt","Weil die Zentralbank sie geheim hält","Weil sie immer null ist"], a:1, ex:"Das Potenzial hängt über Hysterese selbst von der Nachfrage ab. Schätzungen des Potenzials folgen deshalb dem tatsächlichen BIP.", w:["Das BIP wird gemessen. Nicht beobachtbar ist das Potenzial.", null, "Die Lücke ist nicht geheim, sondern geschätzt, und die Schätzung ist das Problem.", "Die Lücke ist nicht immer null, sie ist nur schwer zu messen."]}]},
{id:"7-3", t:"Hysterese am Arbeitsmarkt", html:`
<p><b>Hysterese</b> (griechisch hysteros, später): Der Zustand eines Systems hängt nicht nur von der aktuellen Eingangsgröße ab, sondern auch von seinem früheren Zustand. Einfach gesagt: Ein Zustand dauert fort, auch wenn die Anregung weggefallen ist.</p>
<p>Am Arbeitsmarkt: Zunächst liegt keynesianische Arbeitslosigkeit vor, die Güternachfrage ist zu gering (Y* < Y<sub>POT</sub>). Hält das länger an,</p>
<ul><li>verschiebt sich die <b>Lohnsetzung nach oben</b>, weil Langzeitarbeitslose den Bezug zur Arbeitswelt verlieren und keinen Lohndruck mehr auf Beschäftigte ausüben,</li>
<li>verschiebt sich die <b>Preissetzung nach unten</b>, weil die Arbeitsproduktivität wegen unterlassener Investitionen in den Kapitalstock fällt.</li></ul>
{{fig:g7a}}
<p>Im Ergebnis sinkt die gleichgewichtige Beschäftigung, das Produktionspotenzial fällt, der Deflationsdruck nimmt ab. Kurzfristiger Nachfragemangel führt zu langfristigen Produktionseinbußen. Langfristig wird jedes Arbeitsmarktgleichgewicht möglich. Das gilt analog für „zu hohe“ Nachfrage: Ein Boom kann das Potenzial erhöhen.</p>
<div class="merk"><b>Klausur 2024 (Zweittermin), 7 Punkte</b>„Zeigen Sie grafisch, wie laut Postkeynesianismus Hysterese am Arbeitsmarkt entstehen kann, wenn die Güternachfrage zu lange unter dem ursprünglichen Potenzialoutput liegt.“ Genau diese Grafik.</div>`,

{id:"7-4", t:"Hysterese durch falsche Diagnose", html:`
<p>Im Abschwung fällt das Wachstum, Defizit und Arbeitslosigkeit steigen. Ist das ein <b>strukturelles</b> <span class="pz">(dauerhaftes Angebotsproblem)</span> oder ein <b>konjunkturelles</b> <span class="pz">(vorübergehende Nachfrageschwäche)</span> Problem?</p>
<ol class="steps"><li>Die Politik hält ein konjunkturelles Problem fälschlich für strukturell.</li><li>Sie reagiert mit Deregulierung und Sparpolitik <span class="pz">(Austerität)</span>.</li><li>Es entsteht Hysterese: Das ursprünglich konjunkturelle Problem wird durch die falsche Politik zu einem strukturellen.</li></ol>
<h3>Das Randwertproblem</h3>
<p>Potenzial und NAIRU werden aus dem beobachteten BIP und der beobachteten Arbeitslosigkeit geschätzt. Am aktuellen Rand ist unklar, ob man den alten Trend fortschreibt oder ihn an die neuen Daten anpasst. Passt man an, erscheint ein Abschwung strukturell:</p>
<ul><li>Das geschätzte Potenzial sinkt mit.</li><li>Die Output-Lücke schrumpft.</li><li>Das strukturelle Defizit wächst.</li></ul>
<div class="merk"><b>Beispiel Spanien</b>Die EU-Kommission schätzte, dass die strukturelle Arbeitslosigkeit (NAWRU) von unter 10 % (2007) auf über 25 % (2013) stieg. Fast die ganze Arbeitslosigkeit galt damit als strukturell, Arbeitsmarktreformen und Sparprogramme wurden gefordert. Schreibt man die NAWRU dagegen fort, wäre der Anstieg konjunkturell gewesen und hätte Konjunkturprogramme gerechtfertigt.</div>`,
check:[{q:"Was ist das Randwertproblem?", o:["Die Zentralbank kann den Zins nicht unter null senken","Potenzial und NAIRU am aktuellen Rand hängen davon ab, ob man den Trend fortschreibt oder anpasst","Die Leistungsbilanz der Welt ist null","Das BIP misst keine Sorgearbeit"], a:1, ex:"Je nach Methode erscheint derselbe Abschwung konjunkturell oder strukturell.", w:["Das ist die Nominalzinsfalle.", null, "Das ist die Salden-Identität für die Welt.", "Das ist die feministische BIP-Kritik."]}]},
{id:"7-5", t:"Eine postkeynesianische Phillips-Kurve", html:`
<p>Postkeynesianisch hat die Lohnsetzungskurve einen <b>horizontalen Abschnitt</b>: In einem breiten Bereich führt mehr Beschäftigung nicht zu höheren Lohnforderungen. Entsprechend hat auch die kurzfristige Phillips-Kurve einen horizontalen Abschnitt. Mehr Beschäftigung ist dort ohne steigende Inflation möglich, es gibt keine eindeutige NAIRU.</p>
<p><b>Einkommenspolitik</b>: Arbeitgeber:innen und Arbeitnehmer:innen verzichten, unter Druck oder Vermittlung der Regierung, auf Lohn-Preis-Spiralen und machen so den Weg frei für mehr Beschäftigung ohne Inflation.</p>
<h3>Vergleich mit dem Neukeynesianismus</h3>
${cmp([["","Neukeynesianismus","Postkeynesianismus"],["NAIRU","eindeutig","keine eindeutige (horizontaler Abschnitt)"],["Mehr Beschäftigung ohne Inflation durch","Angebotsreformen (Deregulierung)","Nachfragepolitik, gestützt durch Einkommenspolitik"]])}`,
check:[{q:"Welche Politik empfiehlt der Postkeynesianismus, um mehr Beschäftigung ohne Inflation zu erreichen?", o:["Deregulierung des Arbeitsmarkts","Einkommenspolitik und Nachfragepolitik","Höhere Zinsen","Ausgeglichene Haushalte"], a:1, ex:"Sozialpartner verzichten unter Vermittlung der Regierung auf Lohn-Preis-Spiralen.", w:["Deregulierung ist die Antwort des Neuen Konsenses.", null, "Höhere Zinsen würden die Beschäftigung senken.", "Ausgeglichene Haushalte widersprechen der Functional Finance des Postkeynesianismus."]}]},
{id:"7-6", t:"Das Kostenparadox mit Kalecki", html:`
<p>Postkeynesianisch hängt die Nachfrage von der Verteilung ab. Kaleckianische Konsumfunktion mit unterschiedlichen Konsumneigungen aus Löhnen und Gewinnen:</p>
<div class="eq">C = a<sub>W</sub> + a<sub>Π</sub> + b<sub>W</sub>W + b<sub>Π</sub>Π,   W = w·Y,   Π = (1 − w)·Y</div>
${bsp("Beispiel der Vorlesung",[["Gegeben","a_W = 60, a_Π = 40, b_W = 0,9, b_Π = 0,5, I = 100, Lohnanteil w = 0,6"],["Rechnung","$ Y* = 200 / (1 − 0,9 · 0,6 − 0,5 · 0,4) = 200 / 0,26 ≈ 769,23"],["Lohnanteil 0,7","$ Y* = 200 / (1 − 0,63 − 0,15) = 200 / 0,22 ≈ 909,09"],["Deutung","Mehr Einkommen geht an die, die mehr davon ausgeben. Die Nachfrage steigt."]])}
${bsp("Mit Investitionen I = 100 + 0,12Y (Aufgabenblatt 7)",[["Lohnanteil 0,6","$ Y* = 200 / 0,14 ≈ 1428,57\n$ Π = 0,4 · 1428,57 ≈ 571,43"],["Lohnanteil 0,7","$ Y* = 200 / 0,10 = 2000\n$ Π = 0,3 · 2000 = 600"],["Ergebnis","Die Gewinne steigen, obwohl die Unternehmen höhere Löhne zahlen."]])}
<div class="merk"><b>Kostenparadox</b>Alle Unternehmen zahlen höhere Löhne, und trotzdem steigen die gesamtwirtschaftlichen Gewinne, weil die Nachfrage stärker wächst. Basis ist die höhere Konsumneigung aus Löhnen.</div>`,
check:[{q:"Worauf beruht das Kostenparadox?", o:["Auf sinkenden Zinsen","Auf der höheren Konsumneigung aus Löhnen als aus Gewinnen","Auf steigenden Exporten","Auf höherer Produktivität"], a:1, ex:"Umverteilung zu den Löhnen erhöht die durchschnittliche Konsumneigung und damit die Nachfrage.", w:["Zinsen kommen im Kalecki-Modell der Vorlesung nicht vor.", null, "Exporte erhöhen Gewinne auch, erklären aber nicht das Kostenparadox.", "Die Produktivität bleibt im Beispiel gleich. Es ändert sich nur die Verteilung."]}]}
];

{id:"8-1", t:"Spielarten des Kapitalismus", html:`
<p>Warum sind Arbeits- und Finanzmärkte in manchen Ländern stärker reguliert? Warum ist die Geld- und Fiskalpolitik in manchen Ländern keynesianischer als in anderen? Die Vergleichende Politische Ökonomie unterscheidet:</p>
${cmp([["","Koordinierte Marktwirtschaft (CME)","Liberale Marktwirtschaft (LME)"],["Beispiele","Deutschland, Niederlande, Skandinavien, Japan","USA, Vereinigtes Königreich"],["Produktion","schrittweise Innovation, spezifische Qualifikationen, Kündigungsschutz, geduldige Finanzierung über Banken, Mitbestimmung, Exportorientierung","radikale Innovation, allgemeine Qualifikationen, hire and fire, Finanzierung über den Kapitalmarkt, Shareholder Value"],["Wohlfahrtsstaat","sozialdemokratisch/kontinental, duale Ausbildung","liberal, minimal, College"],["Politisches System","Konsens, Verhältniswahlrecht, Koalitionen","Mehrheitswahlrecht, Ein-Parteien-Regierungen"],["Nachfragesteuerung","regelbasiert, neoklassisch, konservativ","diskretionär, keynesianisch, offensiv"]])}
<h3>Warum?</h3>
<div class="dlist"><b>CME</b><span>Die exportorientierte Industrie ist auf preisliche Wettbewerbsfähigkeit angewiesen, die Geld- und Fiskalpolitik soll Inflation vermeiden. Ein starker Sozialstaat sichert ab.</span><b>LME</b><span>Die soziale Sicherung ist schwach, deshalb ist expansive Politik nötig, um längere Arbeitslosigkeit zu vermeiden. Externe Wettbewerbsfähigkeit ist weniger wichtig.</span></div>
<p>Empirisch schwanken in den USA Arbeitslosenquote, staatlicher Finanzierungssaldo und Leitzinsen stärker als in Deutschland.</p>`,

{id:"8-2", t:"Wachstumsmodelle: vom Fordismus zur Finanzialisierung", html:`
<p><b>Fordismus (1945–1970er)</b>: lohngetriebenes Wachstum. Steigende Löhne tragen den Massenkonsum, Investitionen und Gewinne wachsen im Gleichschritt. Regulierte Finanzmärkte, wenig Spielraum für private oder Auslandsverschuldung, keynesianische Fiskalpolitik.</p>
<p><b>Krise (1970er)</b>: „zu hohe Löhne“. Zwei Deutungen:</p>
<ul><li><b>Regimewechsel</b> von lohngetriebenem <span class="pz">(wage-led)</span> zu gewinngetriebenem <span class="pz">(profit-led)</span> Wachstum, weil hohe Lohnkosten die Investitionen belasten.</li><li><b>Politischer Widerstand</b> der Kapitalseite gegen an Vollbeschäftigung gewöhnte Gewerkschaften. Mitterrand wollte 1981–83 einen Übergang zum Sozialismus, Thatcher und Reagan wollten die Macht der Gewerkschaften brechen.</li></ul>
<p>Es folgte der Neoliberalismus.</p>
<p><b>Neoliberalismus und Finanzialisierung (1980–2008)</b>: Die Löhne der Mittelschicht fallen als Basis der Konsumnachfrage aus, Investitionen leiden unter der Shareholder-Value-Orientierung. Zwei „Lösungen“:</p>
<ul><li><b>Schuldengetriebenes Wachstum</b> (debt-led), USA, Vereinigtes Königreich: Untere Einkommensgruppen verschulden sich für Konsum, dazu Staats- und Leistungsbilanzdefizite.</li>
<li><b>Exportorientiertes Wachstum</b> (export-led), Deutschland, Japan, China: Lohnzurückhaltung, Unternehmensersparnis und Staatsüberschüsse schwächen die Binnennachfrage, Leistungsbilanzüberschüsse.</li></ul>
<p><b>Krise seit 2008</b>: Schuldenkrise der privaten Haushalte (USA, UK) und Schuldenkrise bei den Handelspartnern der Exportländer.</p>`,

]},
{id:"8-3", t:"Kaleckis Gewinngleichung", html:`
<p>Aus Y = C<sub>W</sub> + C<sub>Π</sub> + I + G + X − M und Y = W<sub>netto</sub> + Π<sub>netto</sub> + T folgt:</p>
<div class="eq">Π<sub>netto</sub> = C<sub>Π</sub> + I − S<sub>W</sub> + (G − T) + (X − M)</div>
<p>mit S<sub>W</sub> = W<sub>netto</sub> − C<sub>W</sub>, der Ersparnis aus Löhnen. Teilt man durch den Kapitalstock K, erhält man die Profitrate r = Π/K und die Akkumulationsrate g = I/K.</p>
<p>Ausgangspunkt postkeynesianischer Wachstums- und Verteilungsmodelle sind die <b>„Gewinne ohne Investitionen“</b> im neoliberalen Zeitalter. Die Lücke r − g kann steigen, wenn</p>
<ul><li>mehr Gewinne ausgeschüttet und daraus konsumiert wird (USA),</li>
<li>die Ersparnis aus Löhnen sinkt oder negativ wird (debt-led, USA),</li>
<li>die Nettoexporte steigen (export-led, Deutschland).</li></ul>`,
check:[{q:"Nach Kaleckis Gewinngleichung: Was erhöht die Gewinne, ohne dass investiert wird?", o:["Höhere Ersparnis aus Löhnen","Höhere Nettoexporte","Höhere Steuern","Sinkende Staatsausgaben"], a:1, ex:"Die Nettoexporte X − M stehen mit Plus in der Gewinngleichung. Steigen sie, steigen die Gewinne, auch ohne Investitionen.", w:["S_W steht mit Minus in der Gleichung: Mehr Ersparnis aus Löhnen senkt die Gewinne.", null, "T steht mit Minus in (G − T): Höhere Steuern senken die Gewinne.", "G steht mit Plus: Sinkende Staatsausgaben senken die Gewinne."]}]},
{id:"8-4", t:"Ungleichheit und Krise", html:`
<p>In den USA stieg der Anteil der oberen 10 %, 1 % und 0,1 % an den Haushaltseinkommen seit den 1980ern stark. Gleichzeitig fiel die Sparquote der Haushalte, und ihre Verschuldung stieg auf weit über 100 % des verfügbaren Einkommens. Die Nachfrage der Mittelschicht hielt sich über Kredit, bis die Schuldenkrise 2007 ausbrach.</p>
<p>In Deutschland sank der Anteil der verfügbaren Haushaltseinkommen am Gesamteinkommen, Unternehmen und Staat steigerten ihre Anteile. Seit etwa 2000 haben Haushalte und Unternehmen, seit etwa 2010 auch der Staat positive Finanzierungssalden. Nach der Salden-Identität muss sich dann das Ausland verschulden: Die schwache Binnennachfrage zeigt sich in Exportüberschüssen.</p>
<div class="merk"><b>Für den Essay</b>Die Verbindung von Verteilung (funktional, sektoral, personell) und Wachstumsmodell erklärt, warum hohe Ungleichheit postkeynesianisch als Krisenursache gilt: Entweder fehlt Nachfrage, oder sie entsteht über Verschuldung im Inland oder im Ausland.</div>`,
check:[{q:"Wie hängen in den USA Ungleichheit und Krise 2007 zusammen?", o:["Gar nicht","Die Mittelschicht hielt ihren Konsum über Verschuldung, bis die Schuldenkrise kam","Steigende Löhne lösten die Krise aus","Exportüberschüsse führten zur Krise"], a:1, ex:"Schuldengetriebenes Wachstum: Die Sparquote sank, die Verschuldung stieg, bis die private Schuldenkrise ausbrach.", w:["Die Vorlesung sieht einen engen Zusammenhang: Ungleichheit schwächt die Nachfrage der Mittelschicht.", null, "Die Löhne der Mittelschicht stagnierten gerade.", "Die USA hatten Leistungsbilanzdefizite, keine Überschüsse."]}]}

 {id:"c6-01", f:"Wie entstehen Lohn-Preis-Spiralen?", b:"1. Die Beschäftigung liegt über dem Gleichgewicht (NAIRU).\n2. Arbeitnehmer:innen fordern die erwartete Inflation plus die Reallohnlücke (Differenz zwischen gefordertem und gezahltem Reallohn).\n3. Die Unternehmen erhöhen die Preise entsprechend.\nFolge: Die Inflation beschleunigt sich, die Reallöhne bleiben konstant."},
 {id:"c6-02", f:"Neoklassische Synthese: Grundidee", b:"| | Kurze Frist | Lange Frist\n| Sicht | keynesianisch | neoklassisch (flexible Preise, S bestimmt I)\nVertreter: Samuelson, Hicks\nZeit: Mainstream von 1945 bis Anfang der 1970er"},
 {id:"c6-03", f:"Ursprüngliche und modifizierte Phillips-Kurve", b:"Ursprünglich: Je geringer die Arbeitslosigkeit, desto schneller steigen die Nominallöhne.\nModifiziert: Je geringer die Arbeitslosigkeit, desto höher die Preisinflation.\n$ π = f(U)"},
 {id:"c6-04", f:"„5 % Inflation sind mir lieber als 5 % Arbeitslosigkeit“", b:"Helmut Schmidt, 1970er Jahre\nIdee: ein **dauerhafter Zielkonflikt** entlang der Phillips-Kurve. Die Politik kann mehr Inflation für weniger Arbeitslosigkeit wählen.\nMonetarismus und Neuklassik bestreiten das später."},
 {id:"c6-05", f:"Natürliche Arbeitslosigkeit (NAIRU)", b:"Definition: die Arbeitslosenquote, bei der sich die Inflation **nicht beschleunigt**\nGrafik: Die langfristige Phillips-Kurve ist dort vertikal.\nUrsachen: zu hohe Löhne, Rigiditäten (z. B. Kündigungsschutz, Tarifbindung, hohe Arbeitslosenunterstützung)"},
 {id:"c6-06", f:"Friedmans Erklärung der vertikalen Phillips-Kurve", b:"1. Kurzfristig werden Arbeitnehmer:innen über die Inflation getäuscht: Sie halten höhere Nominallöhne für höhere Reallöhne.\n2. Die höhere Inflation wird künftig erwartet.\n3. Die kurzfristige Phillips-Kurve verschiebt sich nach oben.\nLangfristig müssen die Erwartungen erfüllt sein, die Kurve ist vertikal."},
 {id:"c6-07", f:"Stagflation", b:"Stagnation (Stillstand) bei gleichzeitiger Inflation\nZeit: 1970er, nach den Ölpreisschocks\nErklärung des Monetarismus: Nachfragepolitik über die natürliche Arbeitslosigkeit hinaus"},
 {id:"c6-08", f:"„Irrelevanz der Wirtschaftspolitik“", b:"Folgerung von Monetarismus und Neuklassik:\n- keine diskretionäre Konjunkturpolitik\n- regelgebundene Politik (z. B. festes Inflationsziel)\n- Ricardianische Äquivalenz: Multiplikator nahe null\n- Flexibilisierung der Märkte"},
 {id:"c6-09", f:"Lohnsetzung und Preissetzung", b:"Lohnsetzung (steigend): der Reallohn, den Arbeitnehmer:innen je nach Beschäftigung fordern\nPreissetzung (waagerecht): der Reallohn, den Unternehmen zu zahlen bereit sind\nSchnittpunkt: Gleichgewicht, die NAIRU"},
 {id:"c6-10", f:"Neuer Konsens: lang- und kurzfristig", b:"| | Kurzfristig | Langfristig\n| Was zählt? | die Nachfrage | der Arbeitsmarkt\n| Politik | aktive Konjunkturpolitik, vor allem über die Geldpolitik | Angebotspolitik\n| Gleichgewicht | Y* = 1/(1 − c₁) · (…) | Y* = Y_POT"},
 {id:"c6-11", f:"Wirtschaftspolitischer Mainstream vor der Krise", b:"- Angebotsorientierung: Politik setzt bei Produktion und Arbeitsmarkt an, z. B. durch Flexibilisierung.\n- Passive Fiskalpolitik: Stabilitäts- und Wachstumspakt der EU, Schuldenbremse\n- Aktive Geldpolitik: Steuerung über ein Inflationsziel (Inflation Targeting), bei der EZB unter, aber nahe 2 %"},
 {id:"c6-12", f:"Langfristige Gleichgewichtsbedingung im Neuen Konsens", b:"$ Y* = Y_POT\nSonst droht eine Inflations- oder Deflationsspirale (sich selbst verstärkender Anstieg oder Verfall der Preise).\nDie Zentralbank wählt den Zins so, dass das erreicht wird."},
 {id:"c6-13", f:"Zinsregel beim Inflation Targeting", b:"$ iₜ = iₜ₋₁ + k · (πₜ₋₁ − πᵀ),  k > 0\nInflation über dem Ziel: Zins rauf\nInflation unter dem Ziel: Zins runter\nBeispiel: iₜ₋₁ = 2 %, k = 1, Inflation 4 %, Ziel 2 % ⇒ iₜ = 4 %"},
 {id:"c6-14", f:"Steuerung über ein Inflationsziel (Inflation Targeting): welche Denkschule, welche Rolle der Fiskalpolitik?", b:"Denkschule: Neuer Konsens (Neue Neoklassische Synthese)\nFiskalpolitik: passiv\nGeldpolitik: stabilisiert die Inflation und schließt damit die Output-Lücke"},
 {id:"c6-15", f:"Konjunkturprogramm mit Y* > Y_POT im Neuen Konsens", b:"1. Die Beschäftigung liegt über dem Gleichgewicht (NAIRU).\n2. Zwischen Lohn- und Preissetzung klafft eine Lücke.\n3. Die kurzfristige Phillips-Kurve verschiebt sich Periode für Periode nach oben: steigende Inflation.\nReaktion: Die Zentralbank muss den Zins erhöhen."},
 {id:"c6-16", f:"Angebotspolitik über die Lohnsetzung", b:"Maßnahme: Deregulierung, z. B. geringere Arbeitslosenunterstützung, weniger Flächentarifverträge\nWirkung: Die Lohnsetzungsmacht sinkt. Lohnsetzungskurve und langfristige Phillips-Kurve verschieben sich nach rechts.\nErgebnis: Y_POT steigt, mehr Beschäftigung ohne Inflation"},
 {id:"c6-17", f:"Angebotspolitik über die Preissetzung", b:"Ziel: Die Preissetzungskurve verschiebt sich nach oben.\nWege:\n- bessere Ausbildung und höhere Produktivität (Arbeitgeber:innen zahlen höhere Reallöhne)\n- mehr Wettbewerb auf dem Gütermarkt (niedrigere Preise)"},
 {id:"c6-18", f:"Neoklassische vs. keynesianische Arbeitslosigkeit: wo bekämpfen?", b:"| | Neoklassisch | Keynesianisch\n| Ursache | Arbeitsmarkt (zu hohe Löhne, Rigiditäten) | zu geringe Güternachfrage\n| Bekämpfung | auf dem Arbeitsmarkt | über die Nachfrage"},
