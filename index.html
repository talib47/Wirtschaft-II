 {id:"c7-03", f:"Functional Finance", b:"Die Fiskalpolitik spielt die **zentrale Rolle** gegen Arbeitslosigkeit.\nStaatsverschuldung ist kein Hindernis für Vollbeschäftigungspolitik."},
 {id:"c7-04", f:"Hysterese: Definition", b:"Ein Zustand dauert fort, auch wenn die Anregung weggefallen ist.\nMakro: Kurzfristiger Nachfragemangel führt zu dauerhaft geringerem Produktionspotenzial."},
 {id:"c7-05", f:"Hysterese im Arbeitsmarktdiagramm", b:"- Lohnsetzung verschiebt sich nach oben: Langzeitarbeitslose üben keinen Lohndruck mehr aus.\n- Preissetzung verschiebt sich nach unten: Die Produktivität sinkt durch fehlende Investitionen.\nErgebnis: Gleichgewichtige Beschäftigung und Potenzial sinken."},
 {id:"c7-06", f:"Hysterese-Gefahr durch Austerität", b:"1. Im Abschwung liegt ein konjunkturelles Problem vor (vorübergehende Nachfrageschwäche).\n2. Die Politik deutet es fälschlich als strukturell (dauerhaftes Angebotsproblem).\n3. Sie reagiert mit Sparpolitik (Austerität) und Deregulierung.\nFolge: Das Problem wird tatsächlich strukturell."},
 {id:"c7-07", f:"Randwertproblem", b:"Potenzial und NAIRU (strukturelle Arbeitslosigkeit) werden aus den beobachteten Daten geschätzt.\nAm aktuellen Rand folgen die Schätzungen den neuen Daten.\nFolge: Ein Abschwung erscheint strukturell, die Output-Lücke klein.\nBeispiel: Spanien 2007 bis 2013, geschätzte strukturelle Arbeitslosigkeit von unter 10 % auf über 25 %"},
 {id:"c7-08", f:"Wie verhält sich das BIP bei positiver Output-Lücke zum Potenzial?", b:"Das beobachtete BIP liegt **über** dem (geschätzten) Produktionspotenzial.\nGegenstück: Bei negativer Lücke liegt es darunter."},
 {id:"c7-09", f:"Postkeynesianische Phillips-Kurve", b:"Die Lohnsetzung und die kurzfristige Phillips-Kurve haben einen **horizontalen Abschnitt**.\nDort ist mehr Beschäftigung ohne steigende Inflation möglich.\nEs gibt keine eindeutige NAIRU."},
 {id:"c7-10", f:"Einkommenspolitik", b:"Gewerkschaften und Arbeitgeberverbände verzichten unter Druck oder Vermittlung der Regierung auf Lohn-Preis-Spiralen.\nZiel: mehr Beschäftigung ohne Inflation\nGegenstück im Neuen Konsens: Deregulierung"},
 {id:"c7-11", f:"Kaleckianische Konsumfunktion", b:"$ C = a_W + a_Π + b_W · W + b_Π · Π\nb_W > b_Π: Aus Löhnen wird ein größerer Anteil konsumiert als aus Gewinnen.\nFolge: Die Verteilung beeinflusst die Nachfrage."},
 {id:"c7-12", f:"Basis des Kostenparadoxes", b:"Basis: die **höhere Konsumneigung aus Löhnen**\nWirkung: Ein höherer Lohnanteil erhöht Nachfrage und Einkommen.\nParadox: Trotz höherer Lohnkosten können die Gewinne steigen.\nBeispiel (Aufgabenblatt 7): Lohnanteil 0,6 → 0,7, Gewinne ≈ 571 → 600"},
 {id:"c7-13", f:"Gründe für Zweifel an der Geldpolitik (postkeynesianisch)", b:"Investitionen und Konsum hängen mehr ab von\n- der Stimmung der Unternehmen (animal spirits),\n- sozialen Normen (z. B. was als angemessener Lebensstandard gilt),\n- Institutionen (z. B. Tarifsystem, Bankenregulierung),\n- der Einkommensverteilung\nals vom Zins. Dazu kommen Nominalzins- und Investitionsfalle, und die Output-Lücke ist nicht seriös messbar."}
];
CARDS[8]=[
 {id:"c8-01", f:"Koordinierte Marktwirtschaft (CME): Merkmale", b:"- regulierte Arbeitsbeziehungen und Unternehmensführung (z. B. Mitbestimmung im Aufsichtsrat)\n- Korporatismus: Staat, Gewerkschaften und Arbeitgeber stimmen sich ab.\n- ausgebauter Sozialstaat, geringe Ungleichheit\n- konservative Geld- und Fiskalpolitik\nBeispiele: Deutschland, Skandinavien, Japan"},
 {id:"c8-02", f:"Liberale Marktwirtschaft (LME): Merkmale", b:"- wenig regulierte Arbeits- und Finanzmärkte\n- Ausrichtung auf den Wert für die Aktionär:innen (Shareholder Value)\n- kleiner Sozialstaat, hohe Ungleichheit\n- offensivere Geld- und Fiskalpolitik\nBeispiele: USA, Vereinigtes Königreich"},
 {id:"c8-03", f:"Warum betreiben CMEs konservative Makropolitik?", b:"- Die exportorientierte Industrie braucht **preisliche Wettbewerbsfähigkeit**, also keine Inflation.\n- Ein starker Sozialstaat federt Arbeitslosigkeit ab.\nBeispiel: Deutschland"},
 {id:"c8-04", f:"Warum betreiben LMEs expansive Makropolitik?", b:"- Die soziale Sicherung ist schwach: Längere Arbeitslosigkeit muss durch **Nachfragepolitik** vermieden werden.\n- Externe Wettbewerbsfähigkeit ist weniger wichtig.\nBeispiel: USA"},
 {id:"c8-05", f:"Fordismus", b:"Zeit: 1945 bis 1970er\n- lohngetriebenes Wachstum: Steigende Löhne tragen die Nachfrage.\n- Massenkonsum; Investitionen und Gewinne wachsen im Gleichschritt\n- regulierte Finanzmärkte\n- keynesianische Fiskalpolitik"},
 {id:"c8-06", f:"Zwei Deutungen der Krise der 1970er", b:"- Regimewechsel: von lohngetriebenem (wage-led) zu gewinngetriebenem (profit-led) Wachstum, weil hohe Lohnkosten die Investitionen belasten\n- Politischer Widerstand: Die Kapitalseite wehrt sich gegen starke Gewerkschaften (Thatcher, Reagan).\nDanach: Neoliberalismus"},
 {id:"c8-07", f:"Schuldengetriebenes Wachstum (debt-led)", b:"Beispiele: USA, Vereinigtes Königreich\n- Untere Einkommensgruppen konsumieren auf Kredit.\n- Staatsdefizite\n- Leistungsbilanzdefizite"},
 {id:"c8-08", f:"Exportgetriebenes Wachstum (export-led)", b:"Beispiele: Deutschland, Japan, China\n- Lohnzurückhaltung (bewusst geringe Lohnsteigerungen)\n- Unternehmensersparnis und Staatsüberschüsse\n- schwache Binnennachfrage\n- Leistungsbilanzüberschüsse"},
 {id:"c8-09", f:"Kaleckis Gewinngleichung", b:"$ Π_netto = C_Π + I − S_W + (G − T) + (X − M)\nC_Π: Konsum aus Gewinnen\nS_W: Ersparnis aus Löhnen\nMit Plus wirken: Konsum aus Gewinnen, Investitionen, Staatsdefizit, Nettoexporte"},
 {id:"c8-10", f:"„Gewinne ohne Investitionen“: drei Kanäle", b:"- Mehr Konsum aus Gewinnen: Gewinne werden an Eigentümer:innen ausgeschüttet und ausgegeben (USA).\n- Sinkende Ersparnis aus Löhnen: Haushalte verschulden sich (debt-led, USA).\n- Steigende Nettoexporte (export-led, Deutschland)"},
 {id:"c8-11", f:"Ungleichheit und Krise 2007 in den USA", b:"1. Die Top-Einkommensanteile steigen (Anteil der Reichsten am Gesamteinkommen).\n2. Die Mittelschicht hält ihren Konsum: Die Sparquote sinkt, die Verschuldung steigt.\n3. 2007 bricht die private Schuldenkrise aus."},
 {id:"c8-12", f:"Verteilung und deutsche Exportüberschüsse", b:"- Der Anteil der Haushaltseinkommen am Gesamteinkommen sinkt.\n- Haushalte, Unternehmen und (seit etwa 2010) der Staat haben Überschüsse.\nNach der Salden-Identität muss sich das **Ausland** verschulden: Die schwache Binnennachfrage zeigt sich in Exportüberschüssen."}
];

ESSAYS[6]=[
 {id:"e6-1", pts:24, klausur:"Zweittermin 2024, Teil III",
  q:"„Gegen Arbeitslosigkeit hilft einzig die Flexibilisierung des Arbeits- und Gütermarkts sowie Investitionen in die Bildung.“ Diskutieren Sie diese Aussage vor dem Hintergrund der Vorlesungsinhalte. Berücksichtigen Sie unterschiedliche theoretische Perspektiven.",
  k:["Einordnung: Aussage ist angebotsorientiert (Neoklassik / Neuer Konsens)","Neoklassik: Arbeitslosigkeit durch zu hohe Löhne und Regulierung, Mindestlohn-Logik","Monetarismus: natürliche Arbeitslosigkeit / NAIRU, vertikale langfristige Phillips-Kurve","Neuer Konsens: Deregulierung verschiebt Lohnsetzung, Bildung und Wettbewerb verschieben Preissetzung, Y_POT steigt","Keynesianisch: Arbeitslosigkeit durch zu geringe Güternachfrage, Ursache auf dem Gütermarkt","Instrumente: Fiskalpolitik (Multiplikator), Geldpolitik, Grenzen (Nominalzins-, Investitionsfalle)","Kostenparadox: Lohnsenkungen können Nachfrage und Beschäftigung senken","Postkeynesianisch: Hysterese, falsche Diagnose verfestigt Arbeitslosigkeit","Einkommenspolitik als Alternative zur Deregulierung","Bildung: auch keynesianisch sinnvoll (staatliche Investitionen, Nachfrage), aber nicht „einzig“","Problem der Unterscheidung strukturell vs. konjunkturell (Randwertproblem)","Begründetes Fazit"],
  m:`Die Aussage vertritt eine angebotsorientierte Sicht: Arbeitslosigkeit gilt als strukturelles Problem des Arbeits- und Gütermarkts.

Aus neoklassischer Sicht ist das schlüssig. Der Arbeitsmarkt bestimmt Beschäftigung und Produktion, Arbeitslosigkeit entsteht durch zu hohe Löhne, etwa durch Mindestlöhne, Gewerkschaftsmacht oder großzügige Sozialleistungen. Monetarismus und Neuklassik ergänzen: Nachfragepolitik über die natürliche Arbeitslosigkeit hinaus erzeugt nur Inflation, die langfristige Phillips-Kurve ist vertikal. Im Neuen Konsens verschiebt eine Deregulierung die Lohnsetzungskurve nach rechts; Bildung und mehr Wettbewerb heben die Preissetzungskurve. Beides senkt die NAIRU und erhöht das Potenzial.

Aus keynesianischer Sicht greift das zu kurz. Keynesianische Arbeitslosigkeit hat ihre Ursache auf dem Gütermarkt: Die Nachfrage reicht nicht für Vollbeschäftigung. Dann helfen Fiskalpolitik über den Multiplikator und Geldpolitik, in der Nominalzins- oder Investitionsfalle nur noch Fiskalpolitik. Flexibilisierung, die Löhne senkt, kann nach dem Kostenparadox sogar schaden: Sinkt der Lohnanteil, sinkt die Konsumnachfrage, weil Lohnbezieher:innen mehr konsumieren.

Der Postkeynesianismus betont Hysterese: Wird ein konjunkturelles Problem fälschlich als strukturell gedeutet und mit Deregulierung und Austerität beantwortet, verfestigt sich die Arbeitslosigkeit, das Potenzial sinkt. Weil Potenzial und NAIRU am aktuellen Rand nur geschätzt werden (Randwertproblem), ist die Diagnose selbst umstritten. Mehr Beschäftigung ohne Inflation ist postkeynesianisch auch durch Einkommenspolitik möglich.

Investitionen in Bildung sind dagegen aus mehreren Perspektiven sinnvoll: angebotsseitig über die Produktivität, nachfrageseitig als staatliche Ausgaben.

Fazit: Bei struktureller Arbeitslosigkeit können Reformen und Bildung helfen. Das Wort „einzig“ blendet aber die nachfrageseitige Ursache aus, die bei konjunktureller Arbeitslosigkeit im Vordergrund steht.`},
 {id:"e6-2", pts:12, klausur:"Aufgabenblatt 6, Aufgabe 1",
  q:"Erläutern Sie den wirtschaftspolitischen Standpunkt „5 % Inflation sind besser als 5 % Arbeitslosigkeit“.",
  k:["Zuordnung: Helmut Schmidt, Neoklassische Synthese","Phillips-Kurve: Zielkonflikt zwischen Inflation und Arbeitslosigkeit","Politik kann einen Punkt auf der Kurve wählen, Präferenz für Beschäftigung","Kritik von Monetarismus/Neuklassik: nur kurzfristig, langfristig vertikal","Folge laut Kritik: Stagflation, sich beschleunigende Inflation","Postkeynesianische Sicht: horizontaler Abschnitt, Einkommenspolitik"],
  m:`Der Satz stammt von Helmut Schmidt und spiegelt die Neoklassische Synthese. Grundlage ist die Phillips-Kurve: Je geringer die Arbeitslosigkeit, desto höher die Inflation. Die Politik kann demnach zwischen beiden wählen, und wer Arbeitslosigkeit für schädlicher hält, nimmt mehr Inflation in Kauf.

Monetarismus und Neuklassik bestreiten den dauerhaften Zielkonflikt. Nach Friedman gilt die Phillips-Kurve nur kurzfristig: Steigende Inflation wird erwartet, Arbeitnehmer:innen fordern höhere Nominallöhne, die kurzfristige Kurve verschiebt sich nach oben. Langfristig ist die Phillips-Kurve vertikal bei der natürlichen Arbeitslosigkeit. Wer dauerhaft weniger Arbeitslosigkeit erzwingen will, bekommt eine sich beschleunigende Inflation, und am Ende womöglich beides: Stagflation wie in den 1970ern.

Postkeynesianisch hat die Phillips-Kurve dagegen einen horizontalen Abschnitt. Mehr Beschäftigung ist dort ohne steigende Inflation möglich, gestützt durch Einkommenspolitik.`}
];
ESSAYS[7]=[
 {id:"e7-1", pts:24,
  q:"„Lohnsteigerungen gefährden Arbeitsplätze. Lohnzurückhaltung ist daher die beste Beschäftigungspolitik.“ Diskutieren Sie diese Aussage vor dem Hintergrund der Vorlesungsinhalte. Berücksichtigen Sie unterschiedliche theoretische Perspektiven.",
  k:["Neoklassik: Lohn als Preis am Arbeitsmarkt, zu hohe Löhne verursachen Arbeitslosigkeit","Reallohn ≤ Grenzproduktivität, Mindestlohn-Logik","Neuer Konsens: Lohnsetzungsmacht bestimmt die NAIRU, Lohn-Preis-Spiralen","Keynesianisch: Löhne sind auch Kaufkraft, Arbeitslosigkeit durch zu geringe Nachfrage","Kostenparadox / Kaufkrafttheorie: höhere Konsumneigung aus Löhnen","Kaleckianisches Zahlenbeispiel oder Mechanismus: Gewinne können steigen","Mikro-Makro-Unterscheidung: einzelnes Unternehmen vs. Gesamtwirtschaft (externe Effekte)","Wachstumsmodelle: Lohnzurückhaltung in Deutschland → export-led, Leistungsbilanzüberschüsse","Grenzen: Nicht alle Länder können Exportüberschüsse erzielen","Postkeynesianisch: Einkommenspolitik statt Lohnsenkung, Verteilung als Krisenfaktor","Begründetes Fazit"],
  m:`Die Aussage folgt einer neoklassischen Logik. Der Reallohn ist der Preis, der Arbeitsangebot und -nachfrage ausgleicht. Ein Unternehmen beschäftigt nur, solange der Reallohn die Produktivität nicht übersteigt. Zu hohe Löhne verursachen Arbeitslosigkeit, Lohnzurückhaltung senkt sie. Im Neuen Konsens bestimmt die Lohnsetzungsmacht die NAIRU: Schwächere Lohnforderungen erlauben mehr Beschäftigung ohne Lohn-Preis-Spirale.

Keynesianisch sind Löhne aber nicht nur Kosten, sondern auch Kaufkraft. Arbeitslosigkeit entsteht durch zu geringe Güternachfrage. Haben Lohnbezieher:innen eine höhere Konsumneigung als Gewinnbezieher:innen, senkt Lohnzurückhaltung die Nachfrage. Nach dem Kostenparadox kann umgekehrt eine Lohnerhöhung Nachfrage, Beschäftigung und sogar die gesamtwirtschaftlichen Gewinne erhöhen: Im Beispiel von Aufgabenblatt 7 steigt Y* von 1428,57 auf 2000, die Gewinne von 571,43 auf 600. Was für ein einzelnes Unternehmen rational ist, gilt gesamtwirtschaftlich nicht.

Lohnzurückhaltung kann über die Exporte trotzdem Beschäftigung schaffen, wie das exportgetriebene Wachstumsmodell Deutschlands zeigt. Das verlagert die Nachfrageschwäche aber ins Ausland, das sich verschulden muss. Nicht alle Länder können gleichzeitig so verfahren.

Der Postkeynesianismus sieht hohe Ungleichheit als Krisenursache und setzt auf Einkommenspolitik: Die Sozialpartner vermeiden Lohn-Preis-Spiralen, ohne die Lohnquote zu drücken.

Fazit: Ob Lohnzurückhaltung Beschäftigung schafft, hängt davon ab, ob Arbeitslosigkeit angebots- oder nachfragebedingt ist und ob das Land auf Exporte ausweichen kann. „Die beste Beschäftigungspolitik“ ist sie aus Sicht der Vorlesung nicht allgemein.`},
 {id:"e7-2", pts:12, klausur:"Aufgabenblatt 7, Aufgabe 2b",
  q:"Vergleichen Sie die Phillips-Kurve aus postkeynesianischer Perspektive mit dem neukeynesianischen Modell. Welche Unterschiede gibt es, und welche Folgen haben sie für die wirtschaftspolitischen Empfehlungen?",
  k:["Neukeynesianisch: steigende kurzfristige, vertikale langfristige Phillips-Kurve, eindeutige NAIRU","Neukeynesianische Empfehlung: Inflation Targeting, Angebotsreformen für mehr Beschäftigung","Postkeynesianisch: Lohnsetzung und Phillips-Kurve mit horizontalem Abschnitt","Keine eindeutige NAIRU, Hysterese verschiebt das Gleichgewicht","Postkeynesianische Empfehlung: Nachfragepolitik, Einkommenspolitik","Konsequenz: mehr Beschäftigung ohne Inflation ohne Deregulierung möglich"],
  m:`Im neukeynesianischen Modell steigt die kurzfristige Phillips-Kurve, die langfristige ist vertikal bei der NAIRU. Höhere Beschäftigung als die NAIRU führt zu Lohn-Preis-Spiralen. Die Zentralbank steuert die Nachfrage über Inflation Targeting zum Potenzial. Dauerhaft mehr Beschäftigung ist nur durch Angebotsreformen möglich, die die Lohnsetzungskurve nach rechts verschieben.

Postkeynesianisch hat die Lohnsetzungskurve einen horizontalen Abschnitt, entsprechend auch die kurzfristige Phillips-Kurve. In diesem Bereich steigt die Beschäftigung ohne steigende Inflation, eine eindeutige NAIRU gibt es nicht. Wegen Hysterese hängt das Gleichgewicht zudem von der Nachfrage der Vergangenheit ab.

Daraus folgen andere Empfehlungen: Nachfragepolitik kann dauerhaft Beschäftigung schaffen. Lohn-Preis-Spiralen werden durch Einkommenspolitik vermieden, bei der die Sozialpartner unter Vermittlung der Regierung auf überzogene Lohn- und Preissteigerungen verzichten, statt durch Deregulierung.`}
];
ESSAYS[8]=[
 {id:"e8-1", pts:24,
  q:"„Deutschlands Exportüberschüsse sind Ausdruck seiner Wettbewerbsfähigkeit und daher kein Problem.“ Diskutieren Sie diese Aussage vor dem Hintergrund der Vorlesungsinhalte. Berücksichtigen Sie unterschiedliche theoretische Perspektiven.",
  k:["VGR: Leistungsbilanzüberschuss = private Überschüsse + Staatssaldo; Ausland verschuldet sich","Leistungsbilanz der Welt ist null, nicht alle können Überschüsse haben","Neoklassisch: Überschüsse als Gleichgewicht der Präferenzen (Demografie, rentablere Anlagen im Ausland, Hüther)","Wettbewerbsfähigkeit, Freihandel und komparative Vorteile","Keynesianisch: Überschüsse als Zeichen schwacher Binnennachfrage","Risiken: Überschuldung und Krise der Handelspartner, Verlust von Auslandsvermögen (Eurokrise)","Keynes' Sozialphilosophie: Sanktionierung von Exportüberschüssen","Wachstumsmodell export-led: Lohnzurückhaltung, Unternehmens- und Staatsersparnis","Spielarten des Kapitalismus: CME, Exportorientierung, konservative Makropolitik","Verteilung: sinkender Anteil der Haushaltseinkommen","Kaleckis Gewinngleichung: Gewinne über Nettoexporte statt Investitionen","Begründetes Fazit"],
  m:`Nach der VGR entspricht ein Leistungsbilanzüberschuss der Summe aus privatem und staatlichem Finanzierungssaldo. In Deutschland haben Haushalte, Unternehmen und seit etwa 2010 auch der Staat Überschüsse, also muss sich das Ausland verschulden. Weil die Leistungsbilanz der Welt null ist, können nicht alle Länder Überschüsse haben.

Aus neoklassischer Sicht sind Überschüsse ein mögliches Gleichgewicht. Sie spiegeln Präferenzen: Eine alternde Gesellschaft baut Auslandsvermögen für später auf, Kapital fließt dorthin, wo die Renditen höher sind. So argumentiert Michael Hüther, Deutschland schaffe mit seiner Ersparnis Investitionsmöglichkeiten im Ausland. Freihandel und Wettbewerbsfähigkeit steigern die Wohlfahrt.

Keynesianisch sind hohe Überschüsse dagegen ein Zeichen schwacher Binnennachfrage. Das Land hält seine Arbeitslosigkeit niedrig, weil andere seine Waren kreditfinanziert kaufen. Das ist riskant: Geraten die Schuldner in die Krise, brechen Exporte ein und Auslandsvermögen wird entwertet, wie die Eurokrise zeigt. Keynes wollte Exportüberschüsse international sanktionieren.

Der Vergleichenden Politischen Ökonomie zufolge passt der Überschuss zum deutschen Modell einer koordinierten Marktwirtschaft mit exportorientierter Industrie und konservativer Makropolitik. Postkeynesianisch ist er Teil eines exportgetriebenen Wachstumsmodells: Lohnzurückhaltung, sinkender Anteil der Haushaltseinkommen, Unternehmens- und Staatsersparnis. Nach Kaleckis Gewinngleichung entstehen Gewinne dann über Nettoexporte statt über Investitionen.

Fazit: Wettbewerbsfähigkeit ist ein Teil der Erklärung. Dass die Überschüsse kein Problem seien, lässt sich aus Kreislaufsicht aber nicht halten, denn sie setzen die Verschuldung anderer voraus und beruhen auch auf schwacher Binnennachfrage.`},
 {id:"e8-2", pts:12,
  q:"Welche makroökonomische Politik ist in einer koordinierten, welche in einer liberalen Marktwirtschaft zu erwarten? Begründen Sie.",
  k:["CME: regelbasierte, konservative Geld- und Fiskalpolitik","Begründung CME: Exportorientierung, preisliche Wettbewerbsfähigkeit, Inflationsvermeidung","Starker Sozialstaat sichert spezifische Qualifikationen ab","LME: diskretionäre, keynesianische, offensive Politik","Begründung LME: schwache soziale Sicherung, Arbeitslosigkeit muss vermieden werden","Empirie: stärkere Schwankungen von Arbeitslosigkeit, Defizit und Zinsen in den USA"],
  m:`In koordinierten Marktwirtschaften wie Deutschland ist eine regelbasierte, eher neoklassisch geprägte Geld- und Fiskalpolitik zu erwarten. Die Industrie ist auf inkrementelle Innovation und Export spezialisiert; preisliche Wettbewerbsfähigkeit ist wichtig, deshalb sollen Inflation und Kostensteigerungen vermieden werden. Ein starker Sozialstaat sichert Beschäftigte mit betriebsspezifischen Qualifikationen ab und federt Abschwünge ab.

In liberalen Marktwirtschaften wie den USA ist die Politik diskretionär und offensiver keynesianisch. Weil die soziale Sicherung schwach ist, muss längere Arbeitslosigkeit über expansive Geld- und Fiskalpolitik vermieden werden. Externe Wettbewerbsfähigkeit ist wegen des hohen Anteils nicht handelbarer Dienstleistungen weniger wichtig.

Empirisch schwanken in den USA Arbeitslosenquote, staatlicher Finanzierungssaldo und Leitzinsen deutlich stärker als in Deutschland.`}
];

const isFormula=f=>!!f&&!/[a-zäöüß]{4,}/.test(f.split(" = ").slice(1).join(" = "));
const symMain=s=>s.replace(/ \(in .*\)$/,""), symIn=s=>(s.match(/ \(in (.*)\)$/)||[])[1]||"";

function symBack(x){
  return [isFormula(x.formel)?`$ ${x.formel}`:"", `Bedeutung: ${x.bed}`, `Wofür: ${x.wof}`, `Beispiel: ${x.bsp}`, `Kommt vor: ${x.wo}`, x.falle?`Achtung: ${x.falle}`:""].filter(Boolean).join("\n");
}
function symBackRev(x){ return [`$ ${x.formel?x.formel:x.s}`, x.formel&&!x.formel.startsWith(x.s+" ")?`Zeichen: ${x.s}`:"", `Beispiel: ${x.bsp}`, x.falle?`Achtung: ${x.falle}`:""].filter(Boolean).join("\n"); }

CARDS.symr=SYMBOLS.map(x=>({id:"r-"+x.id, f:x.n, b:symBackRev(x)}));

/* Zeichenfläche für den Stift, wiederverwendbar */
function drawSurface(c,strokes){
  const ctx=c.getContext("2d"); let penSeen=false, cur=null;
  const color=()=>getComputedStyle(document.documentElement).getPropertyValue("--gold").trim()||"#A87B1F";
  function size(){ const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1; c.width=r.width*dpr; c.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); draw(); }
  function draw(){ const r=c.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle=color();
    for(const s of strokes){ for(let i=1;i<s.length;i++){ ctx.lineWidth=s[i][2]; ctx.beginPath(); ctx.moveTo(s[i-1][0]*r.width,s[i-1][1]*r.height); ctx.lineTo(s[i][0]*r.width,s[i][1]*r.height); ctx.stroke(); } } }
  const pt=e=>{ const r=c.getBoundingClientRect(); const p=e.pressure&&e.pointerType==="pen"?e.pressure:.5; return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,1.2+p*2.6]; };
  c.onpointerdown=e=>{ if(e.pointerType==="pen") penSeen=true; if(penSeen&&e.pointerType==="touch") return; cur=[pt(e)]; strokes.push(cur); try{c.setPointerCapture(e.pointerId);}catch(x){} };
  c.onpointermove=e=>{ if(!cur) return; const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; for(const ev of evs) cur.push(pt(ev)); draw(); };
  c.onpointerup=c.onpointercancel=()=>{ cur=null; };
  size(); window.addEventListener("resize",size);
  return {undo(){ strokes.pop(); draw(); }, clear(){ strokes.length=0; draw(); }};
}

/* ================= Fortschritt ================= */
function lessonState(id){ return (state.lessons||{})[id]; }
function cardBox(id){ return (state.box||{})[id]||0; }
function chapterProgress(n){
  const L=LESSONS[n]||[], K=CARDS[n]||[], C=CALC[n]||[], G=GRAPHS[n]||[], E=ESSAYS[n]||[];
  if(!L.length) return null;
  const l=L.filter(x=>lessonState(x.id)).length/L.length;
  const k=K.length? K.filter(x=>cardBox(x.id)>=3).length/K.length : 1;
  const c=C.length? C.filter(t=>lvlOf(t)===3 && (acc(t)||0)>=.6).length/C.length : 1;
  const g=G.length? G.filter(x=>(state.graphs||{})[x.id]).length/G.length : 1;
  const e=E.length? E.filter(x=>(state.essays||{})[x.id]).length/E.length : 1;
  const parts=[[l,.3,1],[k,.25,K.length],[c,.25,C.length],[g,.1,G.length],[e,.1,E.length]].filter(p=>p[2]);
  const wsum=parts.reduce((s,p)=>s+p[1],0);
  return {l,k,c,g,e,total:Math.round(parts.reduce((s,p)=>s+p[0]*p[1],0)/wsum*100)};
}
function acc(t){ const h=state.hist[t]; return h&&h.n? h.r/h.n : null; }
/* Was ist als Nächstes dran? Theorie zuerst, dann abfragen, rechnen, zeichnen, schreiben */
function nextStep(){
  for(const ch of CHAPTERS){ const n=ch.n; if(!LESSONS[n]) continue;
    const L=LESSONS[n], li=L.findIndex(x=>!lessonState(x.id));
    if(li>=0) return {label:`Kapitel ${n} · Theorie`, title:L[li].t, go:()=>openLesson(n,li)};
    if((CARDS[n]||[]).some(x=>!isSeen(x.id))) return {label:`Kapitel ${n} · Karten`, title:"Begriffe und Kurzfragen festigen", go:()=>openCards(n)};
    const ct=(CALC[n]||[]).find(t=>lvlOf(t)<3);
    if(ct) return {label:`Kapitel ${n} · Rechnen`, title:TYPES[ct].name, go:()=>startTask(ct,false)};
    const g=(GRAPHS[n]||[]).findIndex(x=>!(state.graphs||{})[x.id]);
    if(g>=0) return {label:`Kapitel ${n} · Grafik`, title:GRAPHS[n][g].t, go:()=>openGraph(n,g)};
    const e=(ESSAYS[n]||[]).findIndex(x=>!(state.essays||{})[x.id]);
    if(e>=0) return {label:`Kapitel ${n} · Essay`, title:"Klausuressay schreiben", go:()=>openEssay(n,e)};
  }
  return {label:"Wiederholen", title:"Gemischt üben hält alles frisch", go:()=>openCards(0)};
}

  const why=c.w&&c.w[a];
  return `<div class="fb bad"><p class="fh">Nicht ganz.</p><div class="dlist">${why?`<b>Warum nicht</b><span>${inl(why)}</span>`:""}${right}<b>${why?"Der Unterschied":"Warum"}</b><span>${inl(c.ex)}</span></div></div>`;

/* ================= Karten (Karteikasten, Fächer 0–5) ================= */
const deckLabel=n=>DECK_NAME[n]?"Symbole":n?"Kapitel "+n:"Üben";
const deckBack=n=>DECK_NAME[n]?go("sym"):n?go("chapter"):go("practice");
function allCards(n){ return n? (CARDS[n]||[]) : Object.values(CARDS).flat(); }
/* Wiederholung mit Fälligkeitsdatum (wie Anki): sicherer gewusst = längerer Abstand */
const INTERVAL=[0,0,1,3,7,16];   // Tage bis zur nächsten Abfrage je Fach; Fach 5 erneut gewusst: 35 Tage
const dayStart=(t=Date.now())=>{ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const isSeen=id=>!!(state.box||{})[id];
const isDue=id=>isSeen(id) && ((state.due||{})[id]||0)<=Date.now();
function dueCards(n){ return allCards(n).filter(x=>isDue(x.id)).sort((a,b)=>((state.due||{})[a.id]||0)-((state.due||{})[b.id]||0)); }
function openCards(n,free,deck){ cur.cardCh=n; cur.free=!!free; cur.deck=deck?deck.slice():(free?buildDeck(n):buildDueDeck(n)); cur.ci=0; cur.flip=false; cur.right=0; cur.unsure=0; cur.typed=""; cur.tyOpen=false; cur.hist=[]; cur.requeued={}; go("cards"); }
function buildDueDeck(n){
  const due=dueCards(n), fresh=n? allCards(n).filter(x=>!isSeen(x.id)) : [];
  return due.concat(fresh).slice(0,Math.max(10,Math.min(due.length,30)));
}
function buildDeck(n){
  const pool=allCards(n).slice(), deck=[];
  while(deck.length<Math.min(10,pool.length)){
    const w=pool.map(x=>[6,5,4,3,2,1][cardBox(x.id)]); let r=Math.random()*w.reduce((a,b)=>a+b,0), i=0;
    for(;i<pool.length;i++){ r-=w[i]; if(r<=0) break; } deck.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  return deck;
}
function renderCards(){
  const D=cur.deck, n=cur.cardCh;
  if(cur.ci>=D.length){
    const left=dueCards(n).length+(n?allCards(n).filter(x=>!isSeen(x.id)).length:0);
    const nextDue=allCards(n).filter(x=>isSeen(x.id)&&!isDue(x.id)).map(x=>(state.due||{})[x.id]).sort((a,b)=>a-b)[0];
    const when=nextDue? Math.round((dayStart(nextDue)-dayStart())/864e5) : null;
    $("#app").innerHTML=`${backTo(deckLabel(n))}<h1>${D.length?(left?"Runde geschafft":"Für heute erledigt"):"Nichts fällig"}</h1>
      <div class="block">${D.length?`<p>${cur.right} sicher, ${cur.unsure||0} nicht sicher.</p>`:""}
      <p class="small muted">${left?`Noch ${left} Karten fällig oder neu.`:`Alle Karten${n?" dieses Kapitels":""} sind auf dem Stand. ${when!=null?`Die nächsten werden ${when<=0?"heute":when===1?"morgen":"in "+when+" Tagen"} fällig.`:""}`} Sichere Karten kommen nach 1, 3, 7, 16 und 35 Tagen wieder, nicht sichere gleich in dieser Runde und morgen noch einmal.</p>
      <div class="row">${sess?sessBtn():`${left?`<button class="btn" id="again">Weiter</button>`:""}<button class="btn ghost" id="free">Freiwillig weiterüben</button><button class="btn ghost" id="out">Fertig</button>`}</div></div>`;
    bindCrumb(()=>deckBack(n)); if($("#again")) $("#again").onclick=()=>openCards(n); if($("#free")) $("#free").onclick=()=>openCards(n,true); if($("#out")) $("#out").onclick=()=>deckBack(n); return;
  }
  const c=D[cur.ci], b=cardBox(c.id);
  const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  $("#app").innerHTML=`${backTo(deckLabel(n))}
    <div class="row between"><p class="eyebrow" style="margin:0">Karte ${cur.ci+1} von ${D.length}${cur.free?" · freiwillig":isSeen(c.id)?" · fällig":" · neu"}</p><span class="dots" aria-label="Fach ${b} von 5">${[1,2,3,4,5].map(i=>`<i class="${i<=b?"on":""}"></i>`).join("")}</span></div>
    <div class="swipewrap">
    <div class="block card${cur.enter?" enter":""}" id="theCard" style="margin-top:8px" role="button" tabindex="0" aria-label="Karte umdrehen"><i class="tint" aria-hidden="true"></i><p class="cctx">${inl(CARD_CTX[c.id]||chapterOfCard(c.id))}</p>${n==="sym"?`<div class="front symf">${fx(symMain(c.f))}${symIn(c.f)?`<span class="symin">in ${fx(symIn(c.f))}</span>`:""}</div>`:`<div class="front">${inl(c.f)}</div>`}${cur.flip?`${cur.typed.trim()?`<div class="typed"><span class="small muted">Deine Antwort</span><p>${esc(cur.typed)}</p></div>`:""}<div class="back">${richText(c.b)}</div>${cardInfoHTML(c.id)}`:`<p class="tap">Tippen zum Umdrehen</p>`}</div></div>
    ${cur.flip?`<div class="grade"><button class="btn ghost" id="mid">← Nicht sicher</button><button class="btn" id="yes">Sicher →</button></div>`
      :`${cur.tyOpen||cur.typed?`<textarea id="cty" class="cty" rows="1" placeholder="Deine Antwort …" aria-label="Antwort tippen">${esc(cur.typed)}</textarea>`:""}
      <div class="row"><button class="btn" id="flip" style="flex:1">Antwort zeigen</button>${cur.tyOpen||cur.typed?"":`<button class="tylink" id="tyO">Tippen</button>`}</div><p class="hint">Erst antworten, dann aufdecken.</p>`}
    ${cur.hist.length?`<button class="btn ghost small" id="cprev" style="margin-top:6px">← Vorherige Karte</button>`:""}`;
  bindCrumb(()=>deckBack(n));
  if($("#tyO")) $("#tyO").onclick=()=>{ cur.tyOpen=true; renderCards(); $("#cty").focus(); };
  const ta=$("#cty"); if(ta){ const fit=()=>{ ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; }; fit(); ta.oninput=()=>{ cur.typed=ta.value; fit(); }; }
  if($("#flip")) $("#flip").onclick=()=>{ cur.flip=true; renderCards(); };
  const cd=$("#theCard"); let moved=false;
  cd.onclick=e=>{ if(e.target.closest("a")||moved) return; cur.flip=!cur.flip; renderCards(); };
  cd.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); cd.click(); } else if(cur.flip&&e.key==="ArrowRight") grade(2); else if(cur.flip&&e.key==="ArrowLeft") grade(1); };
  /* Wischen wie bei Dating-Apps, erst nach dem Aufdecken: rechts sicher, links nicht sicher.
     Die Karte folgt dem Finger, eine leichte Tönung zeigt die Richtung an. */
  if(cur.flip){ const tint=cd.querySelector(".tint"); let x0=null, y0=0, dx=0, raf=0, w=360, dir=0;
    /* Pro Bild nur transform und opacity ändern: beides läuft auf dem Grafikchip, nichts wird neu gezeichnet */
    const paint=()=>{ raf=0; const k=Math.min(1,Math.abs(dx)/(w*.35)), d=dx>0?1:-1;
      if(d!==dir){ dir=d; tint.className="tint "+(d>0?"ok":"no"); }
      cd.style.transform=`translate3d(${dx}px,0,0) rotate(${dx/45}deg)`; tint.style.opacity=k; };
    cd.onpointerdown=e=>{ if(e.target.closest("a")) return; x0=e.clientX; y0=e.clientY; dx=0; moved=false; w=cd.offsetWidth||360; };
    cd.onpointermove=e=>{ if(x0===null) return; const d=e.clientX-x0;
      if(!moved){ if(Math.abs(d)>6&&Math.abs(d)>Math.abs(e.clientY-y0)){ moved=true; x0+=d>0?6:-6; try{cd.setPointerCapture(e.pointerId);}catch(x){} cd.style.transition="none"; tint.style.transition="none"; } else return; }
      e.preventDefault(); dx=e.clientX-x0; if(!raf) raf=requestAnimationFrame(paint); };
    cd.onpointerup=cd.onpointercancel=()=>{ if(x0===null) return; x0=null; if(!moved) return; if(raf){ cancelAnimationFrame(raf); raf=0; }
      const lim=Math.min(100,w*.25);
      if(Math.abs(dx)>lim){ const out=(dx>0?1:-1)*(window.innerWidth+100);
        cd.style.transition="transform .3s cubic-bezier(.2,.7,.3,1), opacity .3s ease-out"; cd.style.transform=`translate3d(${out}px,0,0) rotate(${dx>0?12:-12}deg)`; cd.style.opacity="0";
        setTimeout(()=>{ cur.enter=true; grade(dx>0?2:1); },220); }
      else { cd.style.transition="transform .35s cubic-bezier(.3,1.4,.5,1)"; tint.style.transition="opacity .25s"; cd.style.transform=""; tint.style.opacity="0"; setTimeout(()=>{ moved=false; },0); } };
  }
  /* Bewertung: 2 sicher (nächstes Fach), 1 nicht sicher (ein Fach zurück, morgen wieder, in dieser Runde noch einmal) */
  function grade(lv){ state.box=state.box||{}; state.due=state.due||{}; state.lapses=state.lapses||{};
    const b0=cardBox(c.id), old=state.due[c.id]||0;
    cur.hist.push({ci:cur.ci, id:c.id, box:state.box[c.id], due:state.due[c.id], lapse:state.lapses[c.id], right:cur.right, unsure:cur.unsure, len:D.length, rq:Object.assign({},cur.requeued), typed:cur.typed});
    const b1= lv===2? Math.min(5,Math.max(b0,1)+1) : Math.max(1,b0-1);
    const nd= lv===2? dayStart()+(b0===5?35:INTERVAL[b1])*864e5 : dayStart()+864e5;
    if(!cur.free){ state.box[c.id]=b1; state.due[c.id]=nd; }
    else if(lv<2){ state.box[c.id]=Math.min(b0||1,b1); state.due[c.id]=Math.min(old||nd,nd); }
    if(lv===2) cur.right++;
    else { cur.unsure=(cur.unsure||0)+1; state.lapses[c.id]=(state.lapses[c.id]||0)+1; if(!cur.requeued[c.id]){ cur.requeued[c.id]=1; D.push(c); } }
    logDay(); save(); cur.ci++; cur.flip=false; cur.typed=""; renderCards(); window.scrollTo(0,0); }
  if($("#yes")) $("#yes").onclick=()=>{ cur.enter=true; grade(2); };
  if($("#mid")) $("#mid").onclick=()=>{ cur.enter=true; grade(1); };
  /* Eine Karte zurück: letzte Bewertung rückgängig machen */
  if($("#cprev")) $("#cprev").onclick=()=>{ const h=cur.hist.pop(); if(!h) return;
    const put=(o,k,v)=>{ if(v===undefined) delete o[k]; else o[k]=v; };
    put(state.box,h.id,h.box); put(state.due,h.id,h.due); put(state.lapses,h.id,h.lapse);
    cur.right=h.right; cur.unsure=h.unsure; D.length=h.len; cur.requeued=h.rq; cur.ci=h.ci; cur.flip=true; cur.typed=h.typed; save(); renderCards(); };
}

/* ================= Grafiken ================= */
let gStrokes={};
function openGraph(n,i){ cur.ch=n; cur.gi=i; cur.gshow=false; cur.gchecks={}; cur.gprev=(state.graphs||{})[GRAPHS[n][i].id]; go("graph"); }
function renderGraph(){
  const n=cur.ch, G=GRAPHS[n], g=G[cur.gi], st=cur.gprev;
  gStrokes[g.id]=gStrokes[g.id]||[];
  $("#app").innerHTML=`${backTo("Kapitel "+n)}
    <p class="eyebrow">Kapitel ${n} · Grafik ${cur.gi+1} von ${G.length}${g.klausur?" · "+g.klausur:""}</p>
    <h1>${g.t}</h1>
    <div class="block"><p style="margin:0"><b>${g.task}</b></p></div>
    <div class="gbox" id="gbox">
      <svg viewBox="0 0 400 300" aria-hidden="true">${GFX[g.id].base()}</svg>
      <canvas id="gc" aria-label="Zeichenfläche"></canvas>
      <svg class="solsvg" viewBox="0 0 400 300" ${cur.gshow?"":"hidden"}>${GFX[g.id].sol()}</svg>
    </div>
    <div class="row" style="margin:10px 0 14px"><button class="btn ghost small" id="gu">Zurück</button><button class="btn ghost small" id="gx">Leeren</button>
      <button class="btn small" id="gs" style="margin-left:auto">${cur.gshow?"Musterlösung ausblenden":"Musterlösung darüberlegen"}</button></div>
    ${cur.gshow?`<div class="block"><h3>Hast du das drin?</h3>${g.check.map((c,j)=>`<label class="check"><input type="checkbox" id="k${j}" ${cur.gchecks[j]?"checked":""}><span>${c}</span></label>`).join("")}
      <div class="row" style="margin-top:8px"><button class="btn" id="gsave">Ergebnis speichern</button>${st?`<span class="small muted">Zuletzt: ${st.p} von ${st.max}</span>`:""}</div></div>`
      :`<p class="hint">Mit dem Stift einzeichnen, die Lösung erscheint in Blau.</p>`}
    <div class="lnav">${cur.gi>0?`<button class="btn ghost" id="gp">← Vorherige</button>`:"<span></span>"}${cur.gi<G.length-1?`<button class="btn ghost" id="gn">Nächste →</button>`:""}</div>`;
  bindCrumb(()=>go("chapter"));
  const s=drawSurface($("#gc"),gStrokes[g.id]);
  $("#gu").onclick=()=>s.undo(); $("#gx").onclick=()=>s.clear();
  $("#gs").onclick=()=>{ cur.gshow=!cur.gshow; renderGraph(); };
  document.querySelectorAll(".check input").forEach(c=>c.onchange=()=>{ cur.gchecks[+c.id.slice(1)]=c.checked; });
  if($("#gsave")) $("#gsave").onclick=()=>{ const p=g.check.filter((_,j)=>cur.gchecks[j]).length; state.graphs=state.graphs||{}; state.graphs[g.id]={p,max:g.check.length,t:Date.now()}; logDay(); save(); toast(`Gespeichert: ${p} von ${g.check.length}`); renderGraph(); };

  if($("#gn")) $("#gn").onclick=()=>openGraph(n,cur.gi+1);
}

/* ================= Essay ================= */
function openEssay(n,i){ cur.ch=n; cur.ei=i; cur.eph="schreiben"; cur.echecks={}; cur.eprev=(state.essays||{})[ESSAYS[n][i].id]; go("essay"); }
function renderEssay(){
  const n=cur.ch, E=ESSAYS[n], e=E[cur.ei], st=cur.eprev;
  state.drafts=state.drafts||{}; const txt=state.drafts[e.id]||"";
  const per=Math.round(e.pts/e.k.length*10)/10;
  const pts=()=>Math.round(e.k.filter((_,j)=>cur.echecks[j]).length*per);
  $("#app").innerHTML=`${backTo("Kapitel "+n)}
    <p class="eyebrow">Kapitel ${n} · Essay ${cur.ei+1} von ${E.length} · ${e.pts} Punkte${e.klausur?" · "+e.klausur:""}</p>
    <div class="block"><p style="margin:0"><b>${e.q}</b></p><p class="small muted" style="margin:8px 0 0">In der Klausur hast du dafür etwa 20 bis 25 Minuten. Gliedere: These klären, Perspektiven darstellen, abwägen, Fazit.</p></div>
    <div class="essay">${cur.eph==="schreiben"?`
      <label class="small muted" for="et">Deine Antwort (Tastatur oder Stift mit Handschrift-Eingabe)</label>
      <textarea id="et" style="margin-top:6px">${esc(txt)}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn" id="eDone">Fertig, Erwartungshorizont zeigen</button>${st?`<span class="small muted">Zuletzt: ${st.p} von ${e.pts} P.</span>`:""}</div>`:`
      <div class="block"><h3>Erwartungshorizont</h3><p class="small muted">Hake ab, was in deinem Text klar vorkommt. Jeder Punkt zählt etwa ${String(per).replace(".",",")} P.</p>
        ${e.k.map((k,j)=>`<label class="check"><input type="checkbox" id="q${j}" ${cur.echecks[j]?"checked":""}><span>${k}</span></label>`).join("")}
        <p class="pts" id="ep">${pts()} von ${e.pts} Punkten</p>${st?`<p class="small muted" style="margin-top:-6px">Zuletzt: ${st.p} von ${st.max} P.</p>`:""}
        <div class="row"><button class="btn" id="eSave">Ergebnis speichern</button><button class="btn ghost" id="eCl">Für Claude kopieren</button><button class="btn ghost" id="eEdit">Text überarbeiten</button></div>
        <div id="eCopy"></div></div>
      <div class="block"><h3>Deine Antwort</h3><p style="white-space:pre-wrap">${esc(txt)||'<span class="muted">Kein Text geschrieben.</span>'}</p></div>
      <div class="block lesson"><h3>Musterlösung</h3>${e.m.split("\n\n").map(p=>`<p>${p}</p>`).join("")}</div>`}
    </div>
    <div class="lnav">${cur.ei>0?`<button class="btn ghost" id="ep2">← Vorheriger</button>`:"<span></span>"}${cur.ei<E.length-1?`<button class="btn ghost" id="en">Nächster →</button>`:""}</div>`;
  bindCrumb(()=>go("chapter"));
  const ta=$("#et"); if(ta){ let tm=null; ta.oninput=()=>{ state.drafts[e.id]=ta.value; clearTimeout(tm); tm=setTimeout(()=>save(),800); }; }
  if($("#eDone")) $("#eDone").onclick=()=>{ if(ta) state.drafts[e.id]=ta.value; save(); cur.eph="bewerten"; renderEssay(); window.scrollTo(0,0); };
  document.querySelectorAll(".check input").forEach(c=>c.onchange=()=>{ cur.echecks[+c.id.slice(1)]=c.checked; $("#ep").textContent=`${pts()} von ${e.pts} Punkten`; });
  if($("#eSave")) $("#eSave").onclick=()=>{ state.essays=state.essays||{}; state.essays[e.id]={p:pts(),max:e.pts,t:Date.now()}; logDay(); save(); toast(`Gespeichert: ${pts()} von ${e.pts} Punkten`); };
  if($("#eEdit")) $("#eEdit").onclick=()=>{ cur.eph="schreiben"; renderEssay(); };
  if($("#eCl")) $("#eCl").onclick=async()=>{
    const prompt=`Bewerte bitte meinen Übungsessay für die Klausur „Einführung in die Makroökonomik“ (UDE, Lehramt). Beziehe dich auf die Vorlesungsinhalte (Folien van Treeck).\n\nAufgabe (${e.pts} Punkte):\n${e.q}\n\nErwartungshorizont:\n${e.k.map(k=>"- "+k).join("\n")}\n\nMein Essay:\n${txt}\n\nGib mir: Punktzahl mit Begründung je Kriterium, was fehlt oder ungenau ist, und zwei konkrete Formulierungen, mit denen ich den Text verbessern kann.`;
    try{ await navigator.clipboard.writeText(prompt); toast("Kopiert. In den Claude-Chat einfügen."); }
    catch(x){ $("#eCopy").innerHTML=`<textarea style="width:100%;min-height:8rem;margin-top:8px" readonly>${esc(prompt)}</textarea>`; const t=$("#eCopy textarea"); t.focus(); t.select(); toast("Text markiert, jetzt kopieren"); }
  };
  if($("#ep2")) $("#ep2").onclick=()=>openEssay(n,cur.ei-1);
  if($("#en")) $("#en").onclick=()=>openEssay(n,cur.ei+1);
}

function calcTypes(n){ return n? (CALC[n]||[]) : [...new Set(Object.values(CALC).flat())]; }
function recommend(){
  const T=calcTypes(0), started=T.filter(t=>state.hist[t]&&state.hist[t].n);
  const fresh=T.find(t=>!started.includes(t)), weak=started.filter(t=>acc(t)<.7).sort((a,b)=>acc(a)-acc(b))[0];
  return weak||fresh||T[Math.floor(Math.random()*T.length)];
}
function renderCalc(){
  const n=cur.calcCh||0, T=calcTypes(n);
  $("#app").innerHTML=`${backTo(n?"Kapitel "+n:"Üben")}

/* ================= Verständnisfragen: erst selbst abrufen, dann Auswahl; Wiederholung mit Abstand =================
   Jede Frage aus den Lektionen bekommt ein eigenes Fach wie eine Karteikarte (state.qbox).
   Ältere Antworten (vor dieser Funktion) werden aus state.lessons abgeleitet, ohne etwas zu speichern. */
const qid=(lid,j)=>lid+"#"+j;
function allQuestions(){ const out=[]; for(const ch of CHAPTERS) for(const L of (LESSONS[ch.n]||[])) L.check.forEach((c,j)=>out.push({id:qid(L.id,j), lid:L.id, n:ch.n, c, lt:L.t, li:(LESSONS[ch.n]||[]).indexOf(L)})); return out; }
function qInfo(id){
  const s=(state.qbox||{})[id]; if(s) return s;
  const ls=(state.lessons||{})[id.split("#")[0]]; if(!ls) return null;
  return ls.ok? {b:2, due:dayStart(ls.t)+3*864e5} : {b:1, due:dayStart(ls.t)+864e5};
}
function qDue(){ const now=Date.now(); return allQuestions().filter(q=>{ const s=qInfo(q.id); return s&&s.due<=now; }).sort((a,b)=>qInfo(a.id).due-qInfo(b.id).due); }
function qGrade(id,ok){
  state.qbox=state.qbox||{}; const s=qInfo(id)||{b:0};
  const b1= ok? Math.min(5,Math.max(s.b,1)+1) : 1;
  state.qbox[id]={b:b1, due:dayStart()+(ok?(s.b===5?35:INTERVAL[b1]):1)*864e5};
  if(!ok){ state.qlapses=state.qlapses||{}; state.qlapses[id]=(state.qlapses[id]||0)+1; }
  save();
}
/* Eine Frage: erst nur die Frage, dann auf Wunsch die Auswahl */
function qBlock(c,key,a,shown,first){
  const opts= a!==undefined || shown;
  return `<div class="qb" style="margin-top:${first?4:18}px"><p style="margin:0"><b>${inl(c.q)}</b></p>
    ${opts?`<div class="mc">${c.o.map((o,k)=>{ const cls=a===undefined?"":(k===c.a?"r":(k===a?"w":""));
        return `<button data-q="${key}" data-k="${k}" class="${cls}" ${a!==undefined?"disabled":""}>${inl(o)}</button>`; }).join("")}
        ${a===undefined?`<button data-q="${key}" data-k="-1" class="idk">Weiß ich nicht</button>`:""}</div>`
      :`<p class="hint" style="margin:4px 0 8px">Erst selbst überlegen, dann Auswahl zeigen.</p>
        <div class="row"><button class="btn small" data-show="${key}">Auswahl zeigen</button><button class="btn ghost small" data-q="${key}" data-k="-1">Weiß ich nicht</button></div>`}
    ${a!==undefined?feedback(c,a):""}</div>`;
}
/* Übungsmodus: fällige Verständnisfragen aus allen Lektionen */
function openRecall(list){ const L=list||qDue().slice(0,8); cur.rq={list:L, i:0, ans:undefined, shown:false, right:0}; go("recall"); }
function renderRecall(){
  const R=cur.rq, L=R.list;
  if(R.i>=L.length){
    const left=qDue().length;
    $("#app").innerHTML=`${backTo("Üben")}<h1>${L.length?"Runde geschafft":"Nichts fällig"}</h1><div class="block">
      ${L.length?`<p>${R.right} von ${L.length} richtig.</p>`:`<p>Gerade ist keine Verständnisfrage fällig. Neue Fragen kommen mit jeder Lektion dazu.</p>`}
      <p class="small muted">Richtige Fragen kommen nach 1, 3, 7, 16 und 35 Tagen wieder, falsche schon morgen. ${left?`Noch ${left} fällig.`:""}</p>
      <div class="row">${sess?sessBtn():`${left?`<button class="btn" id="rAgain">Weiter</button>`:""}<button class="btn ghost" id="rOut">Fertig</button>`}</div></div>`;
    bindCrumb(()=>go("practice")); if($("#rAgain")) $("#rAgain").onclick=()=>openRecall(); if($("#rOut")) $("#rOut").onclick=()=>go("practice"); return;
  }
  const q=L[R.i], ch=CHAPTERS.find(c=>c.n===q.n);
  $("#app").innerHTML=`${backTo("Üben")}
    <p class="eyebrow">Verständnisfrage ${R.i+1} von ${L.length}</p>
    <div class="block"><p class="small muted" style="margin:0 0 2px">${ch.title} · ${q.lt}</p>${qBlock(q.c,"r",R.ans,R.shown,true)}</div>
    ${R.ans!==undefined?`<div class="row"><button class="btn" id="rNext">Weiter</button><button class="btn ghost" id="rLes">Zur Lektion</button></div>`:""}`;
  bindCrumb(()=>go("practice"));
  document.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{ R.shown=true; renderRecall(); });
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ if(R.ans!==undefined) return; const k=+b.dataset.k; R.ans=k; const ok=k===q.c.a; if(ok) R.right++; logDay(); qGrade(q.id,ok); renderRecall(); });
  if($("#rNext")) $("#rNext").onclick=()=>{ R.i++; R.ans=undefined; R.shown=false; renderRecall(); window.scrollTo(0,0); };
  if($("#rLes")) $("#rLes").onclick=()=>openLesson(q.n,q.li);
}

function whoOptions(x){
  const pool=Object.keys(SCHOOLS).filter(k=>k!==x.s&&!(x.alt||[]).includes(k));
  return shuffle([x.s].concat(shuffle(pool).slice(0,3)));
}
function whoPick(n){
  const st=state.who||{};
  const w=WHO.map(x=>{ const h=st[x.id]; return !h?3 : h.last?1:4; });
  const pool=WHO.slice(), out=[];
  while(out.length<Math.min(n,pool.length)){ let r=Math.random()*w.reduce((a,b)=>a+b,0), i=0; for(;i<pool.length;i++){ r-=w[i]; if(r<=0) break; } i=Math.min(i,pool.length-1); out.push(pool.splice(i,1)[0]); w.splice(i,1); }
  return out;
}
function openWho(n){ cur.wh={list:whoPick(n||8).map(x=>({x,o:whoOptions(x)})), i:0, a:null, right:0}; go("who"); }
function renderWho(){
  const W=cur.wh, L=W.list;
  if(W.i>=L.length){

      <div class="mc">${o.map(k=>{ const cls=W.a===null?"":(k===x.s?"r":(k===W.a?"w":"")); return `<button data-s="${k}" class="${cls}" ${W.a!==null?"disabled":""}>${SCHOOLS[k]}</button>`; }).join("")}</div>

  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ if(W.a!==null) return; W.a=b.dataset.s; const ok=W.a===x.s; if(ok) W.right++;

/* ================= Tägliche Einheit „Heute“ =================
   Mischt, was heute dran ist: fällige Karten, Verständnisfragen, eine Rechenaufgabe,
   abwechselnd „Wer sagt das?“, eine Kurzfrage oder eine Grafik, dazu die nächste neue Lektion.
   Gemischtes Üben (Interleaving) und Abstände (Spacing) ohne eigene Planung. */
let sess=null;
const dayIndex=()=>Math.floor(dayStart()/864e5);
function freshChapter(){ for(const ch of CHAPTERS){ const L=LESSONS[ch.n]||[]; if(L.some(x=>lessonState(x.id)) && (CARDS[ch.n]||[]).some(x=>!isSeen(x.id))) return ch.n; } return 0; }
function graphForToday(){
  const ready=CHAPTERS.filter(ch=>(LESSONS[ch.n]||[]).length&&(LESSONS[ch.n]||[]).every(x=>lessonState(x.id))&&(GRAPHS[ch.n]||[]).length);
  const all=ready.flatMap(ch=>GRAPHS[ch.n].map((g,i)=>({n:ch.n,i,g,t:((state.graphs||{})[g.id]||{}).t||0})));
  return all.sort((a,b)=>a.t-b.t)[0]||null;
}
function planToday(){
  const S=[], dc=dueCards(0).length, dq=qDue().length;
  if(dc) S.push({k:"cards", t:"Karten wiederholen", d:`${Math.min(dc,20)} fällige Karten`, min:Math.max(2,Math.round(Math.min(dc,20)*.4))});
  else { const n=freshChapter(); if(n) S.push({k:"newcards", n, t:"Neue Karten", d:`5 neue Karten: ${CHAPTERS.find(c=>c.n===n).title}`, min:3}); }
  if(dq) S.push({k:"recall", t:"Verständnisfragen", d:`${Math.min(dq,6)} fällige Fragen aus den Lektionen`, min:3});
  S.push({k:"calc", t:"Eine Rechenaufgabe", d:"gemischt, bevorzugt was dir schwerfällt", min:5});
  const rot=["who","kurz","graph"][dayIndex()%3], gr=graphForToday();
  if(rot==="graph"&&gr) S.push({k:"graph", n:gr.n, i:gr.i, t:"Eine Grafik zeichnen", d:gr.g.t, min:4});
  else if(rot==="kurz") S.push({k:"kurz", t:"Eine Kurzfrage schreiben", d:"wie Teil I der Klausur", min:4});
  else S.push({k:"who", t:"Wer sagt das?", d:"5 Aussagen den Denkschulen zuordnen", min:3});
  const nx=nextStep(); if(/Theorie/.test(nx.label)) S.push({k:"lesson", t:"Neu lernen", d:nx.title, min:5, go:nx.go});
  return S;
}
function startSession(){ sess={steps:planToday(), i:0, t0:Date.now()}; runStep(); }
function runStep(){
  if(!sess) return; const s=sess.steps[sess.i]; updateSessBar();
  if(!s){ return finishSession(); }
  ({cards:()=>openCards(0,false,dueCards(0).slice(0,20)),
    newcards:()=>openCards(s.n,false,allCards(s.n).filter(x=>!isSeen(x.id)).slice(0,5)),
    recall:()=>openRecall(qDue().slice(0,6)),
    calc:()=>startTask(recommend(),false),
    who:()=>openWho(5),
    kurz:()=>openKurz(),
    graph:()=>openGraph(s.n,s.i),
    lesson:()=>s.go()})[s.k]();
  window.scrollTo(0,0);
}
function sessNext(){ if(!sess) return; sess.i++; runStep(); }
function endSession(){ sess=null; updateSessBar(); go("home"); }
function finishSession(){
  const min=Math.max(1,Math.round((Date.now()-sess.t0)/60000)); state.sessions=state.sessions||{}; state.sessions[today()]=min; save();
  sess=null; updateSessBar(); view="sessdone"; renderNav();
  $("#app").innerHTML=`<p class="eyebrow">Heute</p><h1>Geschafft</h1><div class="block"><p>Deine Einheit ist fertig, etwa ${min} Minuten.</p>
    <p class="small muted">Morgen stellt die App eine neue Einheit zusammen. Was du heute nicht sicher wusstest, ist dann wieder dabei.</p>
    <div class="row"><button class="btn" id="sdHome">Zum Lernpfad</button></div></div>`;
  $("#sdHome").onclick=()=>go("home"); window.scrollTo(0,0);
}
function updateSessBar(){
  const b=$("#sessbar"); if(!b) return;
  if(!sess||!sess.steps[sess.i]){ b.hidden=true; b.innerHTML=""; return; }
  const s=sess.steps[sess.i];
  b.hidden=false;
  b.innerHTML=`<div class="sbin"><span class="sbt"><b>Heute ${sess.i+1}/${sess.steps.length}</b> · ${s.t}</span><button class="btn small" id="sbNext">${sess.i<sess.steps.length-1?"Nächster Schritt":"Abschließen"}</button><button class="btn ghost small" id="sbEnd" aria-label="Einheit beenden">✕</button></div>`;
  $("#sbNext").onclick=sessNext; $("#sbEnd").onclick=endSession;
}
const sessBtn=()=>`<button class="btn" id="sessGo">${sess&&sess.i<sess.steps.length-1?"Weiter zum nächsten Schritt":"Einheit abschließen"}</button>`;
document.addEventListener("click",e=>{ if(e.target.closest("#sessGo")) sessNext(); });

function todayBlock(){

/* ================= Klausurtermin, Probeklausur-Plan und Schwachstellen ================= */
const fmtDate=t=>{ const d=new Date(t); return ["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()]+" "+d.getDate()+"."+(d.getMonth()+1)+"."; };
const examDateTs=()=>{ const s=state.examDate; if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).getTime(); };
/* Plan: eine Probeklausur früh als Standortbestimmung, dann 21, 14 und 7 Tage vor dem Termin */
function examPlan(){
  const T=examDateTs(), ex=(state.exams||[]).map(e=>e.t).sort((a,b)=>a-b);
  const P=[{lab:"Standortbestimmung", when:null}];
  if(T) [21,14,7].forEach(d=>P.push({lab:`${d} Tage vor der Klausur`, when:T-d*864e5}));
  // jede geschriebene Probeklausur hakt den frühesten offenen Termin ab, dessen Zeitpunkt schon (fast) erreicht ist
  const used=new Set();
  P.forEach(p=>{ const i=ex.findIndex((t,k)=>!used.has(k)&&(p.when==null||t>=p.when-3*864e5)); if(i>=0){ used.add(i); p.done=ex[i]; } });
  return P;
}
function examPlanToday(){
  const P=examPlan(), now=Date.now(), open=P.find(p=>!p.done);
  if(!open) return "";
  if(open.when==null) return "Schreib bald eine als Standortbestimmung (unter Üben).";
  if(open.when-now<=864e5) return `Laut Plan ist jetzt die nächste dran (${open.lab}).`;
  return "";
}
function examPlanBlock(){
  const T=examDateTs(), P=examPlan(), days=T?Math.ceil((T-dayStart())/864e5):null;
  return `<div class="block"><h2>Klausur und Probeklausuren</h2>
    <div class="row" style="margin-bottom:8px"><label class="small" for="exD">Klausurtermin</label><input type="date" id="exD" value="${state.examDate||""}" class="dateinp"><button class="btn ghost small" id="exS">Speichern</button></div>
    ${T?`<p class="small" style="margin:0 0 6px">${days>0?`Noch <b>${days} Tage</b> bis zur Klausur.`:days===0?"<b>Heute ist Klausur.</b> Viel Erfolg!":"Der Termin liegt in der Vergangenheit."}</p>`:`<p class="small muted" style="margin:0 0 6px">Trag den Termin ein, sobald er feststeht. Dann plant die App drei Probeklausuren in den letzten Wochen.</p>`}
    <div class="klist">${P.map(p=>`<b>${p.done?"✓ ":""}${p.lab}</b><span>${p.done?`geschrieben am ${fmtDate(p.done)}`:p.when?fmtDate(p.when):"so bald wie möglich"}</span>`).join("")}</div></div>`;
}
function bindExamPlan(){ if($("#exS")) $("#exS").onclick=()=>{ const v=$("#exD").value; state.examDate=v||null; save(); toast(v?"Termin gespeichert":"Termin entfernt"); render(); }; }

function weakBlock(){
  const lap=Object.entries(state.lapses||{}).filter(([id,n])=>n>=2).sort((a,b)=>b[1]-a[1]);
  const cardsAll=Object.values(CARDS).flat(), byId=Object.fromEntries(cardsAll.map(c=>[c.id,c]));

  const confL=Object.entries(conf).sort((a,b)=>b[1]-a[1]).slice(0,3);

  </div>`;
}

/* ================= Kurzfragen (Teil I) und Probeklausur ================= */
const KURZ=[
 {id:"k01", g:"strom", q:"Benennen Sie a) zwei Stromgrößen und b) eine Bestandsgröße.", k:["Erste Stromgröße korrekt (z. B. BIP, Konsum, Investitionen, Exporte, Löhne, Haushaltsdefizit)","Zweite Stromgröße korrekt","Bestandsgröße korrekt (z. B. Staatsverschuldung, Vermögen der Haushalte, Kapitalstock)"], m:"a) Stromgrößen: Bruttoinlandsprodukt, privater Konsum (auch: Investitionen, Exporte, Löhne, staatliches Haushaltsdefizit)\nb) Bestandsgröße: Staatsverschuldung (auch: Nettovermögen der Haushalte, Wert des Kapitalstocks)\nUnterschied: Ströme werden für einen **Zeitraum** gemessen, Bestände zu einem **Zeitpunkt**."},
 {id:"k02", g:"strom", q:"Erläutern Sie den Unterschied zwischen dem realen und dem nominalen BIP.", k:["Nominales BIP: zu laufenden Preisen","Reales BIP: in Preisen eines Basisjahres (preisbereinigt)","Reales Wachstum ≈ nominales Wachstum − Inflation (mit Beispiel)"], m:"1. Nominales BIP: die Produktion zu **laufenden Preisen**\n2. Reales BIP: in **Preisen eines Basisjahres**, also um Preisänderungen bereinigt\n3. Zusammenhang: reales Wachstum ≈ nominales Wachstum − Inflation. Beispiel: nominal +4 %, Inflation 1 % ⇒ real etwa +3 %"},
 {id:"k03", g:"bip", q:"Erläutern Sie eine Kritik am Konzept des BIP aus Sicht des Keynesianismus.", k:["Ziel: BIP soll die aggregierte, beschäftigungswirksame Nachfrage messen","Problem: enthält Komponenten ohne monetäre, beschäftigungswirksame Ausgaben","Beispiel: imputierte Mieten für selbst genutztes Wohneigentum oder impliziter Konsum von Finanzdienstleistungen"], m:"1. Ziel: Aus keynesianischer Sicht soll das BIP die **beschäftigungswirksame Nachfrage** messen.\n2. Problem: Es enthält Komponenten ohne echte Geldausgaben, etwa **imputierte Mieten** für selbst genutztes Wohneigentum. Es wird so getan, als vermieteten Eigentümer an sich selbst.\n3. Folge: Steigen die Mieten, steigen privater Konsum und BIP, ohne dass mehr Beschäftigung entsteht."},
 {id:"k04", g:"bip", q:"Erläutern Sie eine Kritik am Konzept des BIP aus Sicht der Feministischen Ökonomik.", k:["Ziel: BIP soll die gesamte ökonomische Arbeit erfassen","Problem: unbezahlte (Sorge-)Arbeit bleibt unberücksichtigt","Vertiefung: Produktivität bei Sorgearbeit kaum messbar, oder Widerspruch zu imputierten Mieten, oder ungleiche Verteilung zwischen Frauen und Männern"], m:"1. Ziel: Aus feministischer Sicht soll das BIP die **gesamte ökonomische Arbeit** erfassen.\n2. Problem: **Unbezahlte Sorgearbeit** im Haushalt fehlt, obwohl Frauen sie überwiegend leisten. Ihre Produktivität ist zudem kaum messbar.\n3. Widerspruch: Man unterstellt, dass Eigentümer sich Miete zahlen, aber niemandem Lohn für Kinderbetreuung."},
 {id:"k05", g:"bip", q:"Erläutern Sie eine Kritik am Konzept des BIP aus neoklassischer Sicht.", k:["Ziel: BIP soll ein Wohlfahrtsmaß sein","Externalitäten bleiben weitgehend unberücksichtigt (Beispiel: Beseitigung von Umweltschäden erhöht das BIP)","Preise aus unvollständiger Konkurrenz überschätzen die Wohlfahrt"], m:"1. Ziel: Neoklassisch soll das BIP die **Wohlfahrt** messen.\n2. Problem: **Externalitäten** fehlen weitgehend. Ausgaben zur Beseitigung von Umweltschäden erhöhen sogar das BIP.\n3. Problem: Preise aus unvollständiger Konkurrenz (Monopole, Oligopole) **überschätzen** die Wohlfahrt."},
 {id:"k06", g:"bip", q:"Erläutern Sie eine Kritik am Konzept des BIP aus klassischer bzw. marxistischer Sicht.", k:["Ziel: BIP soll Grundlage für die Verteilung zwischen Klassen sein","Finanzsektor ist unproduktiv, verschiebt nur Werte, sollte nicht Teil des BIP sein","Kapitaleinkommen sind leistungslose Renten, keine Faktoreinkommen"], m:"1. Ziel: Klassisch-marxistisch soll das BIP die **Verteilung zwischen Klassen** zeigen.\n2. Problem: Der **Finanzsektor ist unproduktiv**, er verschiebt nur Werte. Finanzdienstleistungen sollten nicht Teil des BIP sein.\n3. Folge: Kapitaleinkommen sind **leistungslose Renten**, keine Faktoreinkommen."},
 {id:"k07", g:"bip", q:"Erläutern Sie eine Kritik am Konzept des BIP aus ökologischer Sicht.", k:["Einbettung der Ökonomie ins Ökosystem bleibt außen vor","Luxuskonsum zählt wie Grundbedürfnisse","Folge: BIP-Wachstum kann mit wachsenden Umweltschäden und Emissionen einhergehen"], m:"1. Problem: Das BIP lässt die **Einbettung der Ökonomie ins Ökosystem** außen vor.\n2. Problem: Energieintensiver **Luxuskonsum** zählt genauso wie Konsum für Grundbedürfnisse.\n3. Folge: Steigendes BIP kann mit steigenden Emissionen einhergehen, ohne dass der Verlust an natürlichen Lebensgrundlagen sichtbar wird."},
 {id:"k08", g:"export", q:"Erläutern Sie, welche Probleme sich in einer offenen Volkswirtschaft ergeben, wenn alle Länder einen Exportüberschuss anstreben.", k:["Nettoexporte der Welt sind immer null (Welt ist geschlossene Volkswirtschaft)","Überschüsse eines Landes erfordern Defizite und Verschuldung anderer","Streben alle Überschüsse an (und sparen binnenwirtschaftlich), droht ein weltweiter Nachfragemangel mit Arbeitslosigkeit"], m:"1. Die Welt ist eine geschlossene Volkswirtschaft: Die **Nettoexporte aller Länder summieren sich zu null**.\n2. Ein Überschuss setzt voraus, dass andere Länder **Defizite** haben und sich verschulden.\n3. Streben alle Überschüsse an und sparen im Inland, entsteht ein **weltweiter Nachfragemangel** mit Arbeitslosigkeit."},
 {id:"k09", g:"zb", q:"Ein negativer Nachfrageschock trifft die Wirtschaft (i/Y-Diagramm mit Zinslinie). Erläutern Sie, wie die Zentralbank reagieren sollte, wenn sie die Output-Lücke schließen möchte.", k:["Schock verschiebt die Nachfragekurve nach links, Output fällt bei altem Zins unter Y_POT","Zentralbank senkt den Zins (Zinslinie nach unten)","Begründung: niedrigerer Zins regt die Investitionen an (I = d − n·i), Output steigt zurück auf Y_POT"], m:"1. Der Schock verschiebt die Nachfragekurve **nach links**. Beim alten Zins liegt der Output unter dem Potenzial.\n2. Die Zentralbank sollte den **Zins senken**.\n3. Begründung: Ein niedrigerer Zins erhöht über I = d − n·i die **Investitionen**, bis der Output wieder dem Potenzial entspricht."},
 {id:"k10", g:"begriff", q:"Erläutern Sie das Keynes'sche Sparparadox.", k:["Wollen alle mehr sparen, sinkt die Konsumnachfrage","Investitionen steigen nicht automatisch, über den Multiplikator sinken Einkommen","Ergebnis: gesamtwirtschaftlich wird nicht mehr gespart (S = I), nur das Einkommen ist gesunken"], m:"1. Wollen alle mehr sparen, sinkt die **Konsumnachfrage**.\n2. Die Unternehmen investieren deshalb nicht mehr, über den **Multiplikator** sinken die Einkommen.\n3. Am Ende wird **nicht mehr gespart**, denn S = I, und I hat sich nicht verändert. Individuell vernünftig, gesamtwirtschaftlich kontraproduktiv."},
 {id:"k11", g:"begriff", q:"Erläutern Sie das Kostenparadox.", k:["Voraussetzung: Lohnbezieher:innen haben höhere Konsumneigung als Gewinnbezieher:innen","Höhere Löhne erhöhen die Güternachfrage und das Einkommen","Paradox: alle haben höhere Kosten, trotzdem können gesamtwirtschaftliche Gewinne Π = Y − W steigen"], m:"1. Voraussetzung: Lohnbezieher:innen haben eine **höhere Konsumneigung** als Gewinnbezieher:innen.\n2. Höhere Reallöhne erhöhen dann Güternachfrage und Einkommen.\n3. Paradox: Alle Unternehmen haben höhere Kosten, trotzdem können die **Gewinne** Π = Y − W **steigen**. Einzelne Lohnabschlüsse haben externe Effekte."},
 {id:"k12", g:"begriff", q:"Was versteht man unter Hysterese am Arbeitsmarkt?", k:["Ein vorübergehender Nachfragemangel wirkt dauerhaft nach","Mechanismus: Langzeitarbeitslose verlieren Qualifikation/Bezug, Unternehmen unterlassen Investitionen","Folge: strukturelle Arbeitslosigkeit steigt, Produktionspotenzial sinkt"], m:"1. Definition: Ein Zustand **dauert fort**, auch wenn die Ursache weggefallen ist.\n2. Mechanismus: Langzeitarbeitslose verlieren Qualifikation und Bezug zur Arbeitswelt, Unternehmen stellen **Investitionen** zurück.\n3. Folge: Strukturelle Arbeitslosigkeit steigt, das **Produktionspotenzial sinkt**. Aus einem konjunkturellen wird ein strukturelles Problem."},
 {id:"k13", g:"begriff", q:"Was besagt die Ricardianische Äquivalenz, und was folgt daraus für den Multiplikator?", k:["Haushalte erwarten bei kreditfinanzierten Staatsausgaben künftige Steuererhöhungen","Sie sparen schon heute mehr, der private Konsum sinkt","Der Multiplikator ist sehr klein bzw. null (Neuklassik)"], m:"1. Rationale Haushalte erwarten, dass kreditfinanzierte Staatsausgaben später über **höhere Steuern** bezahlt werden.\n2. Sie **sparen schon heute mehr**, der private Konsum sinkt.\n3. Folge: Der Multiplikator wird sehr klein, im Extremfall **null**. Argument der Neuklassik gegen Konjunkturpolitik."},
 {id:"k14", g:"begriff", q:"Warum ist der Multiplikator der Staatsausgaben größer als der Multiplikator einer Steuersenkung?", k:["m_G = 1/(1 − c₁), m_T = c₁/(1 − c₁)","Staatsausgaben gehen voll in die Nachfrage ein","Von einer Steuersenkung wird ein Teil (1 − c₁) gespart, nur c₁ wird nachfragewirksam"], m:"1. Formeln: Staatsausgaben 1/(1 − c₁), Steuern c₁/(1 − c₁)\n2. Staatsausgaben gehen **voll** in die Nachfrage ein.\n3. Eine Steuersenkung erhöht nur das verfügbare Einkommen, davon wird der Anteil 1 − c₁ **gespart**. Die Differenz der Multiplikatoren beträgt genau 1."},
 {id:"k15", g:"begriff", q:"Nennen Sie die Ziele des magischen Vierecks und erklären Sie, warum es „magisch“ heißt.", k:["Hoher Beschäftigungsstand und stabiles Preisniveau","Außenwirtschaftliches Gleichgewicht und angemessenes, stetiges Wachstum","„Magisch“: Ziele lassen sich wegen Zielkonflikten kaum gleichzeitig erreichen"], m:"1. Ziele nach dem Stabilitäts- und Wachstumsgesetz von 1967: hoher Beschäftigungsstand, stabiles Preisniveau\n2. außerdem: außenwirtschaftliches Gleichgewicht, angemessenes und stetiges Wachstum\n3. „Magisch“: Wegen **Zielkonflikten** lassen sich die Ziele kaum alle gleichzeitig erreichen, etwa Vollbeschäftigung und Preisstabilität."},
 {id:"k16", g:"begriff", q:"Unterscheiden Sie automatische Stabilisatoren und diskretionäre Fiskalpolitik.", k:["Automatische Stabilisatoren wirken ohne Beschluss mit der Konjunktur","Beispiel: Steuereinnahmen, Arbeitslosenunterstützung/Bürgergeld","Diskretionär: fallweise beschlossene Maßnahmen, z. B. Konjunkturprogramm"], m:"1. Automatische Stabilisatoren wirken **ohne politische Entscheidung**: Im Abschwung steigt das Defizit von selbst und stützt die Nachfrage.\n2. Beispiele: Steuereinnahmen, Ausgaben für Arbeitslose (Bürgergeld)\n3. Diskretionäre Fiskalpolitik: **fallweise beschlossene** Maßnahmen, etwa ein Konjunkturprogramm"},
 {id:"k17", g:"begriff", q:"Warum gilt in einer geschlossenen Volkswirtschaft ohne Staat immer S = I, und worüber streiten Neoklassik und Keynesianismus dabei?", k:["Herleitung: Y = C + I und Y = C + S, also S = I","Identität: gilt immer, unabhängig von der Theorie","Streit um Kausalität: Neoklassik S → I (Zins), Keynesianismus I → S (Einkommen)"], m:"1. Herleitung: Y = C + I und Y = C + S, also **S = I**.\n2. Das ist eine **Identität**, sie gilt immer.\n3. Streit um die **Kausalität**: neoklassisch S → I (Ersparnis bestimmt über den Zins die Investitionen), keynesianisch I → S (Investitionen bestimmen über das Einkommen die Ersparnis)."},
 {id:"k18", g:"begriff", q:"Was ist die NAIRU, und wie verläuft die langfristige Phillips-Kurve laut Monetarismus?", k:["NAIRU: Arbeitslosenquote, bei der die Inflation nicht beschleunigt (natürliche Arbeitslosigkeit)","Langfristige Phillips-Kurve vertikal bei der NAIRU","Nachfragepolitik darüber hinaus führt nur zu steigender Inflation"], m:"1. NAIRU: die Arbeitslosenquote, bei der die Inflation **nicht beschleunigt** (non-accelerating inflation rate of unemployment)\n2. Laut Monetarismus ist die langfristige Phillips-Kurve dort **vertikal**.\n3. Drückt Nachfragepolitik die Arbeitslosigkeit darunter, beschleunigt sich nur die Inflation, weil die Inflationserwartungen steigen."},
 {id:"k19", g:"begriff", q:"Erläutern Sie die Investitionsfalle.", k:["Investitionen reagieren wegen pessimistischer Erwartungen nicht auf den Zins","Nachfragekurve im i/Y-Diagramm senkrecht, Zinssenkung wirkungslos","Nur expansive Fiskalpolitik hilft"], m:"1. Die Erwartungen der Unternehmen sind so schlecht, dass die Investitionen **nicht auf Zinssenkungen reagieren**.\n2. Im i/Y-Diagramm verläuft die Nachfragekurve **senkrecht**, eine niedrigere Zinslinie ändert den Output nicht.\n3. Nur **expansive Fiskalpolitik** kann die Kurve nach rechts verschieben."},
 {id:"k20", g:"begriff", q:"Was ist der Beutelsbacher Konsens?", k:["Überwältigungsverbot","Kontroversitätsgebot","Schülerorientierung / Analyse der eigenen Interessenlage"], m:"1. Überwältigungsverbot: Schüler:innen dürfen nicht im Sinne erwünschter Meinungen überrumpelt werden.\n2. Kontroversitätsgebot: Was in Wissenschaft und Politik kontrovers ist, muss im Unterricht kontrovers erscheinen.\n3. Schülerorientierung: Schüler:innen sollen eine politische Situation und ihre eigene Interessenlage analysieren können."},
 {id:"k21", g:"begriff", q:"Was ist ein exportgetriebenes, was ein schuldengetriebenes Wachstumsmodell?", k:["Export-led: Lohnzurückhaltung, schwache Binnennachfrage, Leistungsbilanzüberschüsse (Deutschland)","Debt-led: Konsum unterer Einkommen auf Kredit, Defizite (USA)","Gemeinsam: Ersatz für fehlende Lohnnachfrage seit den 1980ern, Krise seit 2008"], m:"1. Ausgangslage: Seit den 1980ern fallen die **Löhne der Mittelschicht** als Basis der Nachfrage aus.\n2. Schuldengetrieben (USA, UK): Untere Einkommensgruppen **konsumieren auf Kredit**, dazu Staats- und Leistungsbilanzdefizite.\n3. Exportgetrieben (Deutschland, Japan, China): **Lohnzurückhaltung** und hohe Ersparnis von Unternehmen und Staat schwächen die Binnennachfrage, Wachstum kommt über **Leistungsbilanzüberschüsse**."},
 {id:"k22", g:"begriff", q:"Warum kann ein Individuum in Form von Geld sparen, aber nicht die gesamte Gesellschaft?", k:["Ausgaben des einen sind Einnahmen des anderen","Gesamtwirtschaftlich S = I: Gesellschaft spart nur, indem sie investiert","Summe der Geldvermögen ist null; wollen alle nur Geld sparen, sinkt Y"], m:"1. Was ein Haushalt nicht ausgibt, fehlt einem anderen als **Einnahme**.\n2. Gesamtwirtschaftlich gilt **S = I**: Die Gesellschaft kann nur sparen, indem sie investiert. Jedem Geldvermögen steht eine Schuld gegenüber.\n3. Wollten alle nur Geld sparen, wäre Y = C + I = 0, und niemand hätte Einkommen."}
];

/* ---------- Kurzfragen üben ---------- */
function kurzScore(id){ return (state.kurz||{})[id]; }
function pickKurz(){ const w=KURZ.map(x=>{ const s=kurzScore(x.id); return !s?4:(s.p<3?3:1); }); let r=Math.random()*w.reduce((a,b)=>a+b,0), i=0; for(;i<KURZ.length;i++){ r-=w[i]; if(r<=0) break; } return KURZ[Math.min(i,KURZ.length-1)]; }
function openKurz(){ cur.kz=pickKurz(); cur.kzph="schreiben"; cur.kzc={}; cur.kzt=""; go("kurz"); }
function renderKurz(){
  const x=cur.kz, done=Object.keys(state.kurz||{}).length;
  $("#app").innerHTML=`${backTo("Üben")}
    <p class="eyebrow">Teil I · Kurzfrage · 3 Punkte · ${done} von ${KURZ.length} bearbeitet</p>
    <div class="block"><p style="margin:0"><b>${x.q}</b></p><p class="small muted" style="margin:8px 0 0">In der Klausur hast du etwa 3 Minuten. Antworte in zwei bis vier Sätzen.</p></div>
    <div class="essay">${cur.kzph==="schreiben"?`
      <label class="small muted" for="kt">Deine Antwort</label>
      <textarea id="kt" style="margin-top:6px;min-height:8rem">${esc(cur.kzt)}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn" id="kd">Antwort prüfen</button></div>`:`
      <div class="block"><h3>Erwartungshorizont (je 1 Punkt)</h3>${x.k.map((k,j)=>`<label class="check"><input type="checkbox" id="q${j}" ${cur.kzc[j]?"checked":""}><span>${k}</span></label>`).join("")}
        <div class="row"><button class="btn" id="ks">Speichern und weiter</button><button class="btn ghost" id="kn">Ohne Speichern weiter</button></div></div>
      ${cur.kzt?`<div class="block"><h3>Deine Antwort</h3><p style="white-space:pre-wrap;margin:0">${esc(cur.kzt)}</p></div>`:""}
      <div class="block lesson card-like"><h3>Musterlösung</h3><div class="ml">${richText(x.m)}</div></div>`}
    </div>`;
  bindCrumb(()=>go("practice"));
  if($("#kd")) $("#kd").onclick=()=>{ cur.kzt=$("#kt").value; cur.kzph="bewerten"; renderKurz(); window.scrollTo(0,0); };
  document.querySelectorAll(".check input").forEach(c=>c.onchange=()=>{ cur.kzc[+c.id.slice(1)]=c.checked; });
  if($("#ks")) $("#ks").onclick=()=>{ state.kurz=state.kurz||{}; const p=x.k.filter((_,j)=>cur.kzc[j]).length; state.kurz[x.id]={p,t:Date.now()}; logDay(); save(); toast(`${p} von 3 Punkten gespeichert`); sess?sessNext():openKurz(); };
  if($("#kn")) $("#kn").onclick=()=>sess?sessNext():openKurz();
}

const EXAM_GRAPHS=["g6a","g7a","g4a","g2"];
const EXAM_ESSAYS=()=>Object.values(ESSAYS).flat().filter(e=>e.pts===24);
function findGraph(id){ return Object.values(GRAPHS).flat().find(g=>g.id===id); }
function newExam(min){
  const bip=shuffle(KURZ.filter(x=>x.g==="bip"))[0], other=shuffle(KURZ.filter(x=>x.g!=="bip"&&x.g!=="begriff"))[0], beg=shuffle(KURZ.filter(x=>x.g==="begriff"))[0];
  const numT=pick(["schuld","salden"]);
  const texts=shuffle([bip,other,beg]);

/* ================= Aufgabe ================= */
function startTask(t,mix){
  task={t,mix,lvl:lvlOf(t),data:TYPES[t].gen(),cur:0,shown:0,first:{},done:false,checks:{}};
  view="task"; render(); window.scrollTo(0,0);
}
function nextTask(){
  if(task.mix){ const pool=ORDER.filter(x=>x!==task.t); const w=pool.map(x=>{const a=acc(x);return a==null?2:1.5-a;}); let s=Math.random()*w.reduce((a,b)=>a+b,0); let i=0; for(;i<pool.length;i++){ s-=w[i]; if(s<=0) break; } startTask(pool[Math.min(i,pool.length-1)],true); }
  else startTask(task.t,false);
}
function record(ok){
  const t=task.t; state.hist[t]=state.hist[t]||{n:0,r:0}; state.hist[t].n++; if(ok) state.hist[t].r++;
  const k=today(); state.days[k]=(state.days[k]||0)+1;
  const l=lvlOf(t), st=state.streak[t]||0;
  if(l===2){ state.streak[t]= ok? st+1 : 0; if(state.streak[t]>=2){ state.lvl[t]=3; state.streak[t]=0; toast("Stufe Frei freigeschaltet"); } }
  else if(l===3){ state.streak[t]= ok? 0 : st+1; if(state.streak[t]>=2){ state.lvl[t]=2; state.streak[t]=0; toast("Zurück zu Geführt, um den Weg zu festigen"); } }
  save();
}
function head(){
  const T=TYPES[task.t], d=task.data;
  return `<div class="row between" style="margin-bottom:8px">
      <button class="btn ghost small" id="back">← Liste</button>
      <div class="seg" role="group" aria-label="Stufe">${[1,2,3].map(l=>`<button data-l="${l}" aria-pressed="${task.lvl===l}">${LVL[l]}</button>`).join("")}</div>
    </div>
    <div class="row between" style="margin:0 0 .3em"><p class="eyebrow" style="margin:0">${task.mix?"Gemischt · ":""}${T.name}</p><button class="btn ghost small" id="lex">Symbole</button></div>
    <div class="block">
      <p class="small">${d.intro}</p>
      ${d.table}
      <p style="margin:10px 0 0"><b>${d.q}</b></p>
    </div>`;
}
function bindHead(){
  $("#back").onclick=()=>go("calc");
  $("#lex").onclick=showLexicon;
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ const l=+b.dataset.l; state.lvl[task.t]=l; state.streak[task.t]=0; save(); task.lvl=l; task.cur=0; task.shown=0; task.first={}; task.done=false; task.checks={}; render(); });
}
function renderTask(){
  const T=TYPES[task.t];
  if(T.self) return renderSelf();
  if(task.lvl===1) return renderWorked();
  if(task.lvl===2) return renderGuided();
  return renderFree();
}
const eqLine=s=>`<div class="eq">${esc(s.calc)}</div>`;
/* Lösungsschritt: Formel, Einsetzen, Begründung; am Ende Ergebnis und Deutung */
const stepRows=s=>`<div class="dlist">${s.f?`<b>Formel</b><span><span class="eq" style="display:block">${esc(s.f)}</span></span>`:""}<b>Einsetzen</b><span><span class="eq" style="display:block">${esc(s.calc)}</span></span>${s.why?`<b>Warum</b><span>${s.why}</span>`:""}</div>`;
const deutBox=d=>{ const t=d.deut||(TYPES[task.t]||{}).deut; return t?`<div class="bsp"><p class="bh">Deutung</p><p style="margin:0 0 8px">${t}</p></div>`:""; };

/* Stufe 1: vorgerechnet, Schritt für Schritt aufdecken */
function renderWorked(){
  const S=task.data.steps, n=task.shown;
  $("#app").innerHTML=head()+`
    <div class="stack">${S.slice(0,n+1).map((s,i)=>`<div class="step">
      <div class="lab">${i+1}. ${s.lab}</div>${stepRows(s)}</div>`).join("")}</div>
    ${n>=S.length-1?deutBox(task.data):""}
    <div class="row" style="margin-top:14px">${n<S.length-1?`<button class="btn" id="more">Nächster Schritt</button>`:`<button class="btn" id="self">Jetzt selbst rechnen</button>`}</div>`;
  bindHead();
  if($("#more")) $("#more").onclick=()=>{ task.shown++; renderWorked(); };
  if($("#self")) $("#self").onclick=()=>{ state.lvl[task.t]=2; state.streak[task.t]=0; save(); startTask(task.t,task.mix); };
}

/* Stufe 2: geführt, ein Schritt nach dem anderen mit Eingabe */
function renderGuided(){
  const S=task.data.steps, cur=task.cur;
  const html=S.map((s,i)=>{
    if(i>cur) return "";
    if(i<cur){ const ok=task.first[i]; return `<div class="step ${ok?"ok":"no"}"><div class="lab">${i+1}. ${s.lab}</div>${eqLine(s)}</div>`; }
    return `<div class="step" id="curStep"><div class="lab">${i+1}. ${s.lab}</div><div class="why">${s.why}</div>
      <div class="inp"><input id="in" inputmode="decimal" autocomplete="off" aria-label="${esc(s.lab.replace(/<[^>]+>/g,""))}"><button class="btn small" id="chk">Prüfen</button><button class="btn ghost small" id="hint">Formel</button></div>
      <div id="out"></div></div>`;
  }).join("");
  $("#app").innerHTML=head()+`<div class="stack">${html}</div>
    ${task.done?deutBox(task.data)+finishBox():padHTML()}`;
  bindHead(); bindPad();
  if(task.done){ bindFinish(); return; }
  const inp=$("#in"); inp.focus({preventScroll:true});
  const s=S[cur];
  const check=()=>{
    const res=judge(s,inp.value);
    if(res===null){ $("#out").innerHTML=`<p class="res bad">Bitte eine Zahl eingeben, Komma oder Punkt geht beides.</p>`; return; }
    if(!(cur in task.first)) task.first[cur]=res;
    if(res){ task.cur++; if(task.cur>=S.length){ task.done=true; record(Object.values(task.first).every(Boolean)); } renderGuided(); }
    else{ $("#out").innerHTML=`<p class="res bad">Noch nicht. ${s.sign?"Achte auch aufs Vorzeichen. ":""}Versuch es nochmal oder lass dir den Schritt zeigen.</p><button class="btn ghost small" id="reveal">Schritt zeigen</button>`;
      $("#reveal").onclick=()=>{ task.first[cur]=false; task.cur++; if(task.cur>=S.length){ task.done=true; record(false); } renderGuided(); }; }
  };
  $("#chk").onclick=check; inp.onkeydown=e=>{ if(e.key==="Enter") check(); };
  $("#hint").onclick=()=>{ $("#out").innerHTML=`<p class="hint muted">Formel:</p><div class="eq">${esc(s.f)}</div>`; };
}

/* Stufe 3: frei, nur die Klausurgrößen */
function renderFree(){
  const S=task.data.steps, F=S.map((s,i)=>[s,i]).filter(([s])=>s.final);
  $("#app").innerHTML=head()+`
    ${padHTML()}
    <div class="block stack">${F.map(([s,i])=>`<div>
      <label class="lab" for="f${i}" style="font-weight:600">${s.lab}</label>
