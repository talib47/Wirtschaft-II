<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wirtschaft II</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wirtschaft II">
<meta name="theme-color" content="#2D4F86">
<link rel="apple-touch-icon" href="/Wirtschaft-II/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="/Wirtschaft-II/icon-192.png?v=2">
<link rel="manifest" href="/Wirtschaft-II/manifest.webmanifest?v=2">
<style>
/* Layout: eine schmale Lernspalte (max. 42rem) mit fester Tableiste unten, wie die W&G-I-App; eigene Akzentfarbe für Wirtschaft II */
:root{
  --bg:#EDEFF2; --surface:#F9FAFB; --ink:#1B2433; --muted:#5A6576; --line:#CBD1DA;
  --accent:#2D4F86; --accent-ink:#FFFFFF; --accent-soft:#DCE4F1;
  --good:#2F7A4A; --good-soft:#DDEEE2; --bad:#A3392B; --bad-soft:#F4DEDA; --gold:#A87B1F;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#12161D; --surface:#1B212B; --ink:#E3E7EE; --muted:#9AA4B3; --line:#323C4A;
    --accent:#8FB1E3; --accent-ink:#0E1626; --accent-soft:#25324A;
    --good:#6CC28B; --good-soft:#1E3327; --bad:#E58373; --bad-soft:#3A2420; --gold:#D9AE55; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#12161D; --surface:#1B212B; --ink:#E3E7EE; --muted:#9AA4B3; --line:#323C4A;
  --accent:#8FB1E3; --accent-ink:#0E1626; --accent-soft:#25324A;
  --good:#6CC28B; --good-soft:#1E3327; --bad:#E58373; --bad-soft:#3A2420; --gold:#D9AE55; }
*{box-sizing:border-box}
html{font-size:calc(100% * var(--z,1))}
.zoom{position:fixed;right:max(12px, env(safe-area-inset-right, 0px));bottom:calc(72px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:8px;z-index:6}
.zoom button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;line-height:1;opacity:.9;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.tag{display:inline-block;font-family:var(--sans);font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:999px;vertical-align:middle;white-space:nowrap}
.tag.core{color:var(--accent);border:1px solid var(--accent)}
.tag.bg{color:var(--muted);border:1px dashed var(--line)}
.cctx{margin:-4px 0 0;font-size:.82rem;color:var(--muted)}
.cinfo{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:.82rem;line-height:1.45;color:var(--muted)}
.cinfo .cl{display:block}
.cinfo .cl+.cl{margin-top:3px}
.cinfo b{color:var(--ink);font-weight:600}
.cinfo .ci{flex:none;width:18px;height:18px;border-radius:50%;border:1px solid var(--muted);font:600 .7rem/16px var(--serif);font-style:italic;text-align:center;margin-top:1px}
.wlink{color:var(--accent);text-decoration:none;font-weight:600;font-size:.92rem;line-height:1.4}
.wlink:hover{text-decoration:underline}
.mc .idk{border-style:dashed;color:var(--muted);text-align:center}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:42rem;margin:0 auto;padding-block:20px 120px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .4em;text-wrap:balance}
h1{font-size:1.75rem}
h1,h2,h3,.card .front{overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0 0 .8em}
.muted{color:var(--muted)} .small{font-size:.875rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 .3em}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.9rem}
.btn.warn{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.l1{color:var(--gold);border-color:var(--gold)}
.chip.l2{color:var(--accent);border-color:var(--accent)}
.chip.l3{color:var(--good);border-color:var(--good)}
.chip.soon{border-style:dashed}

/* Klausuraufbau */
.parts{display:grid;grid-template-columns:12fr 24fr 24fr;gap:4px;margin:10px 0 8px}
.parts div{height:10px;border-radius:3px;background:var(--line)}
.parts div.on{background:var(--accent)}
.partlist{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;font-size:.92rem}
.partlist b{font-variant-numeric:tabular-nums}

/* Aufgabenliste */
.tlist{display:flex;flex-direction:column}
.titem{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 2px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.titem:first-child{border-top:0}
.titem .t{font-weight:600}
.titem .d{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--good)}

/* Aufgabe */
.data{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem}
.data th,.data td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.data th{font-weight:600;color:var(--muted);font-size:.8rem}
.data td{font-family:var(--mono)}
.tablewrap{overflow-x:auto;margin:8px 0 2px}
.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:6px;margin:10px 0 2px}
.vals div{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg);display:flex;flex-direction:column;gap:1px;min-width:0}
.vals span{font-size:.76rem;color:var(--muted);line-height:1.3}
.vals b{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.eq{font-family:var(--mono);font-size:.92rem;background:var(--bg);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 12px;font-size:.85rem;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.step.ok{border-color:var(--good);background:var(--good-soft)}
.step.no{border-color:var(--bad);background:var(--bad-soft)}
.step .lab{font-weight:600}
.step .why{font-size:.88rem;color:var(--muted);margin:2px 0 8px}
.inp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp input{width:9.5rem;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-family:var(--mono);font-size:1.05rem}
.inp input:focus{border-color:var(--accent)}
.res{font-size:.9rem;margin-top:8px}
.res.good{color:var(--good)} .res.bad{color:var(--bad)}
.hint{font-size:.88rem}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}

/* Schmierzettel */
.pad{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.pad canvas{display:block;width:100%;height:240px;touch-action:none}
.pad .tools{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.pad .tools button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.8rem}
.pad .ph{position:absolute;left:12px;top:10px;font-size:.8rem;color:var(--muted);pointer-events:none}

/* Statistik */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px;margin:10px 0 4px}
.week div{background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.weekl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:.75rem;color:var(--muted);text-align:center}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.srow:first-of-type{border-top:0}
.srow.ch{grid-template-columns:1fr auto}
.srow.ch .small{grid-column:1/-1;grid-row:2}
.srow span{font-variant-numeric:tabular-nums}

/* Tableiste */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));z-index:5}
nav button{flex:1;max-width:9rem;background:none;border:0;border-radius:10px;padding:9px 6px;font-weight:600;font-size:.9rem;color:var(--muted)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){ .step{transition:background .2s,border-color .2s} }

/* ===== Lernpfad, Lektionen, Karten, Grafiken, Essay ===== */
.chap{display:grid;grid-template-columns:2.4rem 1fr auto;gap:4px 12px;align-items:center;padding:12px 2px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.chap:first-child{border-top:0}
.chap .no{font-family:var(--serif);font-size:1.3rem;font-weight:600;color:var(--accent);text-align:center}
.chap .t{font-weight:600;min-width:0}
.chap .d{grid-column:2/-1;font-size:.82rem;color:var(--muted)}
.chap .bar{grid-column:2/-1}
.chap.off .no,.chap.off .t{color:var(--muted)}
.chap:disabled{cursor:default}
.modes{display:flex;flex-direction:column}
.mode{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:13px 2px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.mode:first-child{border-top:0}
.mode .t{font-weight:600}
.mode .d{grid-column:1/-1;font-size:.84rem;color:var(--muted)}
.mode .n{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.today{border-color:var(--accent);background:var(--accent-soft)}
.lesson h2{margin-top:.2em}
.lesson p,.lesson li{max-width:65ch}
.lesson ul{padding-left:1.2em;margin:0 0 .8em}
.lesson li{margin:.2em 0}
.merk{border-left:4px solid var(--gold);background:var(--bg);border-radius:0 10px 10px 0;padding:10px 12px;margin:10px 0}
.merk b:first-child{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.kv{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0 10px}
.kv td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.kv td:first-child{font-weight:600;padding-right:14px;width:34%;hyphens:auto;-webkit-hyphens:auto}
@media (max-width:560px){ .kv,.kv tbody,.kv tr,.kv td{display:block;width:100%} .kv tr{border-top:1px solid var(--line);padding:6px 0} .kv tr:first-child{border-top:0} .kv td{border:0;padding:1px 0} .kv td:first-child{width:auto} }
.mc{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mc button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mc button.r{border-color:var(--good);background:var(--good-soft)}
.mc button.w{border-color:var(--bad);background:var(--bad-soft)}
.mc button:disabled{cursor:default;color:var(--ink)}
.ex{font-size:.9rem;margin-top:8px}
.card{min-height:12rem;display:flex;flex-direction:column;justify-content:center;gap:10px}
.card .front{font-family:var(--serif);font-size:1.25rem;font-weight:600;text-wrap:balance}
.card .back{border-top:1px solid var(--line);padding-top:10px;white-space:pre-line}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.gbox{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.gbox svg,.gbox canvas{position:absolute;inset:0;width:100%;height:100%}
.gbox canvas{touch-action:none}
.gbox .solsvg{pointer-events:none}
.fig{width:100%;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin:8px 0 12px}
svg .ax{stroke:var(--muted);stroke-width:1.6;fill:none}
svg .base{stroke:var(--ink);stroke-width:2.4;fill:none}
svg .sol{stroke:var(--accent);stroke-width:2.8;fill:none}
svg .gold{stroke:var(--gold);stroke-width:2.8;fill:none}
svg .dash{stroke-dasharray:5 5}
svg .thin{stroke-width:1.4}
svg text{fill:var(--muted);font:13px var(--sans)}
svg text.st{fill:var(--accent);font-weight:600}
svg text.bt{fill:var(--ink)}
svg .dot{fill:var(--surface);stroke:var(--ink);stroke-width:2}
svg .sdot{fill:var(--accent)}
svg .arrowhead{fill:var(--muted)}
svg .sarrow{fill:var(--accent)}
.essay textarea{width:100%;min-height:16rem;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;font:1rem/1.55 var(--sans);resize:vertical}
.pts{font-variant-numeric:tabular-nums;font-weight:600}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.crumb{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:.9rem;margin-bottom:8px}

/* ===== Strukturierte Inhalte: Begriffslisten, Gegenüberstellungen, Beispielboxen, Formeln ===== */
.eq{white-space:normal;overflow-wrap:break-word;overflow-x:visible;line-height:1.55;margin:6px 0}
.pz{color:var(--muted);font-size:.9em}
.dlist{display:grid;grid-template-columns:fit-content(42%) 1fr;margin:4px 0 8px}
.dlist>b,.dlist>span{padding:6px 0;border-top:1px solid var(--line);min-width:0;overflow-wrap:break-word}
.dlist>b{padding-right:14px;font-weight:600;hyphens:auto;-webkit-hyphens:auto}
.dlist>b:first-child,.dlist>b:first-child+span{border-top:0}
.dlist .eq{margin:4px 0 2px}
.cmp{width:100%;border-collapse:collapse;font-size:.92rem;margin:6px 0 10px}
.cmp th,.cmp td{border-top:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.cmp thead th{border-top:0;font-size:.78rem;letter-spacing:.04em;color:var(--muted);font-weight:600}
.cmp tbody th{font-weight:600;padding-left:0}
.cmp td{overflow-wrap:break-word}
@media (max-width:560px){
  .cmp:not(.tight) thead{display:none}
  .cmp:not(.tight),.cmp:not(.tight) tbody,.cmp:not(.tight) tr,.cmp:not(.tight) th,.cmp:not(.tight) td{display:block;width:100%}
  .cmp:not(.tight) tr{border-top:1px solid var(--line);padding:6px 0}
  .cmp:not(.tight) tr:first-child{border-top:0}
  .cmp:not(.tight) tbody th,.cmp:not(.tight) td{border:0;padding:2px 0}
  .cmp:not(.tight) td{display:grid;grid-template-columns:fit-content(45%) 1fr;gap:10px}
  .cmp:not(.tight) td::before{content:attr(data-l);color:var(--muted);font-size:.8rem;padding-top:1px}
}
.bsp{border:1px solid var(--line);border-radius:12px;padding:10px 14px 4px;margin:12px 0;background:var(--bg)}
.bsp .bh,.lesson .bsp .bh{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 2px}
.bsp .dlist{margin:0}
.lesson ol.steps{padding-left:1.3em;margin:0 0 .8em}
.lesson ol.steps li{margin:.35em 0}
.card{cursor:pointer;-webkit-tap-highlight-color:transparent}
.card .cctx{margin:0;font-size:.8rem;color:var(--muted);letter-spacing:.01em}
.card .back{white-space:normal}
.card .back p{margin:0 0 .5em}
.card .back ul,.card .back ol{margin:0 0 .5em;padding-left:1.25em}
.card .back li{margin:.2em 0}
.card .back>:last-child{margin-bottom:0}
.ml ol,.ml ul{padding-left:1.25em;margin:0 0 .5em} .ml li{margin:.25em 0} .ml p{margin:0 0 .5em}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kg{margin-left:8px;vertical-align:middle;background:transparent;border:1px dashed var(--line);border-radius:999px;padding:6px 12px;font-size:.8rem;color:var(--muted)}
.kg[aria-pressed="true"]{border:1px solid var(--gold);color:var(--gold);font-weight:600}
.kg:disabled{cursor:default}
.hint{margin:6px 0 0;font-size:.75rem;color:var(--muted);opacity:.85}
.swipewrap{position:relative;overflow-x:clip;overflow-y:visible;margin:0 -16px;padding:0 16px}
.swipewrap .card{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;will-change:transform;position:relative;overflow:hidden;backface-visibility:hidden}
.card .tint{position:absolute;inset:0;opacity:0;pointer-events:none;border-radius:inherit;border:2px solid transparent;will-change:opacity}
.card .tint.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 7%,transparent)}
.card .tint.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,transparent)}
.card.enter{animation:cardIn .22s ease-out}
@keyframes cardIn{from{opacity:0;transform:translate3d(0,8px,0) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card.enter{animation:none}}
.cty{display:block;width:100%;box-sizing:border-box;margin:2px 0 12px;padding:6px 2px;font:inherit;font-size:.95rem;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;resize:none;outline:none}
.cty:focus{border-bottom-color:var(--muted)}
.cty::placeholder{color:var(--muted);opacity:.7}
.tylink{background:transparent;border:0;padding:8px 6px;font:inherit;font-size:.85rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.card .typed{border-top:1px solid var(--line);padding-top:8px}.card .typed p{margin:2px 0 0;white-space:pre-wrap}
.grade .btn{padding:12px 6px}
.cardpad{margin:0 0 12px}
.cardpad canvas{height:170px}
.card .tap{font-size:.78rem;color:var(--muted);margin:0}
.fb{margin-top:10px;border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:.92rem}
.fb.good{border-color:var(--good)} .fb.bad{border-color:var(--bad)} .fb.idk{border-color:var(--gold)}
.fb .fh{margin:0 0 2px;font-weight:600}
.fb.good .fh{color:var(--good)} .fb.bad .fh{color:var(--bad)} .fb.idk .fh{color:var(--gold)}
.fb .dlist{margin:0}
.unc{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip.unk{color:var(--gold);border-color:var(--gold)}
.copybox{width:100%;min-height:8rem;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;font-size:.85rem}
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.week7 .d{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.week7 .bw{height:80px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.week7 .bw i{display:block;width:70%;max-width:2.2rem;background:var(--accent);opacity:.55;border-radius:4px 4px 0 0;min-height:2px}

<body>
<div id="sessbar" hidden></div>
<main id="app"></main>
<nav id="nav"></nav>
<div class="zoom" role="group" aria-label="Schriftgröße"><button id="zIn" aria-label="Größer">+</button><button id="zOut" aria-label="Kleiner">−</button></div>

<script>
"use strict";
/* ================= Speicher (eigene Schlüssel, damit nichts mit anderen Apps unter talib47.github.io kollidiert) ================= */
const KEY="w2-lernapp-v1";
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
let state;
try{ state=JSON.parse(lsGet(KEY)||"null"); }catch(e){ state=null; }
if(!state||typeof state!=="object") state={};
function norm(){ for(const k of ["lvl","streak","hist","days","lessons","box","graphs","essays","drafts","unclear","qbox","qlapses","lapses","who","sessions"]) if(!state[k]||typeof state[k]!=="object") state[k]={}; }
norm();
function save(){ state.updated=Date.now(); lsSet(KEY,JSON.stringify(state)); schedulePush(); }

/* ===== Geräte-Abgleich über GitHub (Datei fortschritt.json im Zweig "fortschritt", wie in der W&G-I-App) ===== */
const GH={repo:"https://api.github.com/repos/talib47/Wirtschaft-II", file:"fortschritt.json", branch:"fortschritt", tokenKey:"w2-gh-token"};
GH.api=GH.repo+"/contents/"+GH.file;
let ghToken=null, remoteSha=null, syncStatus="aus", lastSync=null, pushTimer=null, pushing=false, pushAgain=false;
function initToken(){
  const m=location.hash.match(/[#&]t=([A-Za-z0-9_]+)/);
  if(m){ lsSet(GH.tokenKey,m[1]); try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} }
  ghToken=lsGet(GH.tokenKey);
}
const ghHeaders=()=>({"Authorization":"Bearer "+ghToken,"Accept":"application/vnd.github+json"});
const b64enc=str=>btoa(unescape(encodeURIComponent(str)));
const b64dec=str=>decodeURIComponent(escape(atob(str.replace(/\n/g,""))));
async function ensureBranch(){
  const r=await fetch(GH.repo+"/git/ref/heads/"+GH.branch,{headers:ghHeaders(),cache:"no-store"});
  if(r.ok) return true;
  const base=await fetch(GH.repo,{headers:ghHeaders(),cache:"no-store"}); if(!base.ok) return false;
  const def=(await base.json()).default_branch||"main";
  const h=await fetch(GH.repo+"/git/ref/heads/"+def,{headers:ghHeaders(),cache:"no-store"}); if(!h.ok) return false;
  const sha=(await h.json()).object.sha;
  const c=await fetch(GH.repo+"/git/refs",{method:"POST",headers:ghHeaders(),body:JSON.stringify({ref:"refs/heads/"+GH.branch,sha})});
  return c.ok;
}
async function pull(){
  if(!ghToken) return null;
  const r=await fetch(GH.api+"?ref="+GH.branch+"&_="+Date.now(),{headers:ghHeaders(),cache:"no-store"});
  if(r.status===404){ remoteSha=null; return {}; }
  if(r.status===401){ syncStatus="schluessel"; return null; }
  if(!r.ok) throw new Error(r.status);
  const d=await r.json(); remoteSha=d.sha;
  return JSON.parse(b64dec(d.content));
}
async function push(){
  if(!ghToken) return;
  if(pushing){ pushAgain=true; return; }
  pushing=true;
  try{
    for(let attempt=0;attempt<3;attempt++){
      const body={message:"Lernstand",branch:GH.branch,content:b64enc(JSON.stringify(state))};
      if(remoteSha) body.sha=remoteSha;
      const r=await fetch(GH.api,{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)});
      if(r.ok){ const d=await r.json(); remoteSha=d.content.sha; syncStatus="ok"; lastSync=new Date(); break; }
      if(r.status===401){ syncStatus="schluessel"; break; }
      if(r.status===404){ if(!(await ensureBranch())){ syncStatus="fehler"; break; } continue; }  // Zweig fehlt noch: anlegen
      if(r.status===409||r.status===422){ await pull(); continue; }  // veraltete Version: neu holen und nochmal
      syncStatus="fehler"; break;
    }
  }catch(e){ syncStatus="fehler"; }
  pushing=false;
  if(pushAgain){ pushAgain=false; push(); }
}
function schedulePush(){ if(!ghToken) return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>{ pushTimer=null; push(); },1500); }
function flushPush(){ if(pushTimer){ clearTimeout(pushTimer); pushTimer=null; push(); } }
/* Neuerer Stand gewinnt (Zeitstempel "updated") */
async function syncFromRemote(){
  if(!ghToken) return false;
  try{
    const remote=await pull();
    if(remote===null) return false;
    if(remote.updated && remote.updated>(state.updated||0)){ state=Object.assign(state,remote); norm(); lsSet(KEY,JSON.stringify(state)); syncStatus="ok"; lastSync=new Date(); return true; }
    if((state.updated||0)>(remote.updated||0)) await push();
    else { syncStatus="ok"; lastSync=new Date(); }
  }catch(e){ syncStatus="fehler"; }
  return false;
}
async function autoPull(){
  if(!ghToken||document.visibilityState!=="visible"||["task","exam","essay","graph","kurz","lesson","cards"].includes(view)||pushTimer||pushing) return;
  if(await syncFromRemote()) render();
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushPush(); else autoPull(); });
window.addEventListener("pagehide",flushPush);
window.addEventListener("focus",autoPull);
setInterval(autoPull,30000);
function syncBox(){
  if(!ghToken) return `<div class="block"><h3>Geräte verbinden</h3>
    <p class="small muted">Damit iPad, iPhone und Laptop denselben Stand haben, verbinde jedes Gerät einmal. Am einfachsten öffnest du dafür deinen Verbindungslink (Adresse der App mit #t=Schlüssel am Ende).</p>
    <label class="small muted" for="tkIn">Oder füge hier deinen GitHub-Schlüssel ein (beginnt mit github_pat_):</label>
    <textarea id="tkIn" style="width:100%;min-height:70px;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;font-family:var(--mono);font-size:.85rem"></textarea>
    <button class="btn" id="tkGo" style="margin-top:8px">Gerät verbinden</button></div>`;
  const msg={ok:`Dieses Gerät ist verbunden und gleicht automatisch ab${lastSync?", zuletzt um "+lastSync.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):""}.`,
    fehler:"Abgleich gerade nicht möglich, etwa ohne Internet. Dein Stand bleibt auf diesem Gerät und wird später abgeglichen.",
    schluessel:"Der Schlüssel funktioniert nicht. Prüfe, ob er Zugriff auf das Repository Wirtschaft-II hat, oder verbinde mit einem neuen Schlüssel.",
    aus:"Wird abgeglichen …"}[syncStatus];
  return `<div class="block"><h3>Geräte-Abgleich</h3>
    <p class="small" ${syncStatus==="ok"?'style="color:var(--muted)"':'style="color:var(--bad)"'}>${msg}</p>
    <div class="row"><button class="btn ghost small" id="syNow">Jetzt abgleichen</button><button class="btn ghost small" id="syOff">Gerät trennen</button></div></div>`;
}
function bindSync(){
  const goB=$("#tkGo");
  if(goB) goB.onclick=async()=>{
    const t=$("#tkIn").value.trim();
    if(!/^github_pat_\w+$/.test(t)){ toast("Das sieht nicht nach einem Schlüssel aus. Er beginnt mit github_pat_."); return; }
    lsSet(GH.tokenKey,t); ghToken=t; toast("Verbinde …");
    await syncFromRemote(); toast(syncStatus==="ok"?"Gerät verbunden":"Verbinden hat nicht geklappt"); render();
  };
  const now=$("#syNow");
  if(now) now.onclick=async()=>{ flushPush(); await syncFromRemote(); toast(syncStatus==="ok"?"Abgeglichen":"Abgleich hat nicht geklappt"); render(); };
  const off=$("#syOff");
  if(off) off.onclick=()=>{ if(!off.dataset.armed){ off.dataset.armed="1"; off.textContent="Wirklich trennen"; return; } lsDel(GH.tokenKey); ghToken=null; syncStatus="aus"; render(); };
}

/* ================= Helfer ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const isInt=x=>Math.abs(x-Math.round(x))<1e-9;
const nice=(x,dec)=>Math.abs(x*10**dec-Math.round(x*10**dec))<1e-7;
const r=x=>Math.round(x*1e6)/1e6;
function fmt(x){
  x=r(x); if(Object.is(x,-0)) x=0;
  let s=String(Math.abs(x)); if(s.includes("e")) s=Math.abs(x).toFixed(6).replace(/0+$/,"");
  s=s.replace(".",","); return (x<0?"−":"")+s;
}
const par=x=>x<0?"("+fmt(x)+")":fmt(x);
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseNum(v){
  let t=String(v).trim().replace(/\s|€/g,"").replace(/−|–/g,"-");
  const pct=t.includes("%"); t=t.replace("%","");
  if(t.includes(",")) t=t.replace(/\./g,"").replace(",",".");
  if(t===""||t==="-"||isNaN(+t)) return null;
  return {v:+t,pct};
}
const close=(a,b)=>Math.abs(a-b)<=Math.max(0.011,Math.abs(b)*0.005);
function judge(step,raw){
  const p=parseNum(raw); if(!p) return null;
  let v=p.v;
  if(step.tol!=null) return Math.abs(v-step.ans)<=step.tol;
  if(step.rate){ if(p.pct) v=v/100; return close(v,step.ans)||close(v/100,step.ans); }
  if(step.pct){ return close(v,step.ans)||close(v*100,step.ans); }
  return close(v,step.ans);
}

/* ================= Textformat: Karten, Rückmeldungen, Beispielboxen =================
   Schreibweise in den Inhalten (Karten-Rückseite b, Beispielboxen):
   - Zeilen mit "- " werden Aufzählung, "1. " nummerierte Schritte
   - "Begriff: Erklärung" wird Begriff fett, Erklärung daneben
   - "$ Formel" wird Formelbox (bricht auf dem Handy um)
   - "| Kopf | A | B" (mehrere Zeilen) wird Gegenüberstellung, auf dem Handy gestapelt
   - **fett**, Y^N hochgestellt, Y_POT tiefgestellt; Klammern mit Wörtern werden leiser gesetzt */
const nb=s=>String(s).replace(/(\d) (%|€|Prozentpunkte|Punkte|P\.|Tage|Minuten)/g,"$1&nbsp;$2");
const subsup=s=>s.replace(/([A-Za-zΠ*])\^([A-Za-z]+)/g,"$1<sup>$2</sup>").replace(/([A-Za-zΠ])_([A-Za-zΠ]{1,8})/g,"$1<sub>$2</sub>");
const quietParens=s=>s.replace(/\(([^()]{2,})\)/g,(m,x)=>/^[A-Za-zÄÖÜäöüß„]/.test(x)&&/[A-Za-zÄÖÜäöüß]{3,}/.test(x)&&!/[=+−·<>\/]/.test(x)?`<span class="pz">(${x})</span>`:m);
const inl=s=>quietParens(subsup(nb(String(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"))));
const fx=s=>subsup(nb(s));
const TERM=/^([^:=⇒]{1,42}): (.+)$/;
function cmp(rows){
  const h=rows[0], body=rows.slice(1);
  const tight=rows.every(r=>r.every(c=>String(c).replace(/\*\*/g,"").length<=18));
  return `<table class="cmp${tight?" tight":""}"><thead><tr>${h.map(x=>`<th>${inl(x)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr><th scope="row">${inl(r[0])}</th>${r.slice(1).map((c,j)=>`<td data-l="${esc(String(h[j+1]).replace(/\*\*/g,"").replace(/[\^_]/g,""))}"><span>${inl(c)}</span></td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function richText(b){
  const L=String(b).split("\n"); let out="", kind=null, items=[];
  const flush=()=>{ if(!kind) return;
    if(kind==="dl") out+=`<div class="dlist">${items.join("")}</div>`;
    else out+=`<${kind}>${items.map(x=>`<li>${x}</li>`).join("")}</${kind}>`;
    kind=null; items=[]; };
  const open=k=>{ if(kind!==k){ flush(); kind=k; } };
  for(let i=0;i<L.length;i++){ const l=L[i].trim(); let m;
    if(!l){ flush(); continue; }
    if((m=l.match(/^\$ ?(.*)$/))){ const box=`<div class="eq">${fx(m[1])}</div>`;
      if((kind==="ol"||kind==="ul")&&items.length) items[items.length-1]+=box; else { flush(); out+=box; } continue; }
    if(l.startsWith("|")){ flush(); const rows=[];
      while(i<L.length&&L[i].trim().startsWith("|")){ rows.push(L[i].trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim())); i++; }
      i--; out+=cmp(rows); continue; }
    if((m=l.match(/^[-•] (.*)$/))){ open("ul"); items.push(termInline(m[1])); continue; }
    if((m=l.match(/^\d+[.)] (.*)$/))){ open("ol"); items.push(termInline(m[1])); continue; }
    if((m=l.match(TERM))){ open("dl"); items.push(`<b>${inl(m[1])}</b><span>${inl(m[2])}</span>`); continue; }
    flush(); out+=`<p>${inl(l)}</p>`;
  }
  flush(); return out;
}
function termInline(s){ const m=s.match(TERM); return m? `<b>${inl(m[1])}:</b> ${inl(m[2])}` : inl(s); }
/* Beispielbox für Lektionen: links Label, rechts Inhalt */
function bsp(title,rows){ return `<div class="bsp"><p class="bh">${title}</p><div class="dlist">${rows.map(([k,v])=>`<b>${k}</b><span>${v.split("\n").map(x=>x.startsWith("$")?`<div class="eq">${fx(x.replace(/^\$ ?/,""))}</div>`:inl(x)).join("<br>")}</span>`).join("")}</div></div>`; }
/* Text kopieren, sonst zum Markieren anzeigen */
async function copyText(text,holder){
  try{ await navigator.clipboard.writeText(text); toast("Kopiert. In den Claude-Chat einfügen."); return true; }
  catch(x){ const h=$(holder); if(h){ h.innerHTML=`<textarea class="copybox" readonly>${esc(text)}</textarea>`; const t=h.querySelector("textarea"); t.focus(); t.select(); } toast("Text markiert, jetzt kopieren"); return false; }
}

/* ================= Modellbausteine (Schreibweise wie Kap. 5, van Treeck) ================= */
function baseModel(){
  for(let t=0;t<2000;t++){
    const c1=pick([.5,.6,.75,.8]), k=1/(1-c1), mT=c1*k;
    const n=pick([50,100,200]), i=pick([.02,.03,.04,.05,.06]);
    if(!isInt(n*i)) continue;
    const I=rint(2,8), d=I+n*i, c0=rint(1,6), T=rint(1,5), G=rint(1,5);
    const A=r(c0-c1*T+I+G), Y=r(k*A);
    if(A<=0||!isInt(Y)) continue;
    return {c1,k,mT,n,i,I,d,c0,T,G,A,Y};
  }
}
const MODEL_TXT=`Geschlossene Volkswirtschaft mit Staat: C = c<sub>0</sub> + c<sub>1</sub>(Y − T), I = d − n·i. Das Güterangebot Y<sup>A</sup> passt sich der Güternachfrage Y<sup>N</sup> an.`;
function modelTable(m,Ypot){
  const h=["c<sub>0</sub>","c<sub>1</sub>","T","d","n","i","G"], v=[m.c0,m.c1,m.T,m.d,m.n,m.i,m.G];
  if(Ypot!=null){ h.push("Y<sub>POT</sub>"); v.push(Ypot); }
  return `<div class="tablewrap"><table class="data"><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr><tr>${v.map(x=>`<td>${fmt(x)}</td>`).join("")}</tr></table></div>`;
}
function stepsY(m){
  return [
    {lab:"Investitionen I", why:"Zuerst die zinsabhängigen Investitionen einsetzen.", f:"I = d − n·i", calc:`I = ${fmt(m.d)} − ${m.n}·${fmt(m.i)} = ${fmt(m.I)}`, ans:m.I},
    {lab:"Klammer: autonome Nachfrage", why:"Alles, was nicht vom Einkommen abhängt. Steuern wirken nur mit c₁.", f:"c₀ − c₁·T + I + G", calc:`${fmt(m.c0)} − ${fmt(m.c1)}·${fmt(m.T)} + ${fmt(m.I)} + ${fmt(m.G)} = ${fmt(m.A)}`, ans:m.A},
    {lab:"Multiplikator 1/(1 − c₁)", why:"Jeder zusätzliche Euro Nachfrage erzeugt Einkommen, das zum Teil wieder konsumiert wird.", f:"1 / (1 − c₁)", calc:`1 / (1 − ${fmt(m.c1)}) = ${fmt(m.k)}`, ans:m.k},
    {lab:"Gleichgewichtiges Einkommen Y*", why:"Multiplikator mal Klammer.", f:"Y* = 1/(1 − c₁) · (c₀ − c₁T + d − n·i + G)", calc:`Y* = ${fmt(m.k)} · ${fmt(m.A)} = ${fmt(m.Y)}`, ans:m.Y, final:true}
  ];
}
function stepGap(m,Ypot){
  const gap=r(m.Y-Ypot);
  return {lab:"Output-Lücke Y* − Y<sub>POT</sub>", why:"Negativ heißt: die Wirtschaft produziert unter ihrem Potenzial (Unterbeschäftigung).", f:"Lücke = Y* − Y_POT", calc:`${fmt(m.Y)} − ${fmt(Ypot)} = ${fmt(gap)}`, ans:gap, final:true};
}
function dGSteps(m,gap){
  const dG=r(-gap/m.k);
  return [{lab:"Nötige Änderung ΔG", why:"Die Lücke muss geschlossen werden: ΔY = −Lücke. Staatsausgaben wirken mit dem vollen Multiplikator.", f:"ΔG = −Lücke / [1/(1 − c₁)]", calc:`ΔG = ${fmt(-gap)} / ${fmt(m.k)} = ${fmt(dG)}`, ans:dG, final:true}];
}
function dTSteps(m,gap){
  const dT=r(gap/m.mT);
  return [
    {lab:"Steuermultiplikator c₁/(1 − c₁)", why:"Eine Steuersenkung erhöht das verfügbare Einkommen, davon wird aber nur der Anteil c₁ konsumiert.", f:"m_T = c₁ / (1 − c₁)", calc:`${fmt(m.c1)} / (1 − ${fmt(m.c1)}) = ${fmt(m.mT)}`, ans:m.mT},
    {lab:"Nötige Änderung ΔT (Senkung negativ)", why:"ΔY = −m_T · ΔT, also ΔT = −ΔY / m_T.", f:"ΔT = Lücke / m_T", calc:`ΔT = ${fmt(gap)} / ${fmt(m.mT)} = ${fmt(dT)}`, ans:dT, final:true, sign:true}
  ];
}
function diSteps(m,gap){
  const dI=r(-gap/m.k), di=r(-dI/m.n), inew=r(m.i+di);
  return [
    {lab:"Nötige Änderung der Investitionen ΔI", why:"Investitionen wirken wie G mit dem vollen Multiplikator.", f:"ΔI = −Lücke / [1/(1 − c₁)]", calc:`ΔI = ${fmt(-gap)} / ${fmt(m.k)} = ${fmt(dI)}`, ans:dI},
    {lab:"Nötige Zinsänderung Δi", why:"Aus I = d − n·i folgt ΔI = −n·Δi. Antwort als Dezimalzahl (0,01 = 1 Prozentpunkt).", f:"Δi = −ΔI / n", calc:`Δi = −${par(dI)} / ${m.n} = ${fmt(di)}  (= ${fmt(di*100)} Prozentpunkte)`, ans:di, final:true, rate:true},
    {lab:"Neuer Zinssatz i", why:"Alter Zins plus Änderung.", f:"i_neu = i + Δi", calc:`${fmt(m.i)} + ${par(di)} = ${fmt(inew)}`, ans:inew, rate:true}
  ];

/* Gegebene Werte als Kacheln: brechen auf dem Handy um, statt quer aus dem Bild zu laufen */
function tbl(h,v){ return `<div class="vals">${h.map((x,i)=>`<div><span>${x}</span><b>${typeof v[i]==="number"?fmt(v[i]):v[i]}</b></div>`).join("")}</div>`; }
const VGR_TXT="Offene Volkswirtschaft. Internationale Einkommensströme werden vernachlässigt, sodass Nettoexporte = Leistungsbilanz = − Finanzierungssaldo des Auslands.";
/* Eine in sich stimmige Volkswirtschaft: alle Identitäten der VGR gelten */
function economy(){
  for(;;){
    const C=rint(5,14)*10, I=rint(2,6)*10, G=rint(1,5)*10, X=rint(1,6)*10, M=rint(1,6)*10;
    const Y=C+I+G+X-M; if(Y<=0) continue;
    const YSt=rint(1,4)*10, YF=rint(1,4)*10, YHH=Y-YSt-YF; if(YHH<=C*0.6) continue;
    const W=Math.round(Y*pick([.5,.55,.6,.65,.7])/10)*10, P=Y-W;
    return {C,I,G,X,M,Y,YSt,YF,YHH,W,P,NX:X-M,FSP:YHH+YF-C-I,FSS:YSt-G,FSA:M-X};
  }
}

      return {intro:"Nominales BIP = BIP zu laufenden Preisen, reales BIP = BIP in Preisen des Basisjahres.", table:"",
        q:`Das nominale BIP steigt von Jahr 1 auf Jahr 2 um ${fmt(gn)} %, das Preisniveau um ${fmt(pi)} %. Um wie viel Prozent steigt das reale BIP ungefähr?`,
        steps:[{lab:"Reales Wachstum (in %)", why:"Vom nominalen Wachstum wird das „Wachstum“ der Preise, also die Inflation, abgezogen.", f:"g_real ≈ g_nominal − Inflation", calc:`${fmt(gn)} % − ${fmt(pi)} % = ${fmt(g)} %`, ans:g, final:true, pct:true}]};
    }
    const g=pick([1,2,3.5,5,7]), T=r(70/g);
    return {intro:"Faustregel aus der Vorlesung: Bei 2 % realem Wachstum pro Jahr verdoppelt sich das reale BIP nach etwa 35 Jahren.", table:"",
      q:`Nach wie vielen Jahren verdoppelt sich das reale BIP ungefähr bei einem Wachstum von ${fmt(g)} % pro Jahr?`,
      steps:[{lab:"Verdopplungszeit in Jahren", why:"Faustregel: 70 geteilt durch die Wachstumsrate in Prozent (2 % → 35 Jahre).", f:"Jahre ≈ 70 / g", calc:`70 / ${fmt(g)} ≈ ${fmt(d2(T))} Jahre`, ans:T, final:true, tol:Math.max(1,T*.05)}]};
  }},
  marx:{name:"Klassen-Kreislauf nach Marx und Ricardo", short:"Klassenmodell", desc:"Aufgabenblatt 3: Löhne, Mehrwert, Investitionen und Ersparnis im Modell mit zwei oder drei Klassen.", kap:3, gen(){
    const N=pick([50,100,200]), w=pick([200,300,400,500]), W=N*w, Y=W*pick([1.2,1.25,1.4,1.5]);
    if(Math.random()<.5){
      const P=Y-W;
      return {intro:"Geschlossene Volkswirtschaft ohne Staat mit zwei Klassen. Arbeiter:innen erhalten einen Subsistenzlohn und geben ihn vollständig für Konsum aus. Kapitalist:innen investieren ihren gesamten Gewinn.", table:tbl(["Arbeiter:innen","Lohn je Person","Produktion Y"],[N,w,Y]),
        q:"Berechnen Sie die Gesamtlöhne W, den Gewinn Π, die Investitionen I und die Ersparnis S.",
        steps:[
          {lab:"Gesamtlöhne W", why:"Zahl der Arbeiter:innen mal Lohn.", f:"W = N · w", calc:`W = ${N} · ${w} = ${W}`, ans:W, final:true},
          {lab:"Gewinn (Mehrwert) Π", why:"Was die Arbeiter:innen über ihren Lohn hinaus produzieren.", f:"Π = Y − W", calc:`Π = ${Y} − ${W} = ${Y-W}`, ans:P, final:true},
          {lab:"Investitionen I", why:"Der gesamte Gewinn wird reinvestiert.", f:"I = Π", calc:`I = ${P}`, ans:P, final:true},
          {lab:"Ersparnis S", why:"Arbeiter:innen sparen nichts (W = C). Nur die Kapitalist:innen sparen, indem sie investieren.", f:"S = Y − C = Y − W = Π", calc:`S = ${Y} − ${W} = ${P}`, ans:P, final:true}]};
    }
    const R=Math.round((Y-W)*pick([.2,.3,.4])/100)*100, P=Y-W-R, C=W+R;
    return {intro:"Geschlossene Volkswirtschaft ohne Staat mit drei Klassen: Arbeiter:innen (konsumieren ihren Subsistenzlohn), Rentiers (konsumieren ihre gesamte Rente R) und Industriekapitalist:innen (investieren ihren gesamten Gewinn).", table:tbl(["Arbeiter:innen","Lohn je Person","Produktion Y","Rente R"],[N,w,Y,R]),
      q:"Berechnen Sie W, den Gewinn Π, den gesamten Konsum C sowie I und S.",
      steps:[
        {lab:"Gesamtlöhne W", why:"Zahl der Arbeiter:innen mal Lohn.", f:"W = N · w", calc:`W = ${N} · ${w} = ${W}`, ans:W, final:true},
        {lab:"Gewinn Π der Industriekapitalist:innen", why:"Die Rente an die Rentiers schmälert den Gewinn.", f:"Π = Y − W − R", calc:`Π = ${Y} − ${W} − ${R} = ${P}`, ans:P, final:true},
        {lab:"Konsum C", why:"Arbeiter:innen konsumieren ihren Lohn, Rentiers ihre Rente.", f:"C = W + R", calc:`C = ${W} + ${R} = ${C}`, ans:C, final:true},
        {lab:"Investitionen I = Ersparnis S", why:"Steigt die Rente, sinken bei gegebener Produktion Gewinn und Investitionen. Daraus folgt Ricardos Politik für die Kapitalisten, gegen die Grundbesitzer.", f:"I = S = Π", calc:`I = S = ${P}`, ans:P, final:true}]};
  }},
  ohne:{name:"Modell ohne Staat: Gleichgewicht und Ersparnis", short:"Ohne Staat", desc:"Aufgabenblatt 4: Y*, Konsum und Ersparnis; Wirkung höherer Investitionen oder Sparneigung.", kap:4, gen(){
    for(;;){
      const c1=pick([.5,.6,.75,.8]), k=1/(1-c1), c0=rint(2,10)*5, I=rint(2,10)*5, Y=r(k*(c0+I)); if(!isInt(Y)) continue;
      const C=r(c0+c1*Y), v=pick(["I","c0","c1"]);
      const head=[
        {lab:"Gleichgewichtiges BIP Y*", why:"Multiplikator mal autonome Nachfrage.", f:"Y* = 1/(1 − c₁) · (c₀ + I)", calc:`Y* = 1/(1 − ${fmt(c1)}) · (${c0} + ${I}) = ${fmt(k)} · ${c0+I} = ${fmt(Y)}`, ans:Y, final:true},
        {lab:"Ersparnis S", why:"S = Y − C mit C = c₀ + c₁Y. Ergebnis: S = I.", f:"S = Y − (c₀ + c₁Y)", calc:`S = ${fmt(Y)} − (${c0} + ${fmt(c1)}·${fmt(Y)}) = ${fmt(r(Y-C))}`, ans:r(Y-C), final:true}];
      if(v==="I"){ const dI=pick([5,10,20]), Y2=r(k*(c0+I+dI));
        return {deut:`Mehr Investitionen erhöhen Y* um das ${fmt(k)}-Fache: um ${fmt(r(Y2-Y))} statt nur um ${dI}. Die Ersparnis steigt genau um ${dI}: Weil mehr investiert wird, wird mehr gespart (I → S).`, intro:"Geschlossene Volkswirtschaft ohne Staat: C = c<sub>0</sub> + c<sub>1</sub>Y<sup>VT</sup>, Investitionen exogen. Y<sup>A</sup> passt sich Y<sup>N</sup> an.", table:tbl(["c<sub>0</sub>","c<sub>1</sub>","I"],[c0,c1,I]),
          q:`Berechnen Sie Y* und die Ersparnis S. Danach steigen die Investitionen um ${dI}: Wie hoch sind jetzt Y* und S?`,
          steps:[...head,
            {lab:"Neues Y*", why:"Höhere Investitionen wirken mit dem Multiplikator.", f:"Y*neu = 1/(1 − c₁) · (c₀ + I + ΔI)", calc:`Y*neu = ${fmt(k)} · ${c0+I+dI} = ${fmt(Y2)}`, ans:Y2, final:true},
            {lab:"Neue Ersparnis S", why:"Keynesianisch: Die Investitionen bestimmen die Ersparnis (I → S).", f:"S = I", calc:`S = ${I+dI}`, ans:I+dI, final:true}]}; }
      if(v==="c0"){ const dc=pick([5,10,-5,-10]); if(c0+dc<=0) continue; const Y2=r(k*(c0+dc+I));
        return {deut:`Der autonome Konsum ${dc>0?"steigt":"sinkt"} um ${Math.abs(dc)}, Y* ${dc>0?"steigt":"sinkt"} um das ${fmt(k)}-Fache, also um ${fmt(Math.abs(r(Y2-Y)))}.`, intro:"Geschlossene Volkswirtschaft ohne Staat: C = c<sub>0</sub> + c<sub>1</sub>Y<sup>VT</sup>, Investitionen exogen. Y<sup>A</sup> passt sich Y<sup>N</sup> an.", table:tbl(["c<sub>0</sub>","c<sub>1</sub>","I"],[c0,c1,I]),
          q:`Berechnen Sie Y* und die Ersparnis S. Danach ${dc>0?"steigt":"sinkt"} der autonome Konsum auf ${c0+dc}: Wie hoch ist jetzt Y*?`,
          steps:[...head,{lab:"Neues Y*", why:"Auch der autonome Konsum wirkt mit dem vollen Multiplikator.", f:"Y*neu = 1/(1 − c₁) · (c₀neu + I)", calc:`Y*neu = ${fmt(k)} · ${c0+dc+I} = ${fmt(Y2)}`, ans:Y2, final:true}]}; }
      const c1n=pick([.5,.6,.75].filter(x=>x<c1)); if(c1n===undefined) continue; const k2=1/(1-c1n), Y2=r(k2*(c0+I)); if(!nice(Y2,2)) continue;
      return {deut:`Sparparadox: Die Haushalte wollen mehr sparen, doch Y* fällt von ${fmt(Y)} auf ${fmt(Y2)}. Gespart wird am Ende genauso viel wie vorher: S = I = ${I}.`, intro:"Geschlossene Volkswirtschaft ohne Staat: C = c<sub>0</sub> + c<sub>1</sub>Y<sup>VT</sup>, Investitionen exogen. Y<sup>A</sup> passt sich Y<sup>N</sup> an.", table:tbl(["c<sub>0</sub>","c<sub>1</sub>","I"],[c0,c1,I]),
        q:`Berechnen Sie Y* und S. Danach wollen die Haushalte mehr sparen: c<sub>1</sub> fällt auf ${fmt(c1n)}. Wie hoch sind jetzt Y* und S? (Sparparadox)`,
        steps:[...head,
          {lab:"Neues Y*", why:"Der Multiplikator sinkt mit der Konsumneigung.", f:"Y*neu = 1/(1 − c₁neu) · (c₀ + I)", calc:`Y*neu = 1/(1 − ${fmt(c1n)}) · ${c0+I} = ${fmt(Y2)}`, ans:Y2, final:true},
          {lab:"Neue Ersparnis S", why:"Sparparadox: Alle wollen mehr sparen, das Einkommen sinkt, und gespart wird am Ende genauso viel wie vorher, nämlich I.", f:"S = Y − C = I", calc:`S = ${fmt(Y2)} − (${c0} + ${fmt(c1n)}·${fmt(Y2)}) = ${I}`, ans:I, final:true}]};
    }
  }},
  akz:{name:"Multiplikator mit Akzelerator", short:"Akzelerator", desc:"Aufgabenblatt 4, Aufgabe 4: Investitionen hängen auch von der Nachfrage ab, der Multiplikator wird größer.", kap:4, gen(){
    for(;;){
      const c1=pick([.4,.5,.6]), a=pick([.1,.2,.3]); if(c1+a>=.9) continue;
      const c0=rint(1,8), Ia=rint(1,6), k=1/(1-c1-a), Y=r(k*(c0+Ia)); if(!nice(Y,2)) continue;
      const v=Math.random()<.5;
      const head=[
        {lab:"Multiplikator 1/(1 − c₁ − a)", why:"Nachfragebedingte Investitionen verstärken die Kettenreaktion.", f:"1 / (1 − c₁ − a)", calc:`1 / (1 − ${fmt(c1)} − ${fmt(a)}) = ${fmt(d2(k))}`, ans:d2(k)},
        {lab:"Gleichgewichtiges BIP Y*", why:"Multiplikator mal autonome Nachfrage.", f:"Y* = (c₀ + I_aut) / (1 − c₁ − a)", calc:`Y* = (${c0} + ${Ia}) / ${fmt(r(1-c1-a))} = ${fmt(d2(Y))}`, ans:d2(Y), final:true}];
      if(v){ const Ia2=Ia+1, Y2=r((c0+Ia2)*k);
        return {deut:`Steigen die autonomen Investitionen um 1, steigt Y* um den Multiplikator ${fmt(d2(k))}. Er ist größer als ohne Akzelerator, weil auch die Investitionen auf die Nachfrage reagieren.`, intro:"Geschlossene Volkswirtschaft ohne Staat: C = c<sub>0</sub> + c<sub>1</sub>Y<sup>VT</sup>, I = I<sub>aut</sub> + aY<sup>N</sup>.", table:tbl(["c<sub>0</sub>","c<sub>1</sub>","I<sub>aut</sub>","a"],[c0,c1,Ia,a]),
          q:`Ermitteln Sie Y*. Wie hoch ist Y*, wenn die autonomen Investitionen auf ${Ia2} steigen?`,
          steps:[...head,{lab:"Neues Y*", why:"ΔY = Multiplikator · ΔI_aut.", f:"Y*neu = (c₀ + I_aut,neu) / (1 − c₁ − a)", calc:`Y*neu = ${c0+Ia2} / ${fmt(r(1-c1-a))} = ${fmt(d2(Y2))}`, ans:d2(Y2), final:true}]}; }
      const a2=r(a+.1); if(c1+a2>=.95) continue; const Y2=r((c0+Ia)/(1-c1-a2));
      return {deut:`Ein größerer Akzelerator macht den Nenner kleiner und den Multiplikator größer: Y* steigt von ${fmt(d2(Y))} auf ${fmt(d2(Y2))}, obwohl sich die autonomen Ausgaben nicht ändern.`, intro:"Geschlossene Volkswirtschaft ohne Staat: C = c<sub>0</sub> + c<sub>1</sub>Y<sup>VT</sup>, I = I<sub>aut</sub> + aY<sup>N</sup>.", table:tbl(["c<sub>0</sub>","c<sub>1</sub>","I<sub>aut</sub>","a"],[c0,c1,Ia,a]),
        q:`Ermitteln Sie Y*. Wie verändert sich Y*, wenn der Akzelerator a auf ${fmt(a2)} steigt?`,
        steps:[...head,{lab:"Neues Y*", why:"Der Nenner wird kleiner, der Multiplikator größer.", f:"Y*neu = (c₀ + I_aut) / (1 − c₁ − a_neu)", calc:`Y*neu = ${c0+Ia} / ${fmt(r(1-c1-a2))} = ${fmt(d2(Y2))}`, ans:d2(Y2), final:true}]};
    }
  }},
  voll:{name:"Vollbeschäftigung ohne Staat", short:"Vollbeschäftigung", desc:"Aufgabenblatt 4, Aufgabe 3: Herrscht Vollbeschäftigung? Welcher autonome Konsum wäre nötig?", kap:4, gen(){
    for(;;){
      const c1=pick([.5,.6,.75,.8]), k=1/(1-c1), c0=rint(1,6), I=rint(2,8), Y=r(k*(c0+I)); if(!nice(Y,1)) continue;
      const YV=Math.ceil(Y)+rint(1,6), dI=1, c0n=r(YV*(1-c1)-(I-dI)); if(!nice(c0n,2)||c0n<=0) continue;
      return {deut:`Y* liegt um ${fmt(r(YV-Y))} unter Y<sub>V</sub>: Gleichgewicht bei Unterbeschäftigung. Damit nach dem Rückgang der Investitionen Vollbeschäftigung herrscht, müsste der autonome Konsum auf ${fmt(c0n)} steigen.`, intro:"Geschlossene Volkswirtschaft ohne Staat: C = c<sub>0</sub> + c<sub>1</sub>Y<sup>VT</sup>. Y<sup>A</sup> passt sich Y<sup>N</sup> an.", table:tbl(["c<sub>0</sub>","c<sub>1</sub>","I","Y<sub>V</sub>"],[c0,c1,I,YV]),
        q:`a) Wie hoch ist Y*? Herrscht Vollbeschäftigung? b) Die Investitionen fallen um ${dI} auf ${I-dI}. Wie hoch müsste der autonome Konsum sein, damit Vollbeschäftigung erreicht wird?`,
        steps:[
          {lab:"a) Gleichgewichtiges BIP Y*", why:"Multiplikator mal autonome Nachfrage.", f:"Y* = 1/(1 − c₁) · (c₀ + I)", calc:`Y* = ${fmt(k)} · ${c0+I} = ${fmt(Y)}`, ans:Y, final:true},
          {lab:"Output-Lücke Y* − Y<sub>V</sub>", why:"Negativ: Gleichgewicht bei Unterbeschäftigung.", f:"Lücke = Y* − Y_V", calc:`${fmt(Y)} − ${YV} = ${fmt(r(Y-YV))}`, ans:r(Y-YV), final:true},
          {lab:"b) Nötiger autonomer Konsum c₀", why:"Y* = Y_V setzen und nach c₀ auflösen.", f:"c₀ = Y_V · (1 − c₁) − I", calc:`c₀ = ${YV} · ${fmt(r(1-c1))} − ${I-dI} = ${fmt(c0n)}`, ans:c0n, final:true}]};
    }
  }},
  lps:{name:"Lohn-Preis-Spirale", short:"Lohn-Preis-Spirale", desc:"Aufgabenblatt 6, Aufgabe 5: Nominallöhne, Preise und Reallöhne Periode für Periode.", kap:6, gen(){
    const p0=pick([1,2,3,4]), g=pick([1,2,3]), up=Math.random()<.7, s=up?g:-g;
    const w1=p0+s, w2=w1+s, w3=w2+s;
    return {intro:`Die Volkswirtschaft ist zunächst im Gleichgewicht im Sinne der NAIRU; Preise und Löhne steigen jährlich um ${p0} %. Ab t1 ${up?"liegt die Beschäftigung über":"liegt die Beschäftigung unter"} dem Gleichgewicht: Zwischen Lohnsetzung und Preissetzung klafft eine Lücke von ${up?"+":"−"}${g} %. Die Arbeitnehmer:innen fordern jeweils die erwartete Inflation (= Inflation der Vorperiode) plus die Lücke, die Unternehmen halten den Reallohn konstant.`, table:"",
      q:"Um wie viel Prozent steigen Nominallöhne, Preise und Reallöhne in t1, t2 und t3?",
      steps:[
        {lab:"Nominallöhne t1 (in %)", why:"Erwartete Inflation plus Lücke.", f:"ŵ₁ = π₀ + Lücke", calc:`${p0} ${up?"+":"−"} ${g} = ${w1} %`, ans:w1, final:true, pct:true},
        {lab:"Preise t1 (in %)", why:"Die Unternehmen geben die Lohnsteigerung voll an die Preise weiter.", f:"π₁ = ŵ₁", calc:`π₁ = ${w1} %`, ans:w1, final:true, pct:true},
        {lab:"Reallöhne t1 (in %)", why:"Reallohnwachstum = Nominallohnwachstum − Inflation.", f:"ŵ₁ − π₁", calc:`${w1} − ${w1} = 0 %`, ans:0, final:true, pct:true},
        {lab:"Nominallöhne und Preise t2 (in %)", why:"Die höhere Inflation wird nun erwartet, die Lücke kommt wieder obendrauf.", f:"ŵ₂ = π₁ + Lücke = π₂", calc:`${w1} ${up?"+":"−"} ${g} = ${w2} %`, ans:w2, final:true, pct:true},
        {lab:"Nominallöhne und Preise t3 (in %)", why:"Die Inflation beschleunigt sich, solange die Lücke besteht. Die Reallöhne bleiben trotzdem konstant.", f:"ŵ₃ = π₂ + Lücke = π₃", calc:`${w2} ${up?"+":"−"} ${g} = ${w3} %`, ans:w3, final:true, pct:true}]};
  }},
  zins:{name:"Zinsregel beim Inflation Targeting", short:"Zinsregel", desc:"Kapitel 6: Wie reagiert die Zentralbank, wenn die Inflation vom Ziel abweicht?", kap:6, gen(){
    let i0,k,pT=2,p,i1; do{ i0=pick([1,1.5,2,2.5,3,4]); k=pick([.5,1,1.5]); p=pick([0,1,1.5,3,4,5,6]); i1=r(i0+k*(p-pT)); }while(i1<0);
    return {intro:"Zinsregel: i<sub>t</sub> = i<sub>t−1</sub> + k · (π<sub>t−1</sub> − π<sup>T</sup>), mit k > 0. Alle Werte in Prozent.", table:tbl(["i<sub>t−1</sub>","k","π<sub>t−1</sub>","π<sup>T</sup>"],[i0,k,p,pT]),
      q:"Welchen Zins setzt die Zentralbank in der laufenden Periode?",
      steps:[
        {lab:"Abweichung vom Inflationsziel (in Prozentpunkten)", why:"Positiv: Die Inflation war zu hoch.", f:"π_{t−1} − π^T", calc:`${fmt(p)} − ${pT} = ${fmt(p-pT)}`, ans:r(p-pT)},
        {lab:"Neuer Zins i<sub>t</sub> (in %)", why:"Die Zentralbank ändert den Zins, bis das Inflationsziel erreicht und damit auch die Output-Lücke geschlossen ist.", f:"i_t = i_{t−1} + k · (π_{t−1} − π^T)", calc:`${fmt(i0)} + ${fmt(k)} · ${par(r(p-pT))} = ${fmt(i1)} %`, ans:i1, final:true, pct:true}]};
  }},
  kalecki:{name:"Kostenparadox mit kaleckianischer Konsumfunktion", short:"Kostenparadox", desc:"Aufgabenblatt 7, Aufgabe 1: Ein höherer Lohnanteil erhöht Einkommen und sogar die Gewinne.", kap:7, gen(){
    for(;;){
      const aW=pick([40,50,60]), aP=pick([20,30,40]), bW=pick([.8,.9]), bP=pick([.4,.5]), w=pick([.5,.6]), w2=r(w+.1), d=pick([80,100,120]), n=pick([0,.1,.12]);
      const den=r(1-bW*w-bP*(1-w)-n), den2=r(1-bW*w2-bP*(1-w2)-n); if(den<=.08||den2<=.05) continue;
      const A=aW+aP+d, Y=A/den, Y2=A/den2, P=(1-w)*Y, P2=(1-w2)*Y2;
      return {intro:`Geschlossene Volkswirtschaft ohne Staat. Y<sup>VT</sup> = W + Π mit W = ${fmt(w)}·Y. Kaleckianische Konsumfunktion: C = a<sub>W</sub> + a<sub>Π</sub> + b<sub>W</sub>W + b<sub>Π</sub>Π. Investitionen: I = d${n?" + nY":""}.`, table:tbl(["a<sub>W</sub>","a<sub>Π</sub>","b<sub>W</sub>","b<sub>Π</sub>","d"].concat(n?["n"]:[]),[aW,aP,bW,bP,d].concat(n?[n]:[])),
        q:`a) Wie hoch ist Y*? b) Der Lohnanteil steigt auf ${fmt(w2)}. Wie hoch ist nun Y*? c) Vergleichen Sie die Gewinne.`,
        steps:[
          {lab:"Nenner 1 − b<sub>W</sub>·w − b<sub>Π</sub>·(1 − w)"+(n?" − n":""), why:"Aus Y = a_W + a_Π + b_W·wY + b_Π·(1−w)Y + d"+(n?" + nY":"")+" alle Y-Terme nach links.", f:"1 − b_W·w − b_Π·(1 − w)"+(n?" − n":""), calc:`1 − ${fmt(bW)}·${fmt(w)} − ${fmt(bP)}·${fmt(r(1-w))}${n?" − "+fmt(n):""} = ${fmt(den)}`, ans:den},
          {lab:"a) Y*", why:"Autonome Ausgaben durch den Nenner.", f:"Y* = (a_W + a_Π + d) / Nenner", calc:`Y* = ${A} / ${fmt(den)} = ${fmt(d2(Y))}`, ans:d2(Y), final:true},
          {lab:"b) Y* bei höherem Lohnanteil", why:"Lohnbezieher:innen haben die höhere Konsumneigung, also steigt die Nachfrage.", f:"Y*neu = (a_W + a_Π + d) / Nenner_neu", calc:`Nenner_neu = ${fmt(den2)}, Y*neu = ${A} / ${fmt(den2)} = ${fmt(d2(Y2))}`, ans:d2(Y2), final:true},
          {lab:"c) Gewinne vorher", why:"Gewinnanteil mal Einkommen.", f:"Π = (1 − w) · Y*", calc:`Π = ${fmt(r(1-w))} · ${fmt(d2(Y))} = ${fmt(d2(P))}`, ans:d2(P), final:true},
          {lab:"c) Gewinne nachher", why:P2>P?"Kostenparadox: Alle Unternehmen zahlen höhere Löhne, und trotzdem steigen die Gewinne insgesamt.":"Hier sinken die Gewinne trotz höherer Nachfrage, weil ihr Anteil stärker fällt, als das Einkommen steigt. Das Einkommen steigt trotzdem.", f:"Π_neu = (1 − w_neu) · Y*neu", calc:`Π_neu = ${fmt(r(1-w2))} · ${fmt(d2(Y2))} = ${fmt(d2(P2))}`, ans:d2(P2), final:true}]};
    }
  }},
  gewinn:{name:"Kaleckis Gewinngleichung", short:"Gewinngleichung", desc:"Kapitel 8: Gewinne entstehen aus Investitionen, Konsum aus Gewinnen, Entsparen, Staatsdefizit und Exportüberschüssen.", kap:8, gen(){
    const CP=rint(2,8)*5, I=rint(4,12)*5, SW=rint(-2,4)*5, GT=rint(-2,4)*5, NX=rint(-3,5)*5, P=CP+I-SW+GT+NX;
    return {intro:"Kaleckis Gewinngleichung: Π<sub>netto</sub> = C<sub>Π</sub> + I − S<sub>W</sub> + (G − T) + (X − M), mit S<sub>W</sub> = W<sub>netto</sub> − C<sub>W</sub> (Ersparnis aus Löhnen).", table:tbl(["C<sub>Π</sub>","I","S<sub>W</sub>","G − T","X − M"],[CP,I,SW,GT,NX]),
      q:"Wie hoch sind die Nettogewinne?",
      steps:[{lab:"Nettogewinne Π<sub>netto</sub>", why:"„Gewinne ohne Investitionen“: Π kann auch steigen, wenn mehr aus Gewinnen konsumiert wird, die Lohnbezieher:innen entsparen (debt-led) oder die Nettoexporte steigen (export-led).", f:"Π = C_Π + I − S_W + (G − T) + (X − M)", calc:`Π = ${CP} + ${I} − ${par(SW)} + ${par(GT)} + ${par(NX)} = ${P}`, ans:P, final:true}]};
  }}
});

{id:"5-1", t:"Warum der Staat eingreifen soll", html:`
<p>Im keynesianischen Modell kann sich ein <b>Gleichgewicht bei Unterbeschäftigung</b> einstellen. Gründe sind etwa:</p>
<ul><li>Unternehmen investieren weniger, weil ihre Erwartungen sich eintrüben („animal spirits“).</li>
<li>Haushalte sparen aus Unsicherheit mehr („Angstsparen“), die Konsumneigung sinkt.</li>
<li>Das Ausland fragt weniger nach.</li></ul>
<p>Fallen Private und Ausland als Nachfrager aus, bleibt nur der Staat. Er hat zwei Hebel in der Nachfragegleichung <b>Y = C + I + G + (X − M)</b>:</p>
<div class="dlist"><b>Direkt</b><span>mehr staatliche Nachfrage G</span><b>Indirekt</b><span>mehr C und I durch niedrigere Steuern und Abgaben oder höhere Transfers und Subventionen</span></div>
<p>In Deutschland ist dieser Gedanke seit dem <b>Stabilitäts- und Wachstumsgesetz von 1967</b> Gesetz. Nach § 1 sollen Bund und Länder bei ihrer Finanzpolitik das gesamtwirtschaftliche Gleichgewicht beachten. Es besteht aus dem <b>magischen Viereck</b>:</p>
<ul><li>hoher Beschäftigungsstand</li><li>stabiles Preisniveau</li><li>außenwirtschaftliches Gleichgewicht</li><li>angemessenes und stetiges Wirtschaftswachstum</li></ul>
<p>„Magisch“ heißt es, weil sich die vier Ziele kaum alle gleichzeitig erreichen lassen. Zwischen ihnen gibt es Zielkonflikte, zum Beispiel kann Vollbeschäftigung die Inflation antreiben.</p>
${cmp([["","Prozyklisch","Antizyklisch"],["Wirkung","verstärkt Auf- und Abschwung","gleicht die Schwankungen der übrigen Nachfrage aus"],["Im Abschwung","z. B. Ausgaben kürzen","expansiv: mehr ausgeben, Steuern senken"],["Im Boom","zusätzlich anheizen","restriktiv: weniger ausgeben, Steuern erhöhen"],["Bewertung","soll mindestens vermieden werden","ideal"]])}`,

]},
{id:"5-2", t:"Instrumente und Kennzahlen der Fiskalpolitik", html:`
<p>Die Fiskalpolitik hat zwei Instrumente: die <b>Staatsausgaben G</b> und die <b>Einnahmen aus Steuern und Abgaben T</b> (bzw. den Steuersatz t).</p>
<div class="merk"><b>Wichtig fürs Modell</b>G ist nur die staatliche Nachfrage nach Konsum- und Investitionsgütern. Höhere Ausgaben für Arbeitslosenunterstützung oder Subventionen werden als <i>geringere Einnahmen T</i> verbucht, nicht als höheres G.</div>
<p>Der <b>Budgetsaldo</b> ist <b>BS = T − G</b>.</p>
<div class="dlist"><b>Expansiv</b><span>erhöht die Nachfrage: Mehrausgaben oder Einnahmensenkungen</span><b>Restriktiv</b><span>bremst die Nachfrage: Steuererhöhungen oder Ausgabenkürzungen</span></div>
${cmp([["","Automatische Stabilisatoren","Diskretionäre Politik"],["Wie?","wirken ohne politische Entscheidung","fallweise beschlossen"],["Beispiele","Steuereinnahmen, Ausgaben für Arbeitslose","Konjunkturprogramm, Energiepreispauschale"],["Im Abschwung","Das Defizit steigt von selbst.","Das Parlament muss handeln."]])}
<table class="kv">
<tr><td>Staatsquote</td><td>Ausgaben des Staates / BIP</td></tr>
<tr><td>Steuerquote</td><td>Steuereinnahmen / BIP</td></tr>
<tr><td>Abgabenquote</td><td>(Steuern + Abgaben) / BIP</td></tr>
<tr><td>Zinslastquote</td><td>Zinszahlungen des Staates / BIP bzw. / Steuereinnahmen</td></tr>
<tr><td>Finanzierungssaldo</td><td>Einnahmen − Ausgaben = Defizit · (−1)</td></tr>
<tr><td>Defizitquote</td><td>Defizit / BIP</td></tr>
<tr><td>Schuldenstandquote</td><td>Schuldenstand / BIP</td></tr></table>
<p>Die staatliche Endnachfrage G liegt in Deutschland deutlich unter der Staatsquote, weil die Ausgaben des Staates weit über Güter und Dienstleistungen hinausgehen, etwa Transfers und Zinsen.</p>`,

{id:"5-3", t:"Der Staatsausgabenmultiplikator", html:`
<p>Nimmt man den Staat ins keynesianische Modell auf, lautet die gesamtwirtschaftliche Nachfrage</p>
<div class="eq">Y<sup>N</sup> = C + I + G = c₀ + c₁·Y + I + G</div>
<p>Mit dem Angebot Y<sup>A</sup> = Y und der Gleichgewichtsbedingung Y<sup>A</sup> = Y<sup>N</sup> folgt</p>
<div class="eq">Y* = 1/(1 − c₁) · (c₀ + I + G)</div>
<p>Der Faktor <b>1/(1 − c₁)</b> ist der Multiplikator. Er gibt an, um wie viel der Gleichgewichtsoutput steigt, wenn der Staat 1 Mrd. € mehr ausgibt. Er ist größer als 1, weil das zusätzliche Einkommen zum Teil wieder konsumiert wird. Daraus entsteht neues Einkommen, davon wird wieder ein Teil konsumiert, und so weiter.</p>
<p>Im Bild: Höhere Staatsausgaben verschieben die Nachfragegerade parallel um ΔG nach oben. Das neue Gleichgewicht B liegt auf der 45°-Linie weiter rechts.</p>
${bsp("Beispiel",[["Gegeben","c₁ = 0,5, ΔG = 1, bisher Y* = 5"],["Rechnung","$ Multiplikator = 1/(1 − 0,5) = 2\n$ ΔY = 2 · 1 = 2"],["Ergebnis","Y* steigt von 5 auf 7."],["Deutung","Die Produktion steigt doppelt so stark wie die Staatsausgaben."]])}
{{fig:g1}}
<div class="merk"><b>Merksatz</b>ΔY = 1/(1 − c₁) · ΔG. Je höher die marginale Konsumneigung c₁, desto größer der Multiplikator.</div>`,
check:[
 {q:"c₁ = 0,8. Der Staat erhöht seine Ausgaben um 2 Mrd. €. Um wie viel steigt Y*?", o:["2 Mrd. €","8 Mrd. €","10 Mrd. €","1,6 Mrd. €"], a:2, ex:"Multiplikator 1/(1 − 0,8) = 5, also ΔY = 5 · 2 = 10 Mrd. €.", w:["2 Mrd. € wäre der Impuls ohne Multiplikator.", "8 Mrd. € = 4 · 2: Hier wurde mit dem Steuermultiplikator c₁/(1 − c₁) = 4 gerechnet. Für Staatsausgaben gilt 1/(1 − c₁) = 5.", null, "1,6 Mrd. € = 0,8 · 2 ist nur die erste Konsumrunde."]},
 {q:"Warum ist der Multiplikator größer als 1?", o:["Weil der Staat mehr ausgibt, als er einnimmt","Weil zusätzliches Einkommen teilweise wieder konsumiert wird","Weil die Preise steigen","Weil die Importe sinken"], a:1, ex:"Jede Ausgabe ist Einkommen für andere. Davon fließt der Anteil c₁ wieder in den Konsum und erzeugt weiteres Einkommen.", w:["Der Multiplikator wirkt auch bei ausgeglichenem Haushalt. Er entsteht aus der Kette von Ausgaben und Einkommen.", null, "Im Modell sind die Preise fest, es geht um Mengen.", "Importe kommen im einfachen Modell gar nicht vor."]}
]},
{id:"5-4", t:"Steuern: der kleinere Multiplikator", html:`
<p>Werden Steuern als fester Betrag T erhoben, konsumieren die Haushalte aus dem Nettoeinkommen: C = c₀ + c₁(Y − T). Damit gilt</p>
<div class="eq">Y* = 1/(1 − c₁) · (c₀ − c₁·T + I + G)</div>
<p>Der <b>Steuermultiplikator</b> ist dem Betrag nach <b>c₁/(1 − c₁)</b>. Er ist kleiner als der Staatsausgabenmultiplikator. Eine Steuersenkung erhöht nur das verfügbare Einkommen, und davon wird ein Teil gespart. Die Nachfragegerade verschiebt sich deshalb nur um c₁·ΔT. Staatsausgaben dagegen gehen in voller Höhe in die Nachfrage ein.</p>
<table class="kv"><tr><td>c₁ = 0,5</td><td>m<sub>G</sub> = 2, m<sub>T</sub> = 1</td></tr><tr><td>c₁ = 0,6</td><td>m<sub>G</sub> = 2,5, m<sub>T</sub> = 1,5</td></tr></table>
<p>Die Differenz m<sub>G</sub> − m<sub>T</sub> ist immer genau 1. Schätzungen des IWF zeigen ebenfalls: Ausgabenprogramme wirken stärker als Steuersenkungen, und in großen Volkswirtschaften stärker als in kleinen.</p>
<p>Weitere Punkte bei der Wahl zwischen Ausgaben und Steuersenkungen:</p>
<ul><li><b>Zeitverzögerung</b> zwischen Beschluss und Wirkung: Liegen Projekte „in der Schublade“?</li>
<li><b>Zeithorizont</b>: Lässt sich die Maßnahme zurücknehmen, wenn die Schwäche vorbei ist?</li>
<li><b>Struktur der Ausgaben</b>: konsumtiv oder investiv (Infrastruktur, Bildung). Keynes spitzte zu, sogar Geld zu vergraben und wieder ausgraben zu lassen würde Arbeitslosigkeit verringern; sinnvoller sei es aber, Häuser zu bauen.</li>
<li><b>Steuerart</b>: Am stärksten wirkt die Entlastung von Haushalten, die einen großen Teil ihres Einkommens konsumieren, also vor allem der unteren Einkommensgruppen.</li></ul>`,

{id:"5-5", t:"Die Dynamik der Staatsverschuldung", html:`
<p>Entscheidend ist nicht die absolute Schuld, sondern die <b>Schuldenstandquote</b>, also die Schuld im Verhältnis zum BIP. Mit</p>
<ul><li>d = Haushaltsdefizit in % des BIP</li><li>g = Wachstum des nominalen BIP</li><li>D = Schuldenstandquote</li></ul>
<p>gilt langfristig die Schuldenmechanik:</p>
<div class="eq">D = d / g</div>
${bsp("Beispiel",[["Gegeben","Defizit d = 3 % des BIP, nominales Wachstum g = 5 % pro Jahr"],["Rechnung","$ D = 3 % / 5 % = 0,6"],["Ergebnis","Die Schuldenstandquote bleibt dauerhaft bei 60 %."],["Deutung","Das ist die Logik der Grenzwerte im europäischen Stabilitäts- und Wachstumspakt. Ein dauerhaftes Defizit verträgt sich mit einer stabilen Quote, solange die Wirtschaft wächst."]])}
<div class="merk"><b>Paradox</b>Ist der Fiskalmultiplikator hoch, kann eine restriktive Politik, die das Defizit senkt, die Schuldenstandquote sogar erhöhen. Sie drückt das BIP-Wachstum, und der Nenner schrumpft schneller als die Schulden. Im Beispiel der Vorlesung fällt d von 3 % auf 2 %, g aber von 5 % auf −1 %; die Quote steigt in sieben Jahren von 60 % auf über 75 %.</div>`,

{id:"5-6", t:"Geldpolitik: der Zins als Hebel", html:`
<p>Bisher waren die Investitionen konstant. Jetzt hängen sie vom Zins ab:</p>
<div class="eq">I = d − n·i</div>
<ul><li><b>d</b>: zinsunabhängige Investitionen, das Niveau bei einem Zins von null</li>
<li><b>n</b>: wie stark die Investitionen auf den Zins reagieren</li></ul>
<p>Man stellt sich vor, alle Investitionsprojekte sind nach ihrer erwarteten Rendite sortiert. Je niedriger der Zins, desto mehr Projekte lohnen sich. Sinkt der Zins um einen Prozentpunkt, steigen die Investitionen um n Einheiten. Der Unterschied zwischen Nominal- und Realzins wird in diesem Kapitel vernachlässigt.</p>
<div class="eq">Y* = 1/(1 − c₁) · (c₀ + d − n·i)</div>
<p>Die Zentralbank kann den Zins (annahmegemäß perfekt) steuern. Im i/Y-Diagramm ist ihr Zins eine waagerechte <b>Zinslinie</b>. Die Kurve „gesamtwirtschaftliche Nachfrage = Angebot“ fällt: Je niedriger der Zins, desto höher der Output. Optimal ist ein Zins, bei dem sich beide beim Vollbeschäftigungsoutput Y<sub>V</sub> schneiden.</p>
<h3>Ein negativer Nachfrageschock</h3>
<ol class="steps"><li>c₀ oder d sinkt, die Nachfragekurve verschiebt sich nach links.</li><li>Bleibt die Zentralbank beim alten Zins, landet die Wirtschaft im Unterbeschäftigungsgleichgewicht B.</li><li>Senkt sie den Zins, etwa von 4 % auf 3,5 %, ist im Punkt C wieder Vollbeschäftigung erreicht.</li></ol>
{{fig:g2}}`,

{id:"5-7", t:"Grenzen der Geldpolitik", html:`
<p>Die Geldpolitik stößt an zwei Grenzen.</p>
<h3>1. Nominalzinsfalle</h3>
<p>Die Investitionen hängen vom Realzins ab:</p>
<div class="eq">Realzins = Nominalzins − Inflationsrate</div>
<p>Hat die Zentralbank den Nominalzins schon auf null gesenkt, ist der Realzins womöglich immer noch zu hoch, um Vollbeschäftigung zu erreichen. Im Beispiel der Vorlesung müsste der Nominalzins auf −0,5 % fallen.</p>
<h3>2. Investitionsfalle</h3>
<p>Sind die Erwartungen der Unternehmen („animal spirits“) am Boden, reagieren die Investitionen gar nicht mehr auf Zinssenkungen. Die gesamtwirtschaftliche Nachfragekurve verläuft dann <b>senkrecht</b>: Eine niedrigere Zinslinie ändert den Output nicht.</p>
{{fig:g3}}
<div class="merk"><b>Merksatz</b>In der Nominalzinsfalle und in der Investitionsfalle hilft nur noch expansive Fiskalpolitik. Sie verschiebt die Nachfragekurve nach rechts.</div>`,
check:[
 {q:"Wie verläuft die Nachfragekurve im i/Y-Diagramm in der Investitionsfalle?", o:["Waagerecht","Senkrecht","Steigend","Fallend wie immer"], a:1, ex:"Die Investitionen reagieren nicht auf den Zins, also ist der Output für jeden Zins gleich.", w:["Waagerecht ist die Zinslinie der Zentralbank, nicht die Nachfragekurve.", null, "Eine steigende Kurve hieße: höherer Zins, mehr Output. Das gibt das Modell nicht her.", "Fallend ist der Normalfall. In der Falle reagieren die Investitionen aber gar nicht auf den Zins."]},
 {q:"Nominalzins 0 %, Inflation −1 %. Wie hoch ist der Realzins?", o:["−1 %","0 %","1 %","2 %"], a:2, ex:"Realzins = 0 % − (−1 %) = 1 %. Bei Deflation kann der Realzins also trotz Nullzins positiv und zu hoch sein.", w:["Vorzeichen verwechselt: 0 − (−1) ergibt +1.", "0 % gilt nur bei einer Inflation von null.", null, "2 % hat mit der Rechnung nichts zu tun: 0 − (−1) = 1."]}
]},
{id:"5-8", t:"Offene Volkswirtschaft: wenn alle exportieren wollen", html:`
<p>In der offenen Volkswirtschaft gilt Y<sup>N</sup> = C + I + G + (X − M). Bleibt die heimische Nachfrage C + I + G hinter dem Potenzial zurück, und will die Politik keine keynesianischen Instrumente einsetzen, etwa wegen der Schuldenbremse, liegt ein Ausweg nahe: Vollbeschäftigung über hohe <b>Nettoexporte</b>.</p>
<p>Das Problem: Die Welt als Ganzes ist eine geschlossene Volkswirtschaft. Die Nettoexporte aller Länder summieren sich immer zu <b>null</b>. Der Exportüberschuss des einen Landes ist das Leistungsbilanzdefizit eines anderen, das sich dafür verschulden muss.</p>
<div class="merk"><b>Merksatz</b>Verlassen sich alle Länder darauf, dass das Ausland genug Nachfrage für ihre Exporte bereitstellt, entsteht ein weltweiter Nachfragemangel mit Arbeitslosigkeit. Unterschiedliche Sichtweisen auf Geld- und Fiskalpolitik führen so zu internationalen Konflikten.</div>`,
check:[
 {q:"Was ergibt die Summe der Nettoexporte aller Länder der Welt?", o:["Sie ist positiv","Sie ist null","Sie ist negativ","Sie hängt vom Wechselkurs ab"], a:1, ex:"Jedem Export eines Landes steht ein Import eines anderen gegenüber. Die Welt ist eine geschlossene Volkswirtschaft.", w:["Die Welt kann nicht an sich selbst mehr verkaufen, als sie kauft.", null, "Aus demselben Grund kann die Summe auch nicht negativ sein.", "Wechselkurse verschieben, wer Überschüsse hat. Die Summe bleibt null."]}
]},
{id:"5-9", t:"Die Kontroverse um Staatsdefizite", html:`
<p>Für den Essay brauchst du die Positionen der Denkschulen zur Fiskalpolitik. Das Skript stellt sie so gegenüber:</p>
<div class="dlist">
<b>Neoklassik</b><span>Die Kapazitäten sind auf Dauer ausgelastet, der Finanzmarkt koordiniert Sparen und Investieren. Höhere Staatsausgaben verdrängen private Ausgaben <span class="pz">(Crowding-out)</span>. Staatliche Defizite haben keine offensichtliche Berechtigung.</span>
<b>Neuklassik</b><span><b>Ricardianische Äquivalenz:</b> Rationale Haushalte erwarten, dass der Staat kreditfinanzierte Ausgaben später über höhere Steuern bezahlen muss. Sie sparen schon heute mehr. Der Multiplikator wird kleiner, im Extremfall null.</span>
<b>Keynesianismus</b><span>Der private Sektor will oft über lange Zeit weniger ausgeben, als er einnimmt. Dann soll der Staat ein Defizit hinnehmen. Bei unterausgelasteten Kapazitäten ziehen Staatsausgaben über den Multiplikator private Ausgaben mit <span class="pz">(Crowding-in)</span>. Ausgaben sind Steuersenkungen vorzuziehen.</span>
</div>
<p><b>Neuer Konsens.</b> Die Wirkung hängt davon ab, ob eine Konjunkturschwäche (Nachfrage) oder ein Angebotsproblem vorliegt. Die <b>Schuldenbremse</b> im Grundgesetz (seit 2009) begrenzt das strukturelle Defizit des Bundes auf 0,35 % des BIP; ein konjunkturelles Defizit ist erlaubt. Das Potenzial ist aber nicht beobachtbar. Wie groß die Output-Lücke ist und welcher Teil des Defizits als strukturell gilt, hängt deshalb von der Schätzung ab. Das Skript zeigt das am Beispiel Spaniens, wo die EU-Kommission fast das ganze Defizit als strukturell einstufte.</p>
<p><b>Hysterese.</b> Eine Konjunkturschwäche, die nicht bekämpft wird, kann zum strukturellen Problem werden: Langzeitarbeitslose verlieren Qualifikationen, Unternehmen stellen Investitionen zurück. Das betonen vor allem keynesianisch orientierte Ökonom:innen. Neoklassisch orientierte halten dagegen, Konjunkturpolitik könne Strukturschwächen verschleiern und nötige Reformen verschleppen.</p>`,
check:[
 {q:"Was besagt die Ricardianische Äquivalenz?", o:["Staatsausgaben wirken doppelt","Haushalte sparen heute mehr, weil sie künftige Steuererhöhungen erwarten","Steuern und Ausgaben haben denselben Multiplikator","Der Zins sinkt bei Defiziten"], a:1, ex:"Dadurch sinkt der Konsum, wenn G steigt, und der Multiplikator schrumpft bis im Extremfall auf null.", w:["Im Gegenteil: Nach der Ricardianischen Äquivalenz wirken Staatsausgaben schwächer.", null, "Das ist eine andere Frage. Hier geht es um das Sparverhalten der Haushalte.", "Über den Zins sagt die These nichts. Es geht um die erwarteten Steuern."]},
 {q:"Welches Defizit begrenzt die Schuldenbremse des Bundes auf 0,35 % des BIP?", o:["Das tatsächliche Defizit","Das konjunkturelle Defizit","Das strukturelle Defizit","Die Schuldenstandquote"], a:2, ex:"Konjunkturell bedingte Defizite sind erlaubt. Gerade deshalb ist so umstritten, wie das Potenzial geschätzt wird.", w:["Das tatsächliche Defizit darf höher sein, weil konjunkturelle Defizite erlaubt sind.", "Konjunkturelle Defizite sind ausdrücklich erlaubt.", null, "Die Schuldenbremse begrenzt das jährliche Defizit, nicht den Schuldenstand."]}
]}
]};

const CARDS={5:[
 {id:"c5-01", f:"Welche vier Ziele bilden das magische Viereck?", b:"- hoher Beschäftigungsstand\n- stabiles Preisniveau (geringe Inflation)\n- außenwirtschaftliches Gleichgewicht (keine dauerhaften Überschüsse oder Defizite mit dem Ausland)\n- angemessenes und stetiges Wachstum\nQuelle: Stabilitäts- und Wachstumsgesetz von 1967"},
 {id:"c5-02", f:"Warum heißt das Viereck „magisch“?", b:"Die vier Ziele lassen sich kaum **alle gleichzeitig** erreichen, es gibt Zielkonflikte.\nDie Ziele:\n- hoher Beschäftigungsstand\n- stabiles Preisniveau\n- außenwirtschaftliches Gleichgewicht\n- stetiges Wachstum\nBeispiel: Vollbeschäftigung kann die Inflation antreiben."},
 {id:"c5-03", f:"Antizyklische vs. prozyklische Fiskalpolitik", b:"| | Antizyklisch | Prozyklisch\n| Wirkung | gleicht Schwankungen aus | verstärkt den Konjunkturverlauf\n| Im Abschwung | expansiv: mehr ausgeben, Steuern senken | z. B. Ausgaben kürzen\n| Im Boom | restriktiv: weniger ausgeben, Steuern erhöhen | zusätzlich anheizen"},
 {id:"c5-04", f:"Budgetsaldo im Modell", b:"$ BS = T − G\nT: Einnahmen aus Steuern und Abgaben\nG: Staatsausgaben für Güter und Dienstleistungen\nPositiv: Überschuss\nNegativ: Defizit"},
 {id:"c5-05", f:"Wo werden Transfers wie Arbeitslosengeld im Modell verbucht?", b:"Als **geringere Einnahmen T**, nicht als höheres G.\nG ist nur die staatliche Nachfrage nach Konsum- und Investitionsgütern."},
 {id:"c5-06", f:"Automatischer Stabilisator: Definition und Beispiel", b:"Definition: Einnahmen oder Ausgaben, die **ohne Beschluss** mit der Konjunktur (dem Auf und Ab der Wirtschaft) schwanken und sie dämpfen\nBeispiele: Bürgergeld bzw. Arbeitslosenunterstützung, Steuereinnahmen\nIm Abschwung steigt das Defizit von selbst, im Aufschwung sinkt es."},
 {id:"c5-07", f:"Diskretionäre Fiskalpolitik", b:"**Fallweise** politisch beschlossene Maßnahmen.\nBeispiele: ein Konjunkturprogramm, die Energiepreispauschale\nGegenstück: automatische Stabilisatoren, die ohne Beschluss wirken"},
 {id:"c5-08", f:"Warum ist die Staatsquote deutlich höher als G/BIP?", b:"Die Staatsquote umfasst **alle** Ausgaben des Staates:\n- Güter und Dienstleistungen (das ist G)\n- Transfers (z. B. Renten)\n- Subventionen (Zuschüsse an Firmen)\n- Zinsen\nG ist also nur ein Teil."},
 {id:"c5-09", f:"Staatsausgabenmultiplikator: Formel und Bedeutung", b:"$ ΔY = 1/(1 − c₁) · ΔG\nBedeutung: Um so viel steigt Y*, wenn G um 1 steigt.\nGrößer als 1, weil zusätzliches Einkommen teilweise wieder konsumiert wird.\nBeispiel: c₁ = 0,8 ⇒ Multiplikator 5"},
 {id:"c5-10", f:"Steuermultiplikator (Betrag)", b:"$ m_T = c₁/(1 − c₁)\n$ Y* = 1/(1 − c₁) · (c₀ − c₁T + I + G)\nBeispiel: c₁ = 0,6 ⇒ m_T = 1,5 (und m_G = 2,5)"},
 {id:"c5-11", f:"Warum ist der Ausgabenmultiplikator größer als der Steuermultiplikator?", b:"| | Staatsausgaben | Steuersenkung\n| Erste Runde | gehen **voll** in die Nachfrage ein | erhöhen nur das verfügbare Einkommen, ein Teil (1 − c₁) wird gespart\n| Multiplikator | 1/(1 − c₁) | c₁/(1 − c₁)\nDie Differenz beträgt immer genau 1."},
 {id:"c5-12", f:"Vier Gesichtspunkte bei der Wahl zwischen Mehrausgaben und Steuersenkung", b:"- Zeitverzögerung: Liegen Projekte „in der Schublade“?\n- Zeithorizont: Lässt sich die Maßnahme zurücknehmen?\n- Struktur der Ausgaben: konsumtiv (z. B. Gehälter) oder investiv (z. B. Brücken, Schulen)\n- Steuerart: Wen entlastet die Senkung?"},
 {id:"c5-13", f:"Welche Haushalte sollte eine Steuersenkung entlasten, damit sie stark wirkt?", b:"Haushalte mit **hoher Konsumneigung**, also vor allem untere Einkommensgruppen.\nSie geben zusätzliches Einkommen fast ganz aus."},
 {id:"c5-14", f:"Schuldenmechanik: Formel und Beispiel", b:"$ D = d/g\nd: Defizitquote (Defizit in % des BIP)\ng: nominales Wachstum (inklusive Preissteigerung)\nD: Schuldenstandquote, auf die es langfristig hinausläuft\nBeispiel: d = 3 %, g = 5 % ⇒ D = 60 %"},
 {id:"c5-15", f:"Wie kann restriktive Fiskalpolitik die Schuldenstandquote erhöhen?", b:"1. Der Staat senkt das Defizit.\n2. Bei hohem Multiplikator sinkt das BIP-Wachstum stark.\n3. Der Nenner der Quote (das BIP) schrumpft schneller als die Schulden.\nBeispiel der Vorlesung: d sinkt von 3 % auf 2 %, g von 5 % auf −1 %. Die Quote steigt in sieben Jahren von 60 % auf über 75 %."},
 {id:"c5-16", f:"I = d − n·i: Was bedeuten d und n?", b:"$ I = d − n·i\nd: zinsunabhängige Investitionen (Niveau bei Zins null)\nn: Zinsreagibilität, also wie empfindlich die Investitionen auf den Zins reagieren\ni: Zins"},
 {id:"c5-17", f:"Was bedeutet I = d − n·i für den Handlungsspielraum der Geldpolitik?", b:"Die Zentralbank kann über den Zins die **Investitionen** und damit Y* steuern.\nJe größer n, desto wirksamer.\nBei n ≈ 0 (Investitionsfalle) ist sie machtlos."},
 {id:"c5-18", f:"Nominalzinsfalle", b:"Der **Nominalzins** ist schon bei null.\nDer **Realzins** ist aber noch zu hoch für Vollbeschäftigung:\n$ Realzins = Nominalzins − Inflation\nAusweg: nur Fiskalpolitik"},
 {id:"c5-19", f:"Investitionsfalle", b:"Die Investitionen reagieren wegen **pessimistischer Erwartungen** nicht auf den Zins.\nIm i/Y-Diagramm ist die Nachfragekurve **senkrecht**: Eine niedrigere Zinslinie ändert den Output nicht.\nAusweg: nur Fiskalpolitik"},
 {id:"c5-20", f:"Warum können nicht alle Länder Exportüberschüsse erzielen?", b:"Die Nettoexporte der Welt summieren sich **immer zu null**: Der Überschuss des einen ist das Defizit des anderen.\nStreben alle Überschüsse an, entsteht ein weltweiter Nachfragemangel mit Arbeitslosigkeit."},
 {id:"c5-21", f:"Verdrängung vs. Mitziehen (Crowding-out vs. Crowding-in)", b:"| | Verdrängung | Mitziehen\n| Sicht | neoklassisch | keynesianisch\n| Kapazitäten | voll ausgelastet | unterausgelastet (Maschinen und Arbeitskräfte stehen teilweise still)\n| Wirkung von Staatsausgaben | verdrängen private Ausgaben | ziehen über den Multiplikator private Ausgaben mit"},
 {id:"c5-22", f:"Ricardianische Äquivalenz", b:"1. Der Staat gibt mehr aus und finanziert das mit Krediten.\n2. Rationale Haushalte erwarten dafür künftige Steuererhöhungen.\n3. Sie sparen schon heute mehr, der Konsum sinkt.\nFolge: Der Multiplikator sinkt, im Extremfall auf null.\nDenkschule: Neuklassik"},
 {id:"c5-23", f:"Schuldenbremse: was ist begrenzt?", b:"Begrenzt: das **strukturelle** Defizit des Bundes auf 0,35 % des BIP (das Defizit, das auch bei normaler Konjunktur bliebe)\nErlaubt: **konjunkturelle** Defizite (durch einen Abschwung entstanden)\nProblem: Das Potenzial und damit die Output-Lücke sind nicht beobachtbar. Die Einordnung hängt von Schätzungen ab."},
 {id:"c5-24", f:"Hysterese", b:"Eine anhaltende Konjunkturschwäche senkt das **Produktionspotenzial dauerhaft**.\nGründe:\n- Langzeitarbeitslose verlieren Qualifikationen.\n- Unternehmen stellen Investitionen zurück.\nAus einem konjunkturellen wird ein strukturelles Problem."},

]};

 {id:"e5-1", pts:24, klausur:"Ersttermin 2024, Teil III",
  q:"„Die aktuelle Konjunkturschwäche erfordert eine aktive stabilisierende Fiskalpolitik. Wenn damit zu lange gewartet wird, wird das Produktionspotenzial langfristig sinken.“ Diskutieren Sie diese Aussage vor dem Hintergrund der Vorlesungsinhalte. Berücksichtigen Sie unterschiedliche theoretische Perspektiven.",
